              out.push(PDF.card(`
                <div style="font-size:18px;font-weight:800;">${pad2(i + 1)}  ${esc(x.titleKo)}${on ? ' <span style="font-size:14px;color:#1d4ed8;">선택</span>' : ""}
                  <span style="font-size:14px;color:#64748b;font-weight:700;margin-left:6px;">${esc(x.axis)}</span></div>
                <div style="font-size:15px;color:#64748b;">${esc(x.titleEn)}</div>
                <div style="font-size:16px;line-height:1.75;margin-top:8px;white-space:pre-line;">${esc(x.description)}</div>
                ${PDF.bar(x.value)}
                <div style="font-size:14px;color:#64748b;">목표 수준 · ${esc(x.level)} (${esc(x.value)})</div>
                ${x.interactionHint ? `<div style="font-size:14px;color:#1d4ed8;margin-top:5px;">인터랙션 변환 · ${esc(x.interactionHint)}</div>` : ""}
                ${x.motionSpec ? `<div style="font-size:14px;color:#334155;margin-top:4px;">움직임 · ${esc(x.motionSpec)}</div>` : ""}
                ${x.graphicSpec ? `<div style="font-size:14px;color:#334155;margin-top:4px;">그래픽 · ${esc(x.graphicSpec)}</div>` : ""}
                ${x.check ? `<div style="font-size:14px;color:#64748b;margin-top:4px;">확인 방법 · ${esc(x.check)}</div>` : ""}`));
            });
          }

          if (state.interactions.length) {
            out.push(PDF.heading("04", "인터랙션 제안", "Digital Interaction"));
            const ms = state.interactionPlan && state.interactionPlan.materialSystem;
            if (ms && (ms.nameKo || ms.nameEn)) out.push(PDF.card(`<div style="font-size:14px;font-weight:700;color:#1d4ed8;">감성 물성 시스템</div>
              <div style="font-size:18px;font-weight:800;">${esc(ms.nameKo)}</div>
              <div style="font-size:15px;color:#64748b;">${esc(ms.nameEn)}</div>
              ${PDF.kv("기본 표면", ms.surface)}

              ${PDF.kv("과장 방식", ms.exaggeration)}
              ${PDF.kv("적용 요소 (리퀴드 글라스 8개 중 6개)", state.interactionPlan.elements.map(elementName).join(" · "))}`));
            out.push(PDF.image("interaction", state.interactions.length > INTERACTION_COUNT ? "인터랙션 컨셉 보드 01–04" : "인터랙션 컨셉 보드"));
            if (state.interactions.length > INTERACTION_COUNT) out.push(PDF.image("interactionB", "인터랙션 컨셉 보드 05–08"));
            state.interactions.forEach((x, i) => {
              out.push(PDF.card(`
                <div style="font-size:18px;font-weight:800;">${pad2(i + 1)}  ${esc(x.nameKo)}

                ${PDF.kv("Timing", x.timing)}

                ${PDF.kv("Visual Behavior", x.visualBehavior)}
                ${x.propertyTranslation && x.propertyTranslation.length
                  ? PDF.kv("물성 → 반응", x.propertyTranslation.map(t => `${t.property}${t.value !== "" ? ` ${t.value}` : ""} → ${t.effect}`).join("\n"))
                  : (x.propertyMapping && x.propertyMapping.length ? `<div style="font-size:14px;color:#64748b;margin-top:8px;">연결 물성 · ${esc(x.propertyMapping.join(" · "))}</div>` : "")}

      /* 이미지가 끝내 로드되지 않아도 PDF 생성이 멈추지 않도록 기다림에 상한을 둡니다. */
      function waitForImages(root, timeoutMs) {
        const imgs = Array.from(root.querySelectorAll("img"));
        const all = Promise.all(imgs.map(im => (im.complete && im.naturalWidth)
          ? Promise.resolve()
          : new Promise(res => { im.onload = res; im.onerror = res; })));
        return Promise.race([all, new Promise(res => setTimeout(res, timeoutMs || 6000))]);
      }

      async function exportPdf() {
        const h2c = window.html2canvas;
        const JsPDF = window.jspdf && window.jspdf.jsPDF;
        if (!h2c || !JsPDF) {
          toast("PDF 모듈을 불러오지 못했습니다. 텍스트로 내려받습니다.", "error");
          downloadText(`interaction-report-${Date.now()}.txt`, buildReport());
          return false;
        }

        const holder = document.createElement("div");
        holder.setAttribute("aria-hidden", "true");
        holder.style.cssText = `position:absolute;left:-10000px;top:0;width:${PDF.W}px;background:#ffffff;`;
        holder.innerHTML = PDF.document();
        document.body.appendChild(holder);

        try {
          await waitForImages(holder);
          if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) { /* 무시 */ } }

          const pdf = new JsPDF({ unit: "pt", format: "a4" });
          const pw = pdf.internal.pageSize.getWidth();
          const ph = pdf.internal.pageSize.getHeight();
          const M = 34;
          const maxW = pw - M * 2;
          const maxH = ph - M * 2;
          let y = M;
          let placed = 0;

          const blocks = Array.from(holder.children);
          for (const b of blocks) {
            let canvas, jpg;
            try {
              canvas = await h2c(b, { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false });
              jpg = canvas.toDataURL("image/jpeg", 0.92);
            } catch (e) { console.warn("PDF 블록 캡처 실패", e); continue; }
            let w = maxW;
            let h = canvas.height * maxW / canvas.width;
            if (h > maxH) { h = maxH; w = canvas.width * maxH / canvas.height; }
            if (placed && y + h > ph - M) { pdf.addPage(); y = M; }
            pdf.addImage(jpg, "JPEG", M + (maxW - w) / 2, y, w, h);
            y += h + 6;
            placed += 1;
          }
          if (!placed) throw new Error("리포트에 담을 내용이 없습니다.");
          pdf.save(`Interaction-리포트-${(state.keyword || "무제").replace(/[\\/:*?"<>|]/g, "_").slice(0, 20)}.pdf`);
          return true;
        } finally {
          if (holder.parentNode) holder.parentNode.removeChild(holder);
        }
      }

      function downloadText(name, text) {
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      /* =========================================================
         14. ACTIONS
         ========================================================= */
      /* 한 번에 받으면 응답이 길어 연결이 끊기기 쉬워 3개 + 3개로 나눠 요청합니다. */
      function interactionPartNote(from, count, existing, plan) {
        const to = from + count - 1;
        let s;
        if (!plan) {
          s = `[이번 요청 범위 — 반드시 지킴]\n먼저 8개 요소 중 이번 감성에 맞는 6개를 골라 "selectedElements"에 제안 순서대로 번호 6개를 넣고, "materialSystem"을 정의합니다. 그다음 "interactions"에는 selectedElements의 앞 ${count}개 요소에 해당하는 제안 ${count}개만 순서대로 넣습니다. 앞의 '정확히 ${INTERACTION_COUNT}개' 규칙보다 이 범위 규칙이 우선합니다.`;
        } else {
          s = `[이번 요청 범위 — 반드시 지킴]\n전체 ${INTERACTION_COUNT}개 제안 중 ${from}~${to}번째 ${count}개만 반환합니다. 이번에 맡을 요소(순서대로): ${plan.elements.slice(from - 1, to).map(n => `${n}. ${elementName(n)}`).join(" / ")}. "interactions" 배열에 정확히 ${count}개를 넣습니다. 앞의 '정확히 ${INTERACTION_COUNT}개' 규칙보다 이 범위 규칙이 우선합니다.`;
        }
        if (existing.length) {
          s += `\n이미 제안된 항목입니다. 이것과 겹치지 않는 다른 모션 원리·적용 맥락·입력 방식을 씁니다:\n` +
            existing.map((m, i) => `${i + 1}. [${m.frame || ""}] ${m.nameKo} — ${m.type} / ${m.digitalPattern || ""} / ${m.phoneContext || ""} / ${m.gesture || ""}`).join("\n") +
            `\n모든 항목은 휴대폰 화면 터치 조작 중심으로 하고, 앞 항목과 다른 제스처를 씁니다.`;
        } else {
          s += `\n이번 ${count}개는 모두 휴대폰 화면 터치 조작 중심으로 하고, 서로 다른 제스처를 씁니다.`;
        }
        return s;
      }

      /* 각 단계의 '수정 지시'가 다루는 항목 목록과 다시 쓰는 방법 */
      const EDIT_STAGES = {
        emotion: {
          insId: "ins-emotion", key: "concepts", label: "감성 해석",
          list: () => state.concepts,

          hasDown: () => !!(state.perceptions.length || state.properties.length || state.interactions.length),
          downLabel: "지각·물성·인터랙션",
          clearDown: () => ({ slots: ["perception", "property", "interaction", "interactionB"], patch: { perceptions: [], perceptionIds: [], properties: [], propertyIds: [], interactions: [] } }),
          all: ins => Actions.generateConcepts(ins),
          image: () => Actions.generateEmotionImage()
        },
        perception: {

          list: () => state.perceptions,
          title: it => it.titleKo,
          norm: d => normPerceptions(d),
          prompt: ins => PROMPTS.PERCEPTION(state.keyword, selectedConcept(), ins),
          cap: 16000,
          isSelected: it => state.perceptionIds.includes(it.id),
          hasDown: () => !!(state.properties.length || state.interactions.length),
          downLabel: "물성·인터랙션",
          clearDown: () => ({ slots: ["property", "interaction", "interactionB"], patch: { properties: [], propertyIds: [], interactions: [] } }),
          all: ins => Actions.generatePerceptions(ins),
          image: () => Actions.generatePerceptionImage()
        },
        property: {
          insId: "ins-property", key: "properties", label: "인터랙션 물성",
          list: () => state.properties,
          title: it => it.titleKo,
          norm: d => normProperties(d),
          prompt: ins => PROMPTS.PROPERTY(selectedConcept(), selectedPerceptions(), ins),
          cap: 16000,
          isSelected: it => state.propertyIds.includes(it.id),
          hasDown: () => !!state.interactions.length,
          downLabel: "인터랙션",
          clearDown: () => ({ slots: ["interaction", "interactionB"], patch: { interactions: [] } }),
          all: ins => Actions.generateProperties(ins),
          image: () => Actions.generatePropertyImage()
        },
        interaction: {
          insId: "ins-interaction", key: "interactions", label: "인터랙션 제안",
          list: () => state.interactions,
          title: it => it.nameKo,
          norm: d => normInteractions(d),
          prompt: ins => PROMPTS.INTERACTION_DIGITAL(selectedConcept() || { nameKo: state.keyword, nameEn: "" }, selectedProperties(), ins, state.interactionPlan),
          cap: 14000,
          isSelected: () => false,
          hasDown: () => false,
          all: ins => Actions.generateInteractions(ins),
          image: () => Actions.generateInteractionImage()
        }
      };

      /* 선택한 항목의 현재 값(0부터) — 목록이 바뀌어 범위를 벗어나면 첫 항목으로 */
      function editTargetOf(stage) {
        const t = state.editTarget[stage];
        if (t === "all") return "all";
        const n = EDIT_STAGES[stage].list().length;
        return Number.isInteger(t) && t >= 0 && t < n ? t : 0;
      }

      function stripItem(it) {
        const o = {};
        Object.keys(it || {}).forEach(k => { if (k !== "id" && k !== "index") o[k] = it[k]; });
        return o;
      }

      function reviseNote(def, idx, ins) {
        const list = def.list();
        const others = list.map((it, i) => i === idx ? null : `${pad2(i + 1)}. ${def.title(it)}`).filter(Boolean).join("\n");
        const frameNote = list[idx] && list[idx].frame ? `\n이 항목은 인터랙션 요소 "${list[idx].frame}"에 적용됩니다. 수정 후에도 같은 요소를 맡고, 같은 감성 물성 시스템을 조금 과장해 적용합니다.` : "";
        return `[항목 단위 수정 — 이 규칙이 앞의 개수 규칙보다 우선합니다]
전체 ${list.length}개 중 ${pad2(idx + 1)}번 항목 하나만 아래 수정 지시에 따라 다시 작성합니다. "${def.key}" 배열에 정확히 1개만 넣습니다. 같은 형식(JSON 키)을 그대로 지킵니다.${frameNote}
수정 지시: ${ins || "지시가 따로 없습니다. 같은 역할을 유지하면서 더 완성도 있고 분명하게 다시 작성합니다."}
현재 ${pad2(idx + 1)}번 항목: ${JSON.stringify(stripItem(list[idx]))}
그대로 유지되는 다른 항목입니다. 이것들과 겹치지 않게 합니다:
${others}`;
      }

      /* 앞 단계 선택을 바꾸면 이후 결과가 지워지므로 먼저 확인합니다. */
      const confirmDiscard = what => window.confirm(`선택을 바꾸면 이미 만든 ${what} 결과가 지워집니다. 계속할까요?`);

      const Actions = {
        /* ---- 접속 / 프로젝트 ---- */
        validateKey() {
          const el = document.getElementById("api-input");
          const key = el ? el.value.trim() : "";
          if (!key) { setState({ errorMsg: "API 키를 입력해 주세요." }); return; }
          if (!/^sk-/.test(key)) { setState({ errorMsg: "OpenAI API 키는 sk- 로 시작합니다. 키를 다시 확인해 주세요." }); return; }
          state.apiKey = key;
          saveSession();
          setState({ step: 0, errorMsg: null }, true);
        },
        useSample(i) { if (SAMPLE_KEYWORDS[i]) { drafts["keyword-input"] = SAMPLE_KEYWORDS[i]; render(); } },

        startNewProject() {
          persist(false);
          state.simPrompt = null; state.editTarget = {}; state.lightbox = null;
          Object.assign(state, blankProject());
          knownRev = 0; lastSavedSig = "";
          drafts["keyword-input"] = "";
          drafts["note-input"] = "";
          setState({ step: 1 }, true);
        },

        async openProject(id) {
          persist(false);
          let row = Store.get(id);
          /* 앱이 바로 종료되어 localStorage 기록이 늦었던 경우, IndexedDB 사본이 더 최신일 수 있습니다. */
          const copy = await ProjectDB.get(id);
          if (copy && copy.data && (!row || (copy.rev || 0) > (row.rev || 0))) { row = copy; Store.putRow(copy); }
          if (!row || !row.data) { toast("프로젝트를 찾지 못했습니다.", "error"); return; }
          state.simPrompt = null; state.editTarget = {}; state.lightbox = null;
          applyProjectData(row);

          /* 구버전에서 step이 1로 잘못 저장된 프로젝트도 데이터 기준으로 정상 복구합니다. */
          setState({ step: progressStep() }, true);
          await loadImagesFor(state.projectId);
        },

        deleteProject(id) {
          if (!window.confirm("이 프로젝트와 생성된 이미지를 모두 지웁니다. 계속할까요?")) return;
          Store.remove(id);
          /* 지금 열려 있는 프로젝트였다면 비워 둡니다. 그러지 않으면 자동 저장이 되살립니다. */
          if (state.projectId === id) { Object.assign(state, blankProject()); knownRev = 0; lastSavedSig = ""; }
          toast("프로젝트를 삭제했습니다.");
          render();
        },

        goHome() {
          /* 현재 분석 진행도를 먼저 저장하고 홈으로 이동합니다.
             이후 홈에서 자동 저장이 실행돼도 snapshot()이 progressStep()을 사용하므로 진행 단계가 1로 되돌아가지 않습니다. */
          persist(false);
          setState({ step: 0 }, true);
        },
        saveNow() { const r = persist(true); if (r === "empty") toast("아직 저장할 내용이 없습니다."); },

        setEditTarget(stage, v) {
          state.editTarget = Object.assign({}, state.editTarget, { [stage]: v === "all" ? "all" : Number(v) });
          render();
        },
        async reviseStage(stage) {
          const def = EDIT_STAGES[stage];
          if (!def) return;
          const ins = draft(def.insId).trim();
          const target = editTargetOf(stage);
          if (target === "all") {
            if (await def.all(ins)) { drafts[def.insId] = ""; render(); }
            return;
          }
          const list = def.list();
          const item = list[target];
          if (!item) return;
          const downstream = def.isSelected(item) && def.hasDown();
          if (downstream && !confirmDiscard(def.downLabel)) return;

          const data = await withLoading(`${def.label} ${pad2(target + 1)}번을 수정하고 있습니다`, () =>
            callText(SYSTEM, def.prompt(reviseNote(def, target, ins)), def.cap));
          if (!data) return;
          const fresh = def.norm(data)[0];
          if (!fresh) { setState({ errorMsg: "수정된 항목을 받지 못했습니다. 다시 시도해 주세요." }); return; }
          fresh.id = item.id;
          fresh.index = item.index;
          if (stage === "interaction" && item.frame) { fresh.frame = item.frame; fresh.element = item.element; }
          const next = list.slice();
          next[target] = fresh;
          const patch = { [def.key]: next };
          if (downstream) {
            const d = def.clearDown();
            await Actions.clearImageSlots(d.slots);
            Object.assign(patch, d.patch);
            const imgs = Object.assign({}, state.images);
            d.slots.forEach(s => { imgs[s] = null; });
            patch.images = imgs;
          }
          drafts[def.insId] = "";
          setState(patch);
          persist(false);
          toast(`${pad2(target + 1)}번 항목을 수정했습니다. 이미지를 다시 만듭니다.`);
          await def.image();
        },
        openSimPrompt() {
          if (!state.interactions.length) { toast("먼저 인터랙션 제안을 만들어 주세요.", "error"); return; }
          setState({ simPrompt: buildSimPrompt() });
        },
        closeSimPrompt() { setState({ simPrompt: null }); },
        copySimPrompt() {
          const text = state.simPrompt || "";
          const fallback = () => {
            const ta = document.getElementById("sim-prompt-text");
            if (ta) { ta.focus(); ta.select(); try { ta.setSelectionRange(0, text.length); } catch (e) { /* 무시 */ } }
            let ok = false;
            try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
            toast(ok ? "프롬프트를 복사했습니다." : "자동 복사가 막혀 있습니다. 글을 길게 눌러 직접 복사해 주세요.", ok ? undefined : "error");
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => toast("프롬프트를 복사했습니다.")).catch(fallback);
          } else fallback();
        },
        downloadSimPrompt() {
          downloadText(`simulator-prompt-${(state.keyword || "무제").replace(/[\\/:*?"<>|\s]/g, "_").slice(0, 20)}.txt`, state.simPrompt || "");
        },
        copyReport() {
          const text = buildReport();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
              .then(() => toast("리포트를 클립보드에 복사했습니다."))
              .catch(() => downloadText("interaction-report.txt", text));
          } else {
            downloadText("interaction-report.txt", text);
          }
        },
        downloadReport() { downloadText(`interaction-report-${Date.now()}.txt`, buildReport()); },
        async exportPdf() {
          setState({ isAnalyzing: true, loadingMsg: "리포트를 PDF로 만들고 있습니다", errorMsg: null });
          try {
            const ok = await exportPdf();
            setState({ isAnalyzing: false });
            if (ok) toast("PDF를 내려받았습니다.");
          } catch (err) {
            console.error(err);
            setState({ isAnalyzing: false, errorMsg: "PDF를 만들지 못했습니다. 잠시 후 다시 시도해 주세요." });
          }
        },

        cancel() { if (activeController) activeController.abort(); },

        /* ---- 이미지 공통 ---- */
        openLightbox(slot) { setState({ lightbox: slot }); },
        closeLightbox() { setState({ lightbox: null }); },
        downloadImage(slot) {
          const url = state.images[slot];
          if (!url) return;
          const a = document.createElement("a");
          a.href = url;
          a.download = `interaction-${slot}-${Date.now()}.png`;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
        },
        async saveImage(slot, dataUrl, sig) {
          state.images = Object.assign({}, state.images, { [slot]: dataUrl });
          state.imageSigs = Object.assign({}, state.imageSigs, { [slot]: sig || imageSig(slot) });
          ImageDB.put(state.projectId, slot, dataUrl, state.imageSigs[slot]).then(ok => { if (!ok) toast("이 기기에 이미지를 저장하지 못했습니다. 이미지 '저장' 버튼으로 내려받아 두세요.", "error"); });
        },
        async clearImageSlots(slots) {
          const targets = Array.from(new Set(arr(slots).filter(slot => IMAGE_SLOTS.includes(slot))));
          if (!targets.length) return;
          const nextImages = Object.assign({}, state.images);
          const nextSigs = Object.assign({}, state.imageSigs);
          targets.forEach(slot => { nextImages[slot] = null; delete nextSigs[slot]; });
          state.images = nextImages;
          state.imageSigs = nextSigs;
          await ImageDB.removeSlots(state.projectId, targets);
        },

        /* ---- 1단계 → 감성 해석 ---- */
        async generateConcepts(instruction) {
          const kw = (drafts["keyword-input"] !== undefined ? drafts["keyword-input"] : state.keyword).trim();
          const note = (drafts["note-input"] !== undefined ? drafts["note-input"] : state.note).trim();
          if (!kw) { setState({ errorMsg: "감성 키워드를 입력해 주세요." }); return; }
          state.keyword = kw;
          state.note = note;

          const data = await withLoading("감성을 세가지 경험으로 해석하고 있습니다", () =>
            callText(SYSTEM, PROMPTS.EMOTION(kw, note, instruction || "")));
          if (!data) return;

          const concepts = normConcepts(data);
          const associations = normAssociations(data);
          if (!concepts.length) { setState({ errorMsg: "감성 해석을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          await Actions.clearImageSlots(["emotion", "perception", "property", "interaction", "interactionB"]);
          setState({
            associations,
            concepts,
            conceptIds: [],
            perceptions: [], perceptionIds: [],
            properties: [], propertyIds: [],
            interactions: [],
            images: { emotion: null, perception: null, property: null, interaction: null, interactionB: null },
            step: 2
          }, true);
          persist(false);
          await Actions.generateEmotionImage();
          return true;
        },
        async regenerateConcepts() {
          const ins = draft("ins-emotion").trim();
          if (await Actions.generateConcepts(ins)) { drafts["ins-emotion"] = ""; render(); }
        },
        async generateEmotionImage() {
          if (!state.concepts.length) return;
          const sig = imageSig("emotion");
          const url = await withLoading("감성 해석 통합 이미지를 만들고 있습니다", () =>
            callImage(IMG.emotion(state.concepts)));
          if (!url) return;
          await Actions.saveImage("emotion", url, sig);
          render();
        },

        /* ---- 2단계 → 지각 특성 ---- */
        async toggleConcept(id) {
          const on = state.conceptIds.includes(id);
          await Actions.applyConceptIds(on ? state.conceptIds.filter(x => x !== id) : state.conceptIds.concat(id));
        },
        async selectAllConcepts() {
          const all = state.concepts.length > 0 && state.conceptIds.length === state.concepts.length;
          await Actions.applyConceptIds(all ? [] : state.concepts.map(c => c.id));
        },
        async applyConceptIds(nextIds) {
          if (state.perceptions.length || state.properties.length || state.interactions.length) {
            if (!confirmDiscard("지각·물성·인터랙션")) return;
            await Actions.clearImageSlots(["perception", "property", "interaction", "interactionB"]);
            setState({
              conceptIds: nextIds,
              perceptions: [], perceptionIds: [],
              properties: [], propertyIds: [],
              interactions: [],
              images: Object.assign({}, state.images, { perception: null, property: null, interaction: null, interactionB: null })
            });
            persist(false);
            return;
          }
          setState({ conceptIds: nextIds });
        },
        async generatePerceptions(instruction) {
          const c = selectedConcept();
          if (!c) { setState({ errorMsg: "감성 해석을 먼저 선택해 주세요." }); return; }

          const data = await withLoading("지각 특성을 정리하고 있습니다", () =>
            callText(SYSTEM, PROMPTS.PERCEPTION(state.keyword, c, instruction || "")));
          if (!data) return;

          const perceptions = normPerceptions(data);
          if (!perceptions.length) { setState({ errorMsg: "지각 특성을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          await Actions.clearImageSlots(["perception", "property", "interaction", "interactionB"]);
          setState({
            perceptions,
            perceptionIds: [],
            properties: [], propertyIds: [],
            interactions: [],
            images: Object.assign({}, state.images, { perception: null, property: null, interaction: null, interactionB: null }),
            step: 3
          }, true);
          persist(false);
          await Actions.generatePerceptionImage();
          return true;
        },
        async regeneratePerceptions() {
          const ins = draft("ins-perception").trim();
          if (await Actions.generatePerceptions(ins)) { drafts["ins-perception"] = ""; render(); }
        },
        async generatePerceptionImage() {
          if (!state.perceptions.length) return;
          const sig = imageSig("perception");
          const url = await withLoading("지각 특성 통합 이미지를 만들고 있습니다", () =>
            callImage(IMG.perception(state.perceptions)));
          if (!url) return;
          await Actions.saveImage("perception", url, sig);
          render();
        },

        /* ---- 3단계 → 물성 정의 ---- */
        async togglePerception(id) {
          const on = state.perceptionIds.includes(id);
          const nextIds = on ? state.perceptionIds.filter(x => x !== id) : state.perceptionIds.concat(id);
          if (state.properties.length || state.interactions.length) {
            if (!confirmDiscard("물성·인터랙션")) return;
            await Actions.clearImageSlots(["property", "interaction", "interactionB"]);
            setState({
              perceptionIds: nextIds,
              properties: [], propertyIds: [],
              interactions: [],
              images: Object.assign({}, state.images, { property: null, interaction: null, interactionB: null })
            });
            persist(false);
            return;
          }
          setState({ perceptionIds: nextIds });
        },
        async selectAllPerceptions() {
          const all = state.perceptions.length === state.perceptionIds.length;
          const nextIds = all ? [] : state.perceptions.map(p => p.id);
          if (state.properties.length || state.interactions.length) {
            if (!confirmDiscard("물성·인터랙션")) return;
            await Actions.clearImageSlots(["property", "interaction", "interactionB"]);
            setState({
              perceptionIds: nextIds,
              properties: [], propertyIds: [],
              interactions: [],
              images: Object.assign({}, state.images, { property: null, interaction: null, interactionB: null })
            });
            persist(false);
            return;
          }
          setState({ perceptionIds: nextIds });
        },
        async generateProperties(instruction) {
          const c = selectedConcept();
          const picked = selectedPerceptions();
          if (!c) { setState({ errorMsg: "감성 해석을 먼저 선택해 주세요." }); return; }
          if (!picked.length) { setState({ errorMsg: "지각 요소를 하나 이상 선택해 주세요." }); return; }

          const data = await withLoading("인터랙션 물성을 정의하고 있습니다", () =>
            callText(SYSTEM, PROMPTS.PROPERTY(c, picked, instruction || "")));
          if (!data) return;

          const properties = normProperties(data);
          if (!properties.length) { setState({ errorMsg: "인터랙션 물성 정의를 받지 못했습니다. 다시 시도해 주세요." }); return; }

          await Actions.clearImageSlots(["property", "interaction", "interactionB"]);
          setState({
            properties,
            propertyIds: [],
            interactions: [],
            images: Object.assign({}, state.images, { property: null, interaction: null, interactionB: null }),
            step: 4
          }, true);
          persist(false);
          await Actions.generatePropertyImage();
          return true;
        },
        async regenerateProperties() {
          const ins = draft("ins-property").trim();
          if (await Actions.generateProperties(ins)) { drafts["ins-property"] = ""; render(); }
        },
        async generatePropertyImage() {
          if (!state.properties.length) return;
          const sig = imageSig("property");
          const url = await withLoading("인터랙션 물성 이미지를 만들고 있습니다", () =>
            callImage(IMG.property(state.properties)));
          if (!url) return;
          await Actions.saveImage("property", url, sig);
          render();
        },

        /* ---- 4단계 → 인터랙션 제안 ---- */
        async toggleProperty(id) {
          const on = state.propertyIds.includes(id);
          const nextIds = on ? state.propertyIds.filter(x => x !== id) : state.propertyIds.concat(id);
          if (state.interactions.length) {
            if (!confirmDiscard("인터랙션")) return;
            await Actions.clearImageSlots(["interaction", "interactionB"]);
            setState({
              propertyIds: nextIds,
              interactions: [],
              images: Object.assign({}, state.images, { interaction: null, interactionB: null })
            });
            persist(false);
            return;
          }
          setState({ propertyIds: nextIds });
        },
        async selectAllProperties() {
          const all = state.properties.length === state.propertyIds.length;
          const nextIds = all ? [] : state.properties.map(p => p.id);
          if (state.interactions.length) {
            if (!confirmDiscard("인터랙션")) return;
            await Actions.clearImageSlots(["interaction", "interactionB"]);
            setState({
              propertyIds: nextIds,
              interactions: [],
              images: Object.assign({}, state.images, { interaction: null, interactionB: null })
            });
            persist(false);
            return;
          }
          setState({ propertyIds: nextIds });
        },
        async fetchInteractionPart(c, picked, instruction, from, count, existing, plan) {
          const concept = c || { nameKo: state.keyword, nameEn: "" };
          const ins = [instruction || "", interactionPartNote(from, count, existing, plan)].filter(Boolean).join("\n\n");
          const ask = extra => withLoading("인터랙션 제안을 만들고 있습니다", () =>
            callText(SYSTEM, PROMPTS.INTERACTION_DIGITAL(concept, picked, extra ? `${ins}\n${extra}` : ins, plan), 14000));
          const data = await ask();
          if (!data) return null;
          const usePlan = plan || normPlan(data);
          let list = normInteractions(data).slice(0, count);
          if (list.length < count) {
            const more = await ask(`이전 응답은 ${list.length}개뿐이었습니다. 반드시 정확히 ${count}개를 반환합니다.`);
            const again = more ? normInteractions(more).slice(0, count) : [];
            if (again.length > list.length) list = again;
          }
          /* 요소 번호와 이름은 정한 계획대로 맞춥니다. */
          const els = usePlan.elements.slice(from - 1, from - 1 + count);
          list.forEach((m, k) => {
            const n = els[k];
            if (n) { m.element = n; m.frame = elementName(n); }
            m.index = from + k;
          });
          return { list, plan: usePlan };
        },
        async generateInteractions(instruction) {
          const c = selectedConcept();
          const picked = selectedProperties();
          if (!picked.length) { setState({ errorMsg: "물성을 하나 이상 선택해 주세요." }); return; }

          const mode = "digital";
          loadingHold = "인터랙션 제안을 만들고 있습니다";
          try {
          const first = await Actions.fetchInteractionPart(c, picked, instruction, 1, 3, [], null);
          if (!first) return;
          if (!first.list.length) { setState({ errorMsg: "인터랙션 제안을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          await Actions.clearImageSlots(["interaction", "interactionB"]);
          setState({
            interactions: first.list,
            interactionPlan: first.plan,
            interactionsMode: mode,
            images: Object.assign({}, state.images, { interaction: null, interactionB: null }),
            step: 5
          }, true);
          persist(false);

          const second = await Actions.fetchInteractionPart(c, picked, instruction, first.list.length + 1, INTERACTION_COUNT - first.list.length, first.list, first.plan);
          if (!second) return true;   /* 오류 안내를 그대로 보여 주고, '나머지 이어서 생성'으로 이어 갈 수 있습니다. */
          if (second.list.length) {
            state.interactions = first.list.concat(second.list);
            persist(false);
          }
          } finally {
            if (loadingHold) { loadingHold = null; if (!state.errorMsg) setState({ isAnalyzing: false }); }
          }
          if (state.interactions.length < INTERACTION_COUNT) toast(`인터랙션이 ${state.interactions.length}개 생성되었습니다. '나머지 이어서 생성'을 눌러 주세요.`, "error");
          await Actions.generateInteractionImage();
          return true;
        },
        async continueInteractions() {
          const c = selectedConcept();
          const picked = selectedProperties();
          const have = state.interactions;
          if (have.length >= INTERACTION_COUNT || !picked.length) return;
          const plan = state.interactionPlan || normPlan({ selectedElements: have.map(m => m.element).filter(Boolean) });
          const more = await Actions.fetchInteractionPart(c, picked, "", have.length + 1, INTERACTION_COUNT - have.length, have, plan);
          if (!more || !more.list.length) return;
          setState({ interactions: have.concat(more.list), interactionPlan: plan });
          persist(false);
          await Actions.generateInteractionImage();
        },
        async regenerateInteractions() {
          const ins = draft("ins-interaction").trim();
          if (await Actions.generateInteractions(ins)) { drafts["ins-interaction"] = ""; render(); }
        },
        async generateInteractionImage(part) {
          if (!state.interactions.length) return;
          const all = state.interactions;
          const halves = (all.length <= INTERACTION_COUNT
            ? [{ slot: "interaction", items: all, offset: 0 }]
            : [
                { slot: "interaction",  items: all.slice(0, 4), offset: 0 },
                { slot: "interactionB", items: all.slice(4, 8), offset: 4 }
              ]).filter(h => h.items.length);
          const jobs = part === undefined ? halves : halves.filter((h, i) => i === part);
          for (const h of jobs) {
            const range = `${pad2(h.offset + 1)}–${pad2(h.offset + h.items.length)}`;
            const prompt = IMG.interaction(h.items, h.offset);
            const ref = h.offset > 0 ? state.images.interaction : null;
            const sig = imageSig(h.slot);
            const url = await withLoading("인터랙션 컨셉 보드를 만들고 있습니다", () =>
              ref ? callImageWithRef(prompt, ref) : callImage(prompt));
            if (!url) return;
            await Actions.saveImage(h.slot, url, sig);
            render();
          }
        }
      };
      window.Actions = Actions;

            alt: "동적 인터랙션 물성별 대표 반응 이미지 통합 보드",
            empty: "인터랙션 물성 이미지를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generatePropertyImage()"
          })}

          <div class="flex items-center justify-between gap-2 mb-3 px-1">
            <span class="t-meta font-bold text-slate-600">${picked}개 선택됨</span>
            ${ghostBtn(allOn ? "전체 해제" : "전체 선택", "Actions.selectAllProperties()", allOn ? "square" : "check-square")}
          </div>

          <div class="space-y-3">${cards}</div>
          ${instructionBox("property", "예: 저항·복원·감쇠·관성의 차이가 더 분명하고 실제 UI 모션으로 변환하기 쉽게 다시 구성해 주세요")}

          ${dock(primaryBtn(picked ? "인터랙션 제안 받기" : "물성을 선택해 주세요", "Actions.generateInteractions()", !picked))}
        </div>`;
      }

      /* ---- 5단계 : 인터랙션 제안 ---- */
      function behaviorText(m) {
        if (m.behavior) return m.behavior;
        const legacy = [["정지", m.rest], ["입력 감지", m.acknowledge], ["저항", m.resistance], ["전환", m.transition], ["안착", m.settle]]
          .filter(x => x[1] && x[1] !== NO_DATA).map(x => `${x[0]} — ${x[1]}`);
        return legacy.join("\n");
      }

      /* 리퀴드 글라스의 인터랙션 요소 8개 중 고른 6개와 감성 물성 시스템을 보여 줍니다. */
      function elementGuide() {
        const plan = state.interactionPlan;
        if (!plan) return "";
        const ms = plan.materialSystem || {};
        const order = plan.elements;
        return `<section class="bg-white border-2 border-slate-200 rounded-[2rem] p-5 mb-5 shadow-sm">
          <p class="t-meta font-bold text-blue-700">EMOTION MATERIAL SYSTEM</p>
          ${ms.nameKo || ms.nameEn ? `<h3 class="t-h3 text-slate-900">${esc(ms.nameKo || ms.nameEn)}</h3>
          ${ms.nameEn && ms.nameKo ? `<p class="t-meta text-slate-500">${esc(ms.nameEn)}</p>` : ""}` : ""}
          ${ms.surface ? `<p class="t-small text-slate-700 mt-2 prose-ko"><strong>기본 표면</strong> · ${esc(ms.surface)}</p>` : ""}
          ${ms.core && ms.core.length ? `<div class="flex flex-wrap gap-1.5 mt-2">${ms.core.map(x => chip(x, "blue")).join("")}</div>` : ""}
          ${ms.exaggeration ? `<p class="t-small text-slate-700 mt-3 prose-ko">${esc(ms.exaggeration)}</p>` : ""}
          ${ms.whyKo ? `<p class="t-meta text-slate-500 mt-1 prose-ko">${esc(ms.whyKo)}</p>` : ""}
          <p class="t-meta font-bold text-slate-500 mt-4 mb-2">리퀴드 글라스 인터랙션 요소 8개 중 이 감성에 맞는 6개</p>
          <div class="space-y-1.5">${LG_ELEMENTS.map(e => {
            const k = order.indexOf(e.no);
            const on = k >= 0;
            return `<div class="grid grid-cols-[40px_1fr] gap-2 items-start ${on ? "" : "opacity-50"}">
              <span class="t-meta font-bold tabular-nums ${on ? "text-blue-700" : "text-slate-400"}">${on ? pad2(k + 1) : "—"}</span>
              <p class="t-meta ${on ? "text-slate-800" : "text-slate-500"}"><strong class="${on ? "text-slate-900" : ""}">${esc(e.ko)}</strong>${on ? "" : " · 제외"}</p>
            </div>`;
          }).join("")}</div>
        </section>`;
      }

      function interactionCard(m, i) {
        const row = (label, value) => value ? `<div class="pt-3">
          <p class="t-meta font-bold text-slate-500 mb-0.5">${esc(label)}</p>
          <p class="t-small text-slate-700 prose-ko">${esc(value)}</p>
        </div>` : "";
        const states = (m.states || []).slice(0, 3);
        return `<article class="w-full p-5 rounded-[2rem] border-2 border-slate-200 bg-white shadow-md">
          <div class="flex items-start gap-3 mb-2">
            <span class="w-9 h-9 rounded-full bg-blue-700 text-white flex items-center justify-center flex-shrink-0 font-bold t-meta tabular-nums">${pad2(i + 1)}</span>
            <div class="min-w-0 flex-1">
              <h3 class="t-h3 text-slate-900 leading-snug">${esc(m.nameKo)}</h3>
              <p class="t-meta text-slate-500">${esc(m.nameEn)}</p>
              ${m.type ? `<span class="inline-block max-w-full mt-2 t-meta font-bold px-2.5 py-1 rounded-lg bg-sky-100 text-sky-800" style="overflow-wrap:anywhere">${esc(m.type)}</span>` : ""}
            </div>
          </div>
          ${m.frame ? `<p class="t-meta font-bold mt-1 mb-1 text-blue-700">적용 요소 · ${esc(m.frame)}</p>` : ""}
          ${row("UX 역할", m.role)}
          ${m.physicalBasis ? `<div class="mt-3 bg-slate-900 text-white rounded-2xl px-4 py-3"><p class="t-meta font-bold text-sky-300">${state.interactionsMode === "physical" ? "물리 현상 · Physical Basis" : "물성 메타포 → 디지털 모션 모델"}</p><p class="t-small prose-ko">${esc(m.physicalBasis)}</p></div>` : ""}
          ${(m.digitalPattern || m.phoneContext || m.gesture) ? `<div class="flex flex-wrap gap-1.5 mt-3">${m.digitalPattern ? chip("디지털 패턴 · " + m.digitalPattern, "blue") : ""}${m.phoneContext ? chip("적용 맥락 · " + m.phoneContext, "blue") : ""}${m.gesture ? chip("입력 · " + m.gesture) : ""}</div>` : ""}
          ${m.interactionDNA ? `<div class="mt-3 bg-blue-50 border border-blue-100 rounded-2xl px-4 py-3"><p class="t-meta font-bold text-blue-700">Interaction DNA</p><p class="t-small font-bold text-slate-900 prose-ko">${esc(m.interactionDNA)}</p></div>` : ""}
          ${row("주제의 형상", m.themedObject)}
          ${row("기호", m.glyph)}
          ${row("실제 기능과 결과", m.func)}
          ${row("입력 → 결과", m.inputToOutcome)}
          ${row("동작 방식", behaviorText(m))}
          ${row("그래픽 물성", m.graphic)}
          ${m.params && m.params.length ? `<div class="pt-3"><p class="t-meta font-bold text-slate-500 mb-1">핵심 수치</p><div class="flex flex-wrap gap-1.5">${m.params.map(x => chip(x, "blue")).join("")}</div></div>` : ""}
          <div class="grid grid-cols-3 gap-2 mt-4">${states.map((st, j) => `<div class="rounded-xl border border-slate-200 bg-white p-2.5 min-h-[92px]">
            <p class="t-meta font-bold text-blue-700">${pad2(j + 1)} ${esc(st.labelKo)}</p>
            <p class="t-meta text-slate-500">${esc(st.labelEn)}</p>
            <p class="t-meta text-slate-700 mt-1 prose-ko">${esc(st.description)}</p>
          </div>`).join("")}</div>
          ${row("Timing / Motion", m.timing)}
          ${row("Haptic", m.haptic)}
          ${row("Visual Behavior", m.visualBehavior)}
          ${m.propertyTranslation && m.propertyTranslation.length
            ? `<div class="pt-3"><p class="t-meta font-bold text-slate-500 mb-1.5">물성 → 반응</p><div class="space-y-2">${m.propertyTranslation.map(t => `<div class="rounded-xl border border-blue-100 bg-blue-50/60 px-3 py-2.5">
                <p class="t-meta font-bold text-blue-800">${esc(t.property)}${t.value !== "" ? ` <span class="tabular-nums">${esc(t.value)}</span>` : ""}</p>
                <p class="t-meta text-slate-700 prose-ko">${esc(t.effect)}</p>
              </div>`).join("")}</div></div>`
            : (m.propertyMapping && m.propertyMapping.length ? `<div class="pt-3"><p class="t-meta font-bold text-slate-500 mb-1">연결 물성</p><div class="flex flex-wrap gap-1.5">${m.propertyMapping.map(x => chip(x)).join("")}</div></div>` : "")}
          ${row("감성 효과", m.emotionalEffect)}
        </article>`;
      }

      function viewInteraction() {
        const cards = state.interactions.map((m, i) => interactionCard(m, i)).join("");
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("인터랙션 제안", 4)}
          ${sectionTitle("물성을 어떻게 움직임으로 표현할 것인가", state.interactionsMode === "physical" ? "선택한 물성의 물리 현상 자체를 작동 원리로 삼아, 휴대폰·TV에 적용되는 물리적 인터랙션으로 번역합니다." : "리퀴드 글라스가 유리라는 하나의 물성을 모든 인터랙션 요소에 적용하듯, 앞 단계에서 정의한 물성을 하나의 시스템으로 정리해 실제 반응 속에 창의적으로, 조금 과장되게 적용합니다. 리퀴드 글라스의 인터랙션 요소 8개 중 이 감성에 맞는 6개를 골라 휴대폰 화면의 디지털 인터랙션으로 제안합니다.")}
          ${(function () {
            const c = selectedConcept();
            const ps = selectedPerceptions();
            const qs = selectedProperties();
            return priorChoice([
              { label: "선택한 감성 해석", value: c ? `${c.nameKo} (${c.nameEn})${c.anchor ? " · 연상: " + c.anchor : ""}` : "" },
              { label: `선택한 지각 요소 ${ps.length}개`, value: joinTitles(ps, "titleKo") },
              { label: `선택한 인터랙션 물성 ${qs.length}개`, value: qs.map((q, i) => `${pad2(i + 1)} ${q.titleKo} ${q.value}`).join("   ") }
            ]);
          })()}


          ${elementGuide()}

          ${state.interactions.length < INTERACTION_COUNT ? `<div class="mb-5">${secondaryBtn(`나머지 ${INTERACTION_COUNT - state.interactions.length}개 이어서 생성`, "Actions.continueInteractions()", "plus")}</div>` : ""}

          ${imageCard("interaction", {
            title: state.interactions.length > INTERACTION_COUNT ? "인터랙션 컨셉 보드 01–04" : "인터랙션 컨셉 보드",
            alt: "AI가 선택한 다양한 인터랙션 컨셉의 3상태 보드",
            empty: "인터랙션 컨셉 보드를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generateInteractionImage(0)"
          })}

          ${state.interactions.length > INTERACTION_COUNT ? imageCard("interactionB", {
            title: "인터랙션 컨셉 보드 05–08",
            alt: "05번부터 08번 인터랙션 컨셉의 3상태 보드",
            empty: "두 번째 인터랙션 컨셉 보드를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generateInteractionImage(1)"
          }) : ""}

          <div class="space-y-3">${cards}</div>
          ${instructionBox("interaction", "예: 리퀴드 글라스처럼 물성 기반의 새 인터랙션이 더 드러나게 하고, 감성 키워드의 색감과 긴장감이 끝까지 유지되도록 다시 제안해 주세요")}
          <div class="h-32" aria-hidden="true"></div>

          ${dock(`
            <div class="space-y-2.5">
              ${primaryBtn("전체 리포트 PDF로 저장", "Actions.exportPdf()")}
              ${secondaryBtn("시뮬레이터 제작 프롬프트 만들기", "Actions.openSimPrompt()", "code-2")}
            </div>
          `)}
        </div>`;
      }

      /* =========================================================
         16. 오버레이 — 로딩 / 오류 / 이미지 확대
         ========================================================= */
      function overlays() {
        let html = "";

        if (state.isAnalyzing) {
          html += `<div class="fixed inset-0 z-[10000] bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center px-8 text-center max-w-[430px] mx-auto animate-fade-in" role="status" aria-live="polite">
            <div class="spinner-ring mb-8" role="presentation"></div>
            <h2 class="t-h2 text-slate-900 mb-2">${esc(state.loadingMsg)}</h2>
            <p class="t-small text-slate-600 mb-2">1분 넘게 걸릴 수 있습니다</p>
            <p class="t-meta text-slate-500 mb-8 text-center">처리 중에는 화면을 켜 두고 다른 앱으로 전환하지 마세요.</p>
            <button type="button" onclick="Actions.cancel()" class="px-7 py-3.5 rounded-2xl border-2 border-slate-300 text-slate-700 font-bold t-small hover:bg-slate-50 active:scale-95 transition-all">취소</button>
          </div>`;
        }

        if (state.lightbox && state.images && state.images[state.lightbox]) {
          html += `<div class="fixed inset-0 z-[10001] bg-black/90 flex flex-col max-w-[430px] mx-auto" role="dialog" aria-modal="true" aria-label="이미지 크게 보기">
            <div class="flex justify-end p-3">
              <button type="button" onclick="Actions.closeLightbox()" aria-label="닫기" class="p-3 rounded-full bg-white/10 text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="flex-1 overflow-auto px-3 pb-6 no-scrollbar">
              <img src="${escAttr(viewUrl(state.lightbox))}" alt="확대한 통합 이미지" class="w-full rounded-2xl" />
            </div>
          </div>`;
        }

        if (state.simPrompt) {
          html += `<div class="fixed inset-0 z-[10001] bg-black/60 backdrop-blur-sm flex items-end justify-center max-w-[430px] mx-auto" role="dialog" aria-modal="true" aria-labelledby="sim-title">
            <div class="bg-white w-full rounded-t-[2rem] p-5 pb-[calc(20px+env(safe-area-inset-bottom))] max-h-[92vh] flex flex-col animate-fade-in">
              <div class="flex items-start justify-between gap-3 mb-2">
                <h2 id="sim-title" class="t-h2 text-slate-900">시뮬레이터 제작 프롬프트</h2>
                <button type="button" onclick="Actions.closeSimPrompt()" aria-label="닫기" class="p-2.5 rounded-full hover:bg-slate-100 flex-shrink-0"><i data-lucide="x" class="w-6 h-6"></i></button>
              </div>
              <p class="t-meta text-slate-600 mb-3 prose-ko">최종 인터랙션 ${state.interactions.length}개를 터치로 체험하는 단일 HTML 시뮬레이터를 만들게 하는 프롬프트입니다. 복사해서 Claude 같은 AI에 붙여 넣고, 아래에서 저장한 인터랙션 보드 이미지도 함께 첨부하세요.${state.images.interaction ? "" : " (보드 이미지가 아직 없습니다. 보드를 먼저 생성하면 더 정확한 시뮬레이터를 만들 수 있습니다.)"}</p>
              <label for="sim-prompt-text" class="sr-only">시뮬레이터 제작 프롬프트</label>
              <textarea id="sim-prompt-text" readonly class="flex-1 min-h-[40vh] w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl t-meta text-slate-800 resize-none outline-none focus:border-blue-700">${esc(state.simPrompt)}</textarea>
              <div class="space-y-2.5 mt-4">
                ${primaryBtn("프롬프트 복사", "Actions.copySimPrompt()")}
                ${secondaryBtn("텍스트 파일로 저장", "Actions.downloadSimPrompt()", "download")}
                ${state.images.interaction ? secondaryBtn(state.images.interactionB ? "보드 이미지 01–04 저장" : "인터랙션 보드 이미지 저장", "Actions.downloadImage('interaction')", "image") : ""}
                ${state.images.interactionB ? secondaryBtn("보드 이미지 05–08 저장", "Actions.downloadImage('interactionB')", "image") : ""}
              </div>
            </div>
          </div>`;
        }

        if (state.errorMsg) {
          html += `<div class="fixed inset-0 z-[10002] flex items-center justify-center bg-black/50 px-6 backdrop-blur-sm" role="alertdialog" aria-modal="true" aria-labelledby="err-title">
            <div class="bg-white p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl animate-scale-in">
              <i data-lucide="alert-triangle" class="text-red-600 mx-auto mb-4 w-12 h-12"></i>
              <h2 id="err-title" class="t-h3 text-slate-900 mb-6 prose-ko">${esc(state.errorMsg)}</h2>
              <button type="button" onclick="setState({errorMsg:null})" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold t-small">확인</button>
            </div>
          </div>`;
        }
        return html;
      }

      /* =========================================================
         17. 메인 렌더 — 예외가 나도 화면이 멈추지 않도록 방어
         ========================================================= */
      function captureUI() {
        const el = document.activeElement;
        const f = (el && el.id && (el.tagName === "INPUT" || el.tagName === "TEXTAREA"))
          ? { id: el.id, start: el.selectionStart, end: el.selectionEnd } : null;
        return { focus: f, scrollY: window.scrollY };
      }
      function restoreUI(snap, resetScroll) {
        if (snap.focus) {
          const el = document.getElementById(snap.focus.id);
          if (el) {
            el.focus({ preventScroll: true });
            try { el.setSelectionRange(snap.focus.start, snap.focus.end); } catch (e) { /* range 미지원 */ }
          }
        }
        window.scrollTo(0, resetScroll ? 0 : snap.scrollY);
      }

      function fallback(backStep, msg) {
        return `<div class="page-top px-6 min-h-screen">
          <div class="bg-white border-2 border-slate-300 rounded-3xl p-8 text-center shadow-md">
            <i data-lucide="compass" class="w-12 h-12 text-slate-500 mx-auto mb-4"></i>
            <h2 class="t-h3 text-slate-900 mb-2">${esc(msg)}</h2>
            <p class="t-small text-slate-600 mb-6">이전 단계로 돌아가 다시 실행해 주세요.</p>
            ${primaryBtn("이전 단계로", `setState({step:${backStep}}, true)`)}
          </div>
        </div>`;
      }

      function body() {
        switch (state.step) {
          case -1: return viewAuth();
          case 0:  return viewHome();
          case 1:  return viewKeyword();
          case 2:  return state.concepts.length ? viewEmotion() : fallback(1, "생성된 감성 해석이 없습니다.");
          case 3:  return state.perceptions.length ? viewPerception() : fallback(2, "분석된 지각 특성이 없습니다.");
          case 4:  return state.properties.length ? viewProperty() : fallback(3, "정의된 물성이 없습니다.");
          case 5:  return state.interactions.length ? viewInteraction() : fallback(4, "제안된 인터랙션이 없습니다.");
          default: return fallback(0, "요청한 화면을 찾을 수 없습니다.");
        }
      }

      function render(resetScroll) {
        const root = document.getElementById("root");
        const snap = captureUI();
        const shell = "w-full max-w-[430px] mx-auto bg-slate-100 min-h-screen relative overflow-x-hidden shadow-2xl";
        let inner;
        try {
          inner = body();
        } catch (err) {
          console.error("render 실패:", err);
          inner = fallback(0, "화면을 그리는 중 문제가 발생했습니다.");
        }
        try {
          root.innerHTML = `<div class="${shell}">${inner}${overlays()}</div>`;
          if (window.lucide && typeof lucide.createIcons === "function") lucide.createIcons();
        } catch (err) {
          console.error("DOM 갱신 실패:", err);
          root.innerHTML = `<div class="${shell}"><div class="p-8 t-body">화면을 표시할 수 없습니다. 새로고침해 주세요.</div></div>`;
        }
        restoreUI(snap, resetScroll);
      }

      /* =========================================================
         18. 부팅
         ========================================================= */
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (state.errorMsg) setState({ errorMsg: null });
        else if (state.simPrompt) Actions.closeSimPrompt();
        else if (state.lightbox) Actions.closeLightbox();
        else if (state.isAnalyzing) Actions.cancel();
      });

      setInterval(() => { try { persist(false); } catch (e) { console.warn("자동 저장 실패", e); } }, CONFIG.AUTOSAVE_MS);

      /* 휴대폰에서는 beforeunload가 거의 실행되지 않습니다. 화면을 벗어나는 순간마다 바로 저장합니다. */
      const flush = () => { try { persist(false); } catch (e) { /* 무시 */ } };
      window.addEventListener("beforeunload", flush);
      window.addEventListener("pagehide", flush);
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

      /* 같은 프로젝트를 연 다른 창이 저장하면, 오래된 화면을 최신 상태로 바꿉니다.
         그러지 않으면 오래된 창의 자동 저장이 방금 수정한 결과를 덮어씁니다. */
      window.addEventListener("storage", (e) => {
        if (e.key === CONFIG.PROJECTS_KEY) {
          const row = Store.get(state.projectId);
          if (row && (row.rev || 0) > knownRev && !state.isAnalyzing) {
            adoptRow(row, state.step >= 1 ? "다른 창에서 수정된 최신 상태를 불러왔습니다." : "");
          } else if (state.step === 0 && !state.isAnalyzing) {
            render();
          }
        } else if (e.key === CONFIG.PING_KEY && e.newValue) {
          let ping = null;
          try { ping = JSON.parse(e.newValue); } catch (err) { ping = null; }
          if (ping && ping.projectId === state.projectId && !state.isAnalyzing) loadImagesFor(state.projectId);
        }
      });

      /* 당겨서 새로 고침 방지 — CSS(overscroll-behavior)를 지원하지 않는 브라우저를 위한 보완.
         페이지가 맨 위에 있고 손가락이 아래로 끌릴 때만 브라우저 기본 동작을 막습니다.
         안쪽에 스크롤할 내용이 남은 영역(확대 이미지, 긴 글 상자 등)은 그대로 스크롤됩니다. */
      (function blockPullToRefresh() {
        let startY = 0, startX = 0;
        const innerCanScrollUp = el => {
          for (let n = el; n && n !== document.body && n !== document.documentElement; n = n.parentElement) {
            const st = getComputedStyle(n);
            if (/(auto|scroll)/.test(st.overflowY) && n.scrollHeight > n.clientHeight && n.scrollTop > 0) return true;
          }
          return false;
        };
        document.addEventListener("touchstart", e => {
          if (e.touches.length !== 1) return;
          startY = e.touches[0].clientY; startX = e.touches[0].clientX;
        }, { passive: true });
        document.addEventListener("touchmove", e => {
          if (e.touches.length !== 1) return;
          const dy = e.touches[0].clientY - startY;
          const dx = e.touches[0].clientX - startX;
          const atTop = (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
          if (atTop && dy > 0 && dy > Math.abs(dx) && !innerCanScrollUp(e.target) && e.cancelable) e.preventDefault();
        }, { passive: false });
      })();

      loadSession();
      if (state.apiKey) state.step = 0;
      render(true);
      /* 지난 실행에서 localStorage 기록이 늦어 사라진 변경을 IndexedDB 사본으로 되살립니다. */
      Store.reconcile().then(changed => { if (changed && state.step <= 0) render(); }).catch(() => {});

    })();
  </script>
</body>
</html>
