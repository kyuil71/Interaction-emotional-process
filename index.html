      const STAGES = [

      const SAMPLE_KEYWORDS = [

        "밝고 아름답다",

      ];

      const NO_DATA = "이 항목은 AI 응답에 포함되지 않았습니다. 다시 생성해 보세요.";

      /* =========================================================
         2. PROMPTS — 텍스트

      const SYSTEM = `당신은 감성 디자인, 지각심리학, 체화인지, 인터랙션 디자인, 햅틱 UX, 모션 디자인, 동적 물성 시뮬레이션을 함께 다루는 시니어 Interaction Experience Designer입니다.
- 모든 한국어 문장은 정중하고 명확한 존댓말로 작성합니다.

- 지각 단계에서는 관찰 가능한 인식 과정으로, 물성 단계에서는 인터랙션의 반응을 만들어 내는 동적 성질로, 마지막 단계에서는 실제 UI 요소의 움직임과 피드백으로 구체화합니다.

      const PROMPTS = {
        EMOTION: (keyword, note, instruction) => `감성 키워드: "${keyword}"
${note ? `사용자가 입력한 연관 과제: ${note}\n` : ""}

[고정 해석 방식]
${EMOTION_METHOD.label} (${EMOTION_METHOD.en})
${EMOTION_METHOD.guide}

[목표]
하나의 감성 키워드를 같은 감성 패밀리 안에서 서로 다른 3개의 지각·경험으로 해석하고, 사용자가 그중 하나를 고를 수 있게 합니다.
세 안은 서로 달라야 하지만 완전히 동떨어져서는 안 됩니다. 사용자가 보았을 때 “같은 감성을 이렇게 세 가지 방식으로 느낄 수 있구나”라고 이해되어야 합니다.

[3개 해석의 기본 초점]
- 1안: Energy & Motion — 에너지 수준, 반응 속도, 움직임, 리듬, 생동감을 중심으로 해석합니다.
- 2안: Atmosphere & Space — 공간 분위기, 빛, 거리감, 개방감·포근함·긴장감 등 환경적으로 느껴지는 상태를 중심으로 해석합니다.
- 3안: Sensation & Afterglow — 촉각적으로 연상되는 느낌, 정서적 온도, 몸의 반응, 감정이 남는 방식과 여운을 중심으로 해석합니다.
- 단, 입력 감성의 성격상 특정 초점이 부자연스러우면 억지로 맞추지 말고 가장 가까운 경험 축으로 자연스럽게 조정합니다.

[감성 정의 규칙]
- 각 안에는 한글 콘셉트명과 2~3단어의 영문 콘셉트명을 붙입니다.
- "definition"은 3~4문장으로 씁니다. 유사어를 나열하지 말고 사람이 실제로 느끼는 정서 상태와 몸·마음의 변화를 자연스럽게 설명합니다.
- 에너지 수준, 긴장과 이완, 안정감, 활동성, 시간적 느낌, 공간 분위기, 감정의 온도, 반응성, 여운 중 해당 감성에 중요한 요소를 포함합니다.
- 지나치게 시적이거나 광고 카피 같은 문구, 브랜드·시장·트렌드 분석을 피합니다.
- 탄성, 감쇠, 관성, 마찰, 지연시간, 햅틱, UI 컴포넌트명 등 구현 언어는 이 단계에서 사용하지 않습니다.
- "moodWords"는 해당 해석을 요약하는 한국어 감성 단어 4개입니다.
- "experience"는 이미지 아래에 붙일 1~2문장의 체감 설명입니다. 이미지에 보이는 사물을 설명하지 말고, 그 장면에서 사람이 어떻게 반응하고 어떤 여운을 느끼는지 적습니다.

[대표 장면과 정서적 은유]
- "subject"는 각 안의 감정을 가장 자연스럽게 전달하는 하나의 대표 장면, 대표 존재 또는 대표 상황입니다.
- 사람, 동물, 식물, 자연, 사물, 건축, 공간, 풍경, 빛, 물, 구름, 꽃, 패브릭, 추상적 형태, 행동의 순간 등에서 자유롭게 선택합니다.
- 키워드를 문자 그대로 묘사하지 않습니다. 예를 들어 “향기로운”을 향수병이나 냄새 맡는 사람으로 바로 표현하지 말고, 꽃잎·공기·빛·섬세한 움직임처럼 향기의 경험을 연상시키는 정서적 은유를 우선합니다.
- 예쁘거나 화려하다는 이유로 감정과 관계가 약한 대상을 고르지 않습니다.
- 한 안 안에 서로 관련 없는 상징물들을 억지로 섞지 않습니다. 하나의 일관된 장면으로 완결되어야 합니다.
- 세 안의 장면은 서로 충분히 구분되게 하되, 같은 감성 패밀리의 정서적 연결감은 유지합니다.

- 스타일 선택 기준: ${STYLE_RULE_TEXT}

- Cinematic Architectural Visual은 공간의 긴장, 깊이, 장엄함, 정제된 분위기에 적합합니다.
- Fine Art Landscape Photography는 고요함, 숭고함, 자연적 깊이와 시간감에 적합합니다.
- Futuristic Architecture Photography는 미래적, 정제된, 차갑고 선명한 감성에 적합합니다.
- Soft Macro Nature Photography는 생명감, 섬세함, 따뜻함, 부드러움, 자연성에 적합합니다.

- 목적은 평범한 UI 스킨이 아니라, 물성을 중심으로 새로운 가치의 인터랙션 컨셉을 도출하는 것입니다. Apple의 Liquid Glass처럼 '이 물성이라서 가능한 새 인터랙션 경험'이 느껴져야 합니다.

[Motion Grammar 5단계]
모든 인터랙션은 다음 시간 문법을 명확히 적용합니다.
1) Rest / 정지 — 아무 입력이 없을 때의 기본 상태와 긴장도
2) Acknowledge / 입력 감지 — 손가락이 닿거나 입력이 시작되었음을 즉시 알리는 첫 반응
3) Resistance / 저항과 힘의 축적 — 누름·드래그·전환 중 물성이 체감되는 구간
4) Transition / 임계점 통과와 주 움직임 — 상태가 바뀌고 형태·위치·빛·깊이가 본격적으로 전환되는 구간
5) Settle / 감쇠·안착·여운 — 입력이 끝난 뒤 복원·잔광·미세 진동이 정리되며 감성이 남는 구간

[핵심 관점]
- 각 제안은 단순한 UI 스킨이 아니라 '물성을 가진 움직임'이어야 합니다.
- 선택된 물성 중 2~4개를 각 인터랙션에 연결하고, 어떤 물성이 어느 순간에 작동하는지 분명히 설명합니다.
- 감성에 따라 동일한 유형의 요소도 반응 속도, 변형량, 저항, 오버슈트, 감쇠, 잔향, 광학 피드백, 햅틱이 달라져야 합니다.
- 인터랙션의 형태, 깊이, 색감, 투명도, 모션 성격은 처음 감성 키워드와 선택된 감성 해석을 끝까지 유지해야 합니다.
- 실제 화면에서 구현 가능한 수준으로 구체화하되, 특정 OS나 브랜드 UI를 복제하지 않습니다.

- "rest", "acknowledge", "resistance", "transition", "settle"은 각각 1~2문장으로 실제 화면 변화를 묘사합니다.
- "timing"은 전체 시간 범위와 easing/spring 성격을 구체적으로 적습니다. 예: 320–520 ms / soft spring / low overshoot.

- "visualBehavior"는 형태, 위치, 스케일, 블러, 투명도, 깊이, 발광, 파동 등 시각적 변화의 조합을 1~2문장으로 적습니다. 이때 색감과 광학 톤도 반드시 원래 감성을 반영합니다.
- "propertyMapping"은 사용한 물성명을 2~4개 배열로 적습니다.
- "emotionalEffect"는 이 인터랙션이 원래 감성을 어떻게 강화하는지 1~2문장으로 설명합니다. 특히 왜 이 제안이 처음 감성 키워드와 어울리는지 드러내야 합니다.

              if (!db.objectStoreNames.contains(CONFIG.IMAGE_DB.store)) {
                db.createObjectStore(CONFIG.IMAGE_DB.store, { keyPath: "id" });
              }
            };
            req.onsuccess = () => res(req.result);
            req.onerror = () => rej(req.error || new Error("IDB_OPEN_FAILED"));
          });
          return imageDbPromise;
        },
        _act(mode, fn) {
          return ImageDB.open().then(db => new Promise((res, rej) => {
            const tx = db.transaction(CONFIG.IMAGE_DB.store, mode);
            const rq = fn(tx.objectStore(CONFIG.IMAGE_DB.store));
            rq.onsuccess = () => res(rq.result);
            rq.onerror = () => rej(rq.error || new Error("IDB_REQUEST_FAILED"));
          }));
        },
        key: (projectId, slot) => `${projectId}::${slot}`,
        async put(projectId, slot, dataUrl) {
          try {
            await ImageDB._act("readwrite", st => st.put({
              id: ImageDB.key(projectId, slot), projectId, slot, dataUrl, savedAt: Date.now()
            }));
            return true;
          } catch (e) { console.warn("이미지 저장 실패", e); return false; }
        },
        async get(projectId, slot) {
          try {
            const row = await ImageDB._act("readonly", st => st.get(ImageDB.key(projectId, slot)));
            return row && row.dataUrl ? row.dataUrl : null;
          } catch (e) { return null; }
        },
        async loadAll(projectId) {
          const out = {};
          for (const slot of IMAGE_SLOTS) out[slot] = await ImageDB.get(projectId, slot);
          return out;
        },
        async remove(projectId, slot) {
          if (!IMAGE_SLOTS.includes(slot)) return false;
          try {
            await ImageDB._act("readwrite", st => st.delete(ImageDB.key(projectId, slot)));
            return true;
          } catch (e) {
            console.warn("이미지 삭제 실패", slot, e);
            return false;
          }
        },
        async removeSlots(projectId, slots) {
          const targets = Array.from(new Set(arr(slots).filter(slot => IMAGE_SLOTS.includes(slot))));
          await Promise.all(targets.map(slot => ImageDB.remove(projectId, slot)));
        },
        removeProject(projectId) {
          IMAGE_SLOTS.forEach(slot => {
            ImageDB._act("readwrite", st => st.delete(ImageDB.key(projectId, slot))).catch(() => {});
          });
        }
      };

          perceptionIds: [],

      const state = Object.assign({
        apiKey: "",
        quality: QUALITIES[0].id,
        labelLang: "ko",
        step: -1,
        isAnalyzing: false,
        loadingMsg: "",
        errorMsg: null,
        lightbox: null,

      }, blankProject());

      /* 입력 중인 값은 재렌더에도 유지되도록 별도 보관합니다. */

      window.setDraft = setDraft;

      function setState(patch, resetScroll) {

        render(resetScroll);

      function selectedConcept() { return state.concepts.find(c => c.id === state.conceptId) || null; }
      function selectedPerceptions() { return state.perceptions.filter(p => state.perceptionIds.includes(p.id)); }
      function selectedProperties() { return state.properties.filter(p => state.propertyIds.includes(p.id)); }

      function clamp(n, min, max) {
        return Math.max(min, Math.min(max, n));
      }

      function includesAny(text, list) {
        return list.some(k => text.includes(k));
      }

      function simulationInteraction() {
        const first = state.interactions[0] || null;
        if (!first) return null;
        return state.interactions.find(m => m.id === state.simulationId) || first;
      }

      function interactionTextBlob(m) {
        if (!m) return "";
        return [m.type, m.nameKo, m.nameEn, m.role, m.interactionDNA, m.rest, m.acknowledge,
          m.resistance, m.transition, m.settle, m.visualBehavior, m.emotionalEffect,
          Array.isArray(m.propertyMapping) ? m.propertyMapping.join(" ") : ""]
          .join(" ").toLowerCase();
      }

      function simulationArchetype(m) {
        const t = interactionTextBlob(m);
        if (includesAny(t, ["toggle", "switch", "토글", "스위치"])) return "toggle";
        if (includesAny(t, ["slider", "dial", "rail", "scrub", "swipe", "scroll", "레일", "슬라이더", "다이얼", "스크롤", "스와이프"])) return "rail";
        if (includesAny(t, ["lens", "magnifier", "zoom", "렌즈", "돋보기", "확대"])) return "lens";
        if (includesAny(t, ["popup", "sheet", "panel", "pane", "modal", "팝업", "시트", "패널"])) return "panel";
        if (includesAny(t, ["card", "카드"])) return "card";
        if (includesAny(t, ["surface", "field", "pool", "pocket", "바닥", "표면", "필드", "포켓", "ripple"])) return "surface";
        if (includesAny(t, ["button", "press", "sinking", "침잠", "버튼"])) return "button";
        if (includesAny(t, ["liquid", "glass", "리퀴드", "유리", "액체"])) return "panel";
        return "card";
      }

      function defaultSimulationState(m) {
        const archetype = simulationArchetype(m);
        return {
          targetId: m ? m.id : null,
          archetype,
          phase: "Rest / 정지",
          active: false,
          toggleOn: false,
          railValue: 48,
          panelOpen: archetype === "lens" ? 0.76 : 0.16,
          cardLift: 0,
          cardX: 0,
          cardY: 0,
          lensX: 50,
          lensY: 44,
          ripple: 0,
          pointX: 50,
          pointY: 50,
          pressDepth: 0,
          drag: null
        };
      }

      function simStateFor(m) {
        if (!m) return defaultSimulationState(null);
        if (state.simulation && state.simulation.targetId === m.id) return state.simulation;
        return defaultSimulationState(m);
      }

      function setSimulationState(patch, resetScroll) {
        const m = simulationInteraction();
        const base = simStateFor(m);
        state.simulation = Object.assign({}, base, patch, { targetId: m ? m.id : null });
        render(resetScroll);
      }

      let simTimer = null;
      function scheduleSimPhase(phase, ms, extra) {
        clearTimeout(simTimer);
        simTimer = setTimeout(() => {
          const m = simulationInteraction();
          if (!m) return;
          const base = simStateFor(m);
          state.simulation = Object.assign({}, base, extra || {}, { phase, targetId: m.id });
          render();
        }, ms);
      }

      function resetSimulationFor(id) {
        const m = state.interactions.find(x => x.id === id) || state.interactions[0] || null;
        state.simulationId = m ? m.id : null;
        state.simulation = defaultSimulationState(m);
      }

      function beginSimulationDrag(kind, data) {
        const m = simulationInteraction();
        const base = simStateFor(m);
        state.simulation = Object.assign({}, base, { drag: Object.assign({ kind }, data || {}) });
      }

      function handleSimulationPointerMove(ev) {
        const m = simulationInteraction();
        if (!m) return;
        const sim = simStateFor(m);
        const drag = sim.drag;
        if (!drag) return;
        if (drag.kind === "rail") {
          const ratio = clamp((ev.clientX - drag.left) / drag.width, 0, 1);
          setSimulationState({ railValue: Math.round(ratio * 100), phase: "Transition / 전환" });
          return;
        }
        if (drag.kind === "sheet") {
          const next = clamp(drag.startOpen + ((drag.startY - ev.clientY) / 260), 0.08, 1);
          setSimulationState({ panelOpen: next, phase: next > sim.panelOpen ? "Transition / 전환" : "Resistance / 저항" });
          return;
        }
        if (drag.kind === "card") {
          const dx = clamp(ev.clientX - drag.startX, -64, 64);
          const dy = clamp(ev.clientY - drag.startY, -96, 88);
          const lift = clamp((-dy + 20) / 110, 0, 1);
          setSimulationState({ cardX: dx, cardY: dy, cardLift: lift, phase: "Transition / 전환" });
          return;
        }
        if (drag.kind === "lens") {
          const x = clamp(((ev.clientX - drag.left) / drag.width) * 100, 18, 82);
          const y = clamp(((ev.clientY - drag.top) / drag.height) * 100, 20, 78);
          setSimulationState({ lensX: x, lensY: y, phase: "Transition / 전환" });
          return;
        }
      }

      function handleSimulationPointerUp() {
        const m = simulationInteraction();
        if (!m) return;
        const sim = simStateFor(m);
        const drag = sim.drag;
        if (!drag) return;
        if (drag.kind === "rail") {
          setSimulationState({ drag: null, phase: "Settle / 안착" });
          scheduleSimPhase("Rest / 정지", 520, { drag: null });
          return;
        }
        if (drag.kind === "sheet") {
          const open = sim.panelOpen >= 0.48 ? 1 : 0.16;
          setSimulationState({ drag: null, panelOpen: open, phase: "Settle / 안착" });
          scheduleSimPhase(open > 0.5 ? "Rest / 정지" : "Rest / 정지", 520, { drag: null, panelOpen: open });
          return;
        }
        if (drag.kind === "card") {
          setSimulationState({ drag: null, cardX: 0, cardY: 0, cardLift: 0, phase: "Settle / 안착" });
          scheduleSimPhase("Rest / 정지", 520, { drag: null, cardX: 0, cardY: 0, cardLift: 0 });
          return;
        }
        if (drag.kind === "lens") {
          setSimulationState({ drag: null, phase: "Settle / 안착" });
          scheduleSimPhase("Rest / 정지", 520, { drag: null });
        }
      }

      window.addEventListener("pointermove", handleSimulationPointerMove, { passive: true });
      window.addEventListener("pointerup", handleSimulationPointerUp);
      window.addEventListener("pointercancel", handleSimulationPointerUp);

      /* =========================================================
         7. 세션 헬퍼 — API 키와 이미지 표시 설정만 이 브라우저 세션에 보관
         모델은 GPT-5.6 Terra / Image 2.5 Flare로 고정합니다.
         ========================================================= */
      function loadSession() {
        try {
          state.apiKey = sessionStorage.getItem(CONFIG.SESSION_KEY_API) || "";
          const raw = sessionStorage.getItem(CONFIG.SESSION_KEY_PREFS);
          if (raw) {
            const m = JSON.parse(raw);
            if (m && typeof m === "object") {
              if (m.quality) state.quality = m.quality;
              if (m.labelLang) state.labelLang = m.labelLang;
            }
          }
        } catch (e) { /* 세션 저장소 차단 환경 */ }
      }
      function saveSession() {
        try {
          sessionStorage.setItem(CONFIG.SESSION_KEY_API, state.apiKey || "");
          sessionStorage.setItem(CONFIG.SESSION_KEY_PREFS, JSON.stringify({
            quality: state.quality, labelLang: state.labelLang
          }));
        } catch (e) { /* 무시 */ }
      }

      /* =========================================================
         8. OpenAI 호출 — GPT-5.6 Terra / Image 2.5 Flare 고정
         파라미터 호환성 차이가 있을 때만 요청 옵션을 단계적으로 줄여 재시도합니다.
         ========================================================= */
      let activeController = null;

      function parseModelJson(text) {
        let t = String(text || "").trim();
        t = t.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
        try { return JSON.parse(t); } catch (e) { /* 구간 추출 재시도 */ }
        const starts = [t.indexOf("{"), t.indexOf("[")].filter(i => i >= 0);
        const first = starts.length ? Math.min.apply(null, starts) : -1;
        const last = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
        if (first >= 0 && last > first) {
          try { return JSON.parse(t.slice(first, last + 1)); } catch (e) { /* fallthrough */ }
        }
        throw new Error("AI 응답을 JSON으로 해석하지 못했습니다. 다시 시도해 주세요.");
      }

      function extractOutputText(data) {
        if (data && typeof data.output_text === "string" && data.output_text.trim()) return data.output_text;
        const out = (data && Array.isArray(data.output)) ? data.output : [];
        const parts = [];
        out.forEach(item => {
          if (item && Array.isArray(item.content)) {
            item.content.forEach(c => {
              if (c && typeof c.text === "string" && (c.type === "output_text" || c.type === "text")) parts.push(c.text);
            });
          }
        });
        return parts.join("\n");
      }

      function httpMessage(status, payload) {
        const detail = payload && payload.error && payload.error.message ? payload.error.message : "";
        if (status === 401 || status === 403) return "API 키가 유효하지 않거나 권한이 없습니다. 키를 다시 확인해 주세요.";
        if (status === 404) return `고정 모델을 찾을 수 없습니다. API 계정에서 GPT-5.6 Terra와 Image 2.5 Flare 사용 권한을 확인해 주세요.${detail ? " (" + detail + ")" : ""}`;
        if (status === 429) return "요청이 너무 많거나 사용 한도에 도달했습니다. 잠시 후 다시 시도해 주세요.";
        if (status === 400) return detail || "요청 형식이 거부되었습니다.";
        return `요청이 거부되었습니다 (상태 ${status}).${detail ? " " + detail : ""}`;
      }

      async function postJson(path, body, controller) {
        const res = await fetch(CONFIG.API_BASE + path, {
          method: "POST",
          signal: controller.signal,
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${state.apiKey || ""}`
          },
          body: JSON.stringify(body)
        });
        let payload = null;
        try { payload = await res.json(); } catch (e) { payload = null; }
        if (!res.ok) {
          const err = new Error(httpMessage(res.status, payload));
          err.status = res.status;
          err.fatal = [401, 403].includes(res.status);
          err.paramIssue = res.status === 400 || res.status === 404;
          throw err;
        }
        return payload;
      }

      /* 텍스트 분석 — Responses API. 모델별 파라미터 지원 차이를 흡수합니다. */
      async function callText(systemPrompt, userPrompt) {
        const controller = new AbortController();
        activeController = controller;

        const input = [
          { role: "system", content: systemPrompt },
          { role: "user", content: userPrompt }
        ];
        const variants = [
          { model: FIXED_TEXT_MODEL, input, text: { format: { type: "json_object" } }, max_output_tokens: 12000, reasoning: { effort: "low" } },
          { model: FIXED_TEXT_MODEL, input, text: { format: { type: "json_object" } }, max_output_tokens: 12000 },
          { model: FIXED_TEXT_MODEL, input, text: { format: { type: "json_object" } } },
          { model: FIXED_TEXT_MODEL, input }
        ];

        const delays = [900, 2200, 5000];
        let lastError = "알 수 없는 오류가 발생했습니다.";
        let vi = 0;
        let attempt = 0;

        while (vi < variants.length) {
          try {
            const data = await postJson("/responses", variants[vi], controller);
            if (data && data.status === "incomplete") {
              throw new Error("응답이 최대 길이에 도달해 잘렸습니다. 선택 항목을 줄이고 다시 시도해 주세요.");
            }
            const text = extractOutputText(data);
            if (!text.trim()) throw new Error("AI가 빈 응답을 반환했습니다. 다시 시도해 주세요.");
            return parseModelJson(text);
          } catch (err) {
            if (err.name === "AbortError") { const e = new Error("__aborted__"); e.aborted = true; throw e; }
            lastError = err.message;
            if (err.fatal) break;
            if (err.paramIssue) { vi += 1; attempt = 0; continue; }
            if (attempt >= delays.length) break;
            await new Promise(r => setTimeout(r, delays[attempt]));
            attempt += 1;
          }
        }
        throw new Error(lastError);
      }

      /* 이미지 생성 — Images API. 통합 이미지 한 장만 생성합니다. */
      async function callImage(prompt) {
        const controller = new AbortController();
        activeController = controller;

        const variants = [
          { model: FIXED_IMAGE_MODEL, prompt, size: CONFIG.IMAGE_SIZE, quality: state.quality },
          { model: FIXED_IMAGE_MODEL, prompt, size: CONFIG.IMAGE_SIZE },
          { model: FIXED_IMAGE_MODEL, prompt }
        ];
        const delays = [1200, 3000];
        let lastError = "이미지를 생성하지 못했습니다.";
        let vi = 0;
        let attempt = 0;

        while (vi < variants.length) {
          try {
            const data = await postJson("/images/generations", variants[vi], controller);
            const first = data && Array.isArray(data.data) ? data.data[0] : null;
            if (first && first.b64_json) return `data:image/png;base64,${first.b64_json}`;
            if (first && first.url) return first.url;
            throw new Error("이미지 응답이 비어 있습니다. 다시 시도해 주세요.");
          } catch (err) {
            if (err.name === "AbortError") { const e = new Error("__aborted__"); e.aborted = true; throw e; }
            lastError = err.message;
            if (err.fatal) break;
            if (err.paramIssue) { vi += 1; attempt = 0; continue; }
            if (attempt >= delays.length) break;
            await new Promise(r => setTimeout(r, delays[attempt]));
            attempt += 1;
          }
        }
        throw new Error(lastError);
      }

      async function withLoading(msg, fn) {
        setState({ isAnalyzing: true, loadingMsg: msg, errorMsg: null });
        try {
          const out = await fn();
          setState({ isAnalyzing: false });
          return out;
        } catch (err) {
          if (err && err.aborted) { setState({ isAnalyzing: false }); toast("작업을 취소했습니다."); return null; }
          console.error(err);
          setState({ isAnalyzing: false, errorMsg: err.message || "처리에 실패했습니다." });
          return null;
        } finally {
          activeController = null;
        }
      }

      /* =========================================================
         9. 응답 정규화 — 필드가 빠져도 화면이 죽지 않도록 방어
         ========================================================= */
      const str = v => (typeof v === "string" ? v.trim() : (v === null || v === undefined ? "" : String(v)));
      const arr = v => (Array.isArray(v) ? v : []);

      /* AI가 스타일 이름을 조금 다르게 적어도 가장 가까운 것으로 맞춥니다. */
      function matchStyle(raw, i) {
        const want = str(raw).toLowerCase();
        if (want) {
          const exact = STYLE_NAMES.find(n => n.toLowerCase() === want);
          if (exact) return exact;
          const partial = STYLE_NAMES.find(n => n.toLowerCase().includes(want) || want.includes(n.toLowerCase()));
          if (partial) return partial;
        }
        return STYLE_NAMES[i % STYLE_NAMES.length];
      }

      /* 형상을 지정하지 않고 오면 서로 다른 기본 형상을 돌려 씁니다. */
      const FORM_FALLBACK = [
        "a flat square material tile with softly radiused corners and visible thickness",
        "a rounded rectangular sample chip with a chamfered edge",
        "three stacked material coupons of slightly different thickness",
        "a gently curved sample strip with a clean cut edge",
        "a thin folded sample sheet with one lifted edge exposing its section",
        "a slim rectangular panel with one precision-cut corner revealing thickness",
        "a layered cross-section coupon with a clean exposed edge",
        "a flat circular material puck with a simple beveled rim"
      ];

      function clampValue(raw, level) {
        const n = Number(raw);
        if (Number.isFinite(n)) return Math.max(2, Math.min(98, Math.round(n)));
        const map = { "낮음": 22, "중간": 55, "높음": 84 };
        return map[str(level)] || 55;
      }
      function levelFromValue(v) { return v < 38 ? "낮음" : (v > 68 ? "높음" : "중간"); }

      function normConcepts(raw) {
        return arr(raw && raw.concepts).slice(0, 3).map((c, i) => ({
          id: uid("cpt"),
          index: i + 1,
          nameKo: str(c.nameKo) || `해석 ${i + 1}`,
          nameEn: str(c.nameEn) || `Concept ${i + 1}`,
          definition: str(c.definition) || NO_DATA,
          moodWords: arr(c.moodWords).map(str).filter(Boolean).slice(0, 6),
          experience: str(c.experience),
          subject: str(c.subject),
          visual: str(c.visual) || str(c.subject) || "an abstract still life on a neutral background",
          label: str(c.label) || str(c.nameEn) || `Concept ${i + 1}`,
          labelKo: str(c.labelKo) || str(c.nameKo),
          style: matchStyle(c.style, i)
        }));
      }

      function normPerceptions(raw) {
        return arr(raw && raw.perceptions).slice(0, 6).map((p, i) => ({
          id: uid("prc"),
          index: i + 1,
          category: str(p.category) || "지각",
          titleKo: str(p.titleKo) || `지각 특성 ${i + 1}`,
          titleEn: str(p.titleEn) || `Perception ${i + 1}`,
          description: str(p.description) || NO_DATA,
          cue: str(p.cue),
          visual: str(p.visual) || "a single object on a neutral background",
          label: str(p.label) || str(p.titleEn) || `Perception ${i + 1}`,
          labelKo: str(p.labelKo) || str(p.titleKo),
          style: matchStyle(p.style, i)
        }));
      }

      function normProperties(raw) {
        const levels = ["낮음", "중간", "높음"];
        return arr(raw && raw.properties).slice(0, 14).map((p, i) => ({
          id: uid("prp"),
          index: i + 1,
          axis: str(p.axis) || "물성",
          titleKo: str(p.titleKo) || `물성 ${i + 1}`,
          titleEn: str(p.titleEn) || `Property ${i + 1}`,
          description: str(p.description) || NO_DATA,
          check: str(p.check),
          interactionHint: str(p.interactionHint),
          value: clampValue(p.value, p.level),
          level: levels.includes(str(p.level)) ? str(p.level) : levelFromValue(clampValue(p.value, p.level)),
          visual: str(p.visual) || "a clean interaction study showing deformation, motion, resistance, recovery, optical feedback or haptic-like response",
          label: str(p.label) || str(p.titleEn) || `Property ${i + 1}`,
          labelKo: str(p.labelKo) || str(p.titleKo)
        }));
      }

      function normInteractions(raw) {
        const source = arr(raw && (raw.interactions || raw.materials));
        return source.slice(0, 5).map((m, i) => ({
          id: uid("int"),
          index: i + 1,
          nameKo: str(m.nameKo) || `인터랙션 ${i + 1}`,
          nameEn: str(m.nameEn) || `Interaction ${i + 1}`,
          type: str(m.type) || `Interaction Concept ${i + 1}`,
          role: str(m.role) || NO_DATA,
          interactionDNA: str(m.interactionDNA) || NO_DATA,
          rest: str(m.rest) || NO_DATA,
          acknowledge: str(m.acknowledge) || NO_DATA,
          resistance: str(m.resistance) || NO_DATA,
          transition: str(m.transition) || NO_DATA,
          settle: str(m.settle) || NO_DATA,
          timing: str(m.timing) || NO_DATA,
          haptic: str(m.haptic) || "없음",
          visualBehavior: str(m.visualBehavior) || NO_DATA,
          propertyMapping: arr(m.propertyMapping).map(str).filter(Boolean).slice(0, 4),
          emotionalEffect: str(m.emotionalEffect) || NO_DATA,
          states: arr(m.states).slice(0, 3).map((x, j) => ({
            labelKo: str(x && x.labelKo) || ["시작", "입력 중", "안착"][j],
            labelEn: str(x && x.labelEn) || ["Rest", "Acknowledge", "Settle"][j],
            description: str(x && x.description) || ""
          })),
          visual: str(m.visual) || "clean smartphone UI component study showing three sequential states of the same control with clear motion and deformation cues"
        }));
      }

      /* =========================================================
         10. 단계 이동 규칙 — 데이터가 준비된 단계까지만 이동
         ========================================================= */
      function stepReady(n) {
        switch (n) {
          case 1: return true;
          case 2: return state.concepts.length > 0;
          case 3: return state.perceptions.length > 0;
          case 4: return state.properties.length > 0;
          case 5: return state.interactions.length > 0;
          case 6: return state.interactions.length > 0;
          default: return false;
        }
      }

      /* =========================================================
         11. 자동 저장
         ========================================================= */
      /* 홈(step 0)은 탐색 화면일 뿐 프로젝트 진행 단계가 아닙니다.
         저장 시 화면 위치가 아니라 실제 생성된 데이터의 가장 깊은 단계를 기록합니다. */
      function progressStep() {
        if (state.interactions.length) return 5;
        if (state.properties.length) return 4;
        if (state.perceptions.length) return 3;
        if (state.concepts.length) return 2;
        return 1;
      }

      function snapshot() {
        return {
          projectId: state.projectId,
          keyword: state.keyword,
          note: state.note,
          concepts: state.concepts,
          conceptId: state.conceptId,
          perceptions: state.perceptions,
          perceptionIds: state.perceptionIds,
          properties: state.properties,
          propertyIds: state.propertyIds,
          interactions: state.interactions,
          simulationId: state.simulationId,
          createdAt: state.createdAt,
          step: progressStep()
        };
      }

      function hasContent() {
        return !!(state.keyword || state.concepts.length || state.perceptions.length ||
          state.properties.length || state.interactions.length);
      }

      function projectTitle() {
        const c = selectedConcept();
        if (state.keyword && c) return `${state.keyword} · ${c.nameKo}`;
        if (state.keyword) return state.keyword;
        return "이름 없는 프로젝트";
      }

      let quotaWarned = false;
      function persist(showToast) {
        if (!hasContent()) return "empty";
        const r = Store.save(snapshot(), { id: state.projectId, title: projectTitle() });
        if (r.ok) {
          if (showToast) toast("진행 상태를 저장했습니다.");
          if (r.pruned === "oldest") toast("저장 공간이 부족해 가장 오래된 프로젝트를 정리했습니다.");
          return "ok";
        }
        if (!quotaWarned) {
          quotaWarned = true;
          toast("저장 공간이 부족해 자동 저장이 중단되었습니다. 리포트를 파일로 내려받아 주세요.", "error");
        }
        return "full";
      }

      /* =========================================================
         12. 렌더 헬퍼 — 카드/버튼/이미지의 형식을 한곳에서 통일
         ========================================================= */
      function header(title, backStep) {
        const cur = STAGES.find(s => s.n === state.step);
        const nextN = state.step + 1;
        const showNext = STAGES.some(s => s.n === nextN) && stepReady(nextN);
        const pct = cur ? Math.round((cur.n / STAGES.length) * 100) : 0;
        return `
        <header class="fixed top-0 left-0 right-0 z-50 bg-white max-w-[430px] mx-auto">
          <div class="px-3 h-14 flex items-center justify-between gap-1">
            <div class="flex items-center gap-1 overflow-hidden flex-1 min-w-0">
              ${backStep !== undefined ? `<button type="button" aria-label="이전 단계로" onclick="setState({step:${backStep}}, true)" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-700 flex-shrink-0"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>` : ""}
              <h1 class="t-h3 truncate text-slate-900">${esc(title)}</h1>
            </div>
            <div class="flex items-center gap-0.5 flex-shrink-0 text-slate-700">
              ${showNext ? `<button type="button" aria-label="다음 단계로" onclick="setState({step:${nextN}}, true)" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-900"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>` : ""}
              <button type="button" aria-label="진행 상태 저장" onclick="Actions.saveNow()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="save" class="w-6 h-6"></i></button>
              <button type="button" aria-label="리포트 복사" onclick="Actions.copyReport()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="copy" class="w-6 h-6"></i></button>
              <button type="button" aria-label="처음 화면으로" onclick="Actions.goHome()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="home" class="w-6 h-6"></i></button>
            </div>
          </div>
          ${cur ? `<div class="px-4 pb-2 flex items-center gap-3">
            <div class="h-2 bg-slate-300 rounded-full flex-1 overflow-hidden"><div class="h-full bg-blue-700 rounded-full transition-all" style="width:${pct}%"></div></div>
            <span class="t-meta font-bold text-slate-600 tabular-nums flex-shrink-0">${cur.n} / ${STAGES.length} · ${esc(cur.label)}</span>
          </div>` : ""}
        </header>`;
      }

      function dock(inner) {
        return `<div class="fixed bottom-0 left-0 right-0 px-5 pt-5 dock bg-white max-w-[430px] mx-auto z-[60]">${inner}</div>`;
      }

      function primaryBtn(label, onclick, disabled) {
        return `<button type="button" ${disabled ? "disabled" : ""} onclick="${onclick}"
          class="w-full py-5 rounded-2xl font-bold t-h3 text-white bg-slate-900 hover:bg-slate-800 disabled:bg-slate-200 disabled:text-slate-500 disabled:shadow-none shadow-lg active:scale-[0.98] disabled:active:scale-100 transition-all">${esc(label)}</button>`;
      }

      function secondaryBtn(label, onclick, icon) {
        return `<button type="button" onclick="${onclick}"
          class="w-full py-4 rounded-2xl font-bold t-small text-slate-700 bg-white border-2 border-slate-200 hover:bg-slate-50 active:scale-[0.98] transition-all flex items-center justify-center gap-2">${icon ? `<i data-lucide="${icon}" class="w-5 h-5"></i>` : ""}${esc(label)}</button>`;
      }

      function ghostBtn(label, onclick, icon) {
        return `<button type="button" onclick="${onclick}"
          class="px-4 py-2.5 rounded-xl font-bold t-meta text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 transition-all inline-flex items-center gap-1.5">${icon ? `<i data-lucide="${icon}" class="w-4 h-4"></i>` : ""}${esc(label)}</button>`;
      }

      /* 모든 선택 카드는 테두리·체크 표시·선택 상태를 동일한 형식으로 씁니다. */
      function optionCard(opts) {
        const on = !!opts.selected;
        const badge = opts.badge
          ? `<span class="t-meta font-bold px-2.5 py-1 rounded-lg flex-shrink-0 ${on ? "bg-blue-100 text-blue-800" : "bg-slate-200 text-slate-700"}">${esc(opts.badge)}</span>`
          : "";
        return `<button type="button" onclick="${opts.onclick}" aria-pressed="${on}"
          class="w-full text-left p-5 rounded-[2rem] border-2 transition-all bg-white ${on ? "border-blue-700 shadow-lg ring-2 ring-blue-700/15" : "border-slate-200 hover:border-blue-300 shadow-md"}">
          <div class="flex items-start gap-3 mb-3">
            <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 font-bold t-meta tabular-nums ${on ? "bg-blue-700 text-white" : "bg-slate-200 text-slate-700"}">${on ? '<i data-lucide="check" class="w-5 h-5"></i>' : esc(pad2(opts.index))}</span>
            <div class="min-w-0 flex-1">
              <h3 class="t-h3 text-slate-900 leading-snug">${esc(opts.title)}</h3>
              ${opts.subtitle ? `<p class="t-meta text-slate-500">${esc(opts.subtitle)}</p>` : ""}
            </div>
            ${badge}
          </div>
          <div class="space-y-2">${opts.body || ""}</div>
        </button>`;
      }

      function chip(text, tone) {
        const cls = tone === "blue"
          ? "bg-blue-50 text-blue-800 border-blue-200"
          : "bg-slate-100 text-slate-700 border-slate-200";
        return `<span class="inline-block t-meta px-2.5 py-1 rounded-lg border ${cls}">${esc(text)}</span>`;
      }

      /* 단계별 통합 이미지 카드 */
      function imageCard(slot, opts) {
        const url = state.images ? state.images[slot] : null;
        const caption = opts.caption || "";
        const saveBtn = url
          ? `<button type="button" onclick="Actions.downloadImage('${slot}')"
               class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 t-meta font-bold hover:bg-slate-50 active:scale-[0.98] transition-all">
               <i data-lucide="download" class="w-4 h-4"></i>저장
             </button>`
          : "";
        const inner = url
          ? `<button type="button" onclick="Actions.openLightbox('${slot}')" class="block w-full">
               <img src="${escAttr(url)}" alt="${escAttr(opts.alt || "생성된 통합 이미지")}" class="w-full rounded-2xl bg-slate-100" />
             </button>`
          : `<div class="w-full rounded-2xl bg-slate-100 border-2 border-dashed border-slate-300 px-5 py-12 text-center">
               <i data-lucide="image" class="w-10 h-10 text-slate-400 mx-auto mb-3"></i>
               <p class="t-small text-slate-600">${esc(opts.empty || "아직 이미지를 생성하지 않았습니다.")}</p>
             </div>`;
        return `<section class="bg-white rounded-[2rem] p-4 border-2 border-slate-200 shadow-md mb-6">
          <div class="flex items-center justify-between gap-3 mb-3 px-1">
            <h3 class="t-label text-slate-500">${esc(opts.title)}</h3>
            ${saveBtn}
          </div>
          ${inner}
          ${caption ? `<p class="t-meta text-slate-500 mt-3 px-1 prose-ko">${esc(caption)}</p>` : ""}
        </section>`;
      }

      function instructionBox(id, onSend, placeholder) {
        return `<section class="p-5 bg-slate-800 rounded-3xl shadow-xl mt-8">
          <h3 class="t-label text-blue-300 mb-3">AI 수정 지시</h3>
          <label for="${id}" class="sr-only">수정 지시 입력</label>
          <textarea id="${id}" rows="3" oninput="setDraft('${id}', this.value)"
            class="w-full block min-w-0 bg-white/10 border border-white/20 rounded-xl px-4 py-3.5 text-white t-small outline-none resize-none placeholder:text-slate-300 focus:border-blue-400 mb-3"
            placeholder="${escAttr(placeholder)}">${esc(draft(id))}</textarea>
          <button type="button" onclick="${onSend}"
            class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold t-small flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
            <i data-lucide="send" class="w-5 h-5"></i>지시대로 다시 생성
          </button>
        </section>`;
      }

      /* 각 단계 상단 — 앞 단계에서 무엇을 골랐는지 그대로 보여 줍니다. */
      function priorChoice(rows) {
        const list = rows.filter(r => r && r.value);
        if (!list.length) return "";
        return `<section class="bg-white border-2 border-slate-200 rounded-[1.5rem] px-5 py-4 mb-6 shadow-sm">
          ${list.map(r => `<div class="py-1 border-t border-slate-100 first:border-t-0 first:pt-0">
            <span class="t-meta font-bold text-slate-500">${esc(r.label)}</span>
            <p class="t-small text-slate-800 prose-ko">${esc(r.value)}</p>
          </div>`).join("")}
        </section>`;
      }

      function joinTitles(items, key) {
        return items.map((it, i) => `${pad2(i + 1)} ${it[key]}`).join("   ");
      }

      function sectionTitle(text, sub) {
        return `<h2 class="t-h1 text-slate-900 mb-2">${esc(text)}</h2>
          ${sub ? `<p class="t-small text-slate-600 mb-6 prose-ko">${esc(sub)}</p>` : `<div class="mb-6"></div>`}`;
      }

      /* =========================================================
         13. 리포트
         ========================================================= */
      function buildReport() {
        const L = [];
        const line = "==================================================";
        L.push(line, "   감성 · 지각 · 인터랙션 컨셉 랩 · 종합 리포트", line, "");
        L.push("[감성 키워드]", `- ${state.keyword || "설정된 키워드 없음"}`);
        L.push(`- 감성 해석 방식: ${EMOTION_METHOD.label} (${EMOTION_METHOD.en})`);
        if (state.note) L.push(`- 연관 과제: ${state.note}`);
        L.push("");

        if (state.concepts.length) {
          L.push(line, " 1. 감성 해석", line);
          state.concepts.forEach((c, i) => {
            const on = c.id === state.conceptId ? "  ★ 선택됨" : "";
            L.push("", `${pad2(i + 1)}. ${c.nameKo} / ${c.nameEn}${on}`);
            if (c.moodWords.length) L.push(`  감성 단어: ${c.moodWords.join(" · ")}`);
            if (c.subject) L.push(`  대표 장면: ${c.subject}`);
            L.push(`  ${c.definition}`);
            if (c.experience) L.push(`  체감: ${c.experience}`);
          });
          L.push("");
        }

        if (state.perceptions.length) {
          L.push(line, " 2. 지각 특성", line);
          state.perceptions.forEach((p, i) => {
            const on = state.perceptionIds.includes(p.id) ? "  ★ 선택됨" : "";
            L.push("", `${pad2(i + 1)}. [${p.category}] ${p.titleKo} / ${p.titleEn}${on}`);
            L.push(`  ${p.description}`);
            if (p.cue) L.push(`  관찰 단서: ${p.cue}`);
          });
          L.push("");
        }

        if (state.properties.length) {
          L.push(line, " 3. 인터랙션 물성", line);
          state.properties.forEach((p, i) => {
            const on = state.propertyIds.includes(p.id) ? "  ★ 선택됨" : "";
            L.push("", `${pad2(i + 1)}. [${p.axis}] ${p.titleKo} / ${p.titleEn} · 목표 ${p.level} (LOW 0 - HIGH 100 축에서 ${p.value})${on}`);
            L.push(`  ${p.description}`);
            if (p.interactionHint) L.push(`  인터랙션 변환: ${p.interactionHint}`);
            if (p.check) L.push(`  확인 방법: ${p.check}`);
          });
          L.push("");
        }

        if (state.interactions.length) {
          L.push(line, " 4. 인터랙션 제안", line);
          state.interactions.forEach((m, i) => {
            L.push("", `${pad2(i + 1)}. ${m.nameKo} / ${m.nameEn}  (${m.type})`);
            L.push(`  역할: ${m.role}`);
            L.push(`  Interaction DNA: ${m.interactionDNA}`);
            L.push(`  Rest: ${m.rest}`);
            L.push(`  Acknowledge: ${m.acknowledge}`);
            L.push(`  Resistance: ${m.resistance}`);
            L.push(`  Transition: ${m.transition}`);
            L.push(`  Settle: ${m.settle}`);
            L.push(`  Timing: ${m.timing}`);
            L.push(`  Haptic: ${m.haptic}`);
            L.push(`  Visual Behavior: ${m.visualBehavior}`);
            if (m.propertyMapping && m.propertyMapping.length) L.push(`  연결 물성: ${m.propertyMapping.join(" · ")}`);
            L.push(`  감성 효과: ${m.emotionalEffect}`);
          });
          L.push("");
        }

        if (state.interactions.length) {
          const sim = simulationInteraction();
          L.push(line, " 5. 인터랙션 시뮬레이션", line);
          L.push("- 마지막 단계에서 가상 스마트폰 화면 위에서 선택한 인터랙션 컨셉을 직접 눌러 보고, 끌어 보고, 열어 보며 물성을 체감할 수 있습니다.");
          if (sim) L.push(`- 기본 시뮬레이션 대상: ${sim.nameKo} / ${sim.nameEn} (${sim.type})`);
          L.push("- 시뮬레이션 단계에서는 각 컨셉의 Motion Grammar와 연결 물성이 실제 터치 반응으로 어떻게 느껴지는지 확인합니다.");
          L.push("");
        }

        L.push(line, `생성 시각: ${nowLabel(Date.now())}`, line);
        return L.join("\n");
      }


      /* =========================================================
         13-B. PDF 리포트 — 분석 내용과 생성 이미지를 함께 담습니다.
         화면 밖에 인쇄용 문서를 만들고 블록 단위로 캡처해 A4에 배치합니다.
         블록 단위로 나누면 문장이 페이지 경계에서 잘리지 않습니다.
         ========================================================= */
      const PDF = {
        W: 794,
        blk(inner, pad) {
          return `<div style="box-sizing:border-box;width:794px;padding:${pad || "0 0 14px 0"};background:#ffffff;font-family:'Pretendard',sans-serif;color:#0f172a;">${inner}</div>`;
        },
        heading(no, title, en) {
          return PDF.blk(`<div style="border-top:3px solid #0f172a;padding-top:12px;margin-top:18px;">
            <span style="font-size:22px;font-weight:800;letter-spacing:-0.01em;">${esc(no)}</span>
            <span style="font-size:22px;font-weight:800;margin-left:8px;">${esc(title)}</span>

      /* 이미지가 끝내 로드되지 않아도 PDF 생성이 멈추지 않도록 기다림에 상한을 둡니다. */
      function waitForImages(root, timeoutMs) {
        const imgs = Array.from(root.querySelectorAll("img"));
        const all = Promise.all(imgs.map(im => (im.complete && im.naturalWidth)
          ? Promise.resolve()
          : new Promise(res => { im.onload = res; im.onerror = res; })));
        return Promise.race([all, new Promise(res => setTimeout(res, timeoutMs || 6000))]);
      }

      async function exportPdf() {
        const h2c = window.html2canvas;
        const JsPDF = window.jspdf && window.jspdf.jsPDF;
        if (!h2c || !JsPDF) {
          toast("PDF 모듈을 불러오지 못했습니다. 텍스트로 내려받습니다.", "error");
          downloadText(`interaction-report-${Date.now()}.txt`, buildReport());
          return;
        }

        const holder = document.createElement("div");
        holder.setAttribute("aria-hidden", "true");
        holder.style.cssText = `position:absolute;left:-10000px;top:0;width:${PDF.W}px;background:#ffffff;`;
        holder.innerHTML = PDF.document();
        document.body.appendChild(holder);

        try {
          await waitForImages(holder);
          if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) { /* 무시 */ } }

          const pdf = new JsPDF({ unit: "pt", format: "a4" });
          const pw = pdf.internal.pageSize.getWidth();
          const ph = pdf.internal.pageSize.getHeight();
          const M = 34;
          const maxW = pw - M * 2;
          const maxH = ph - M * 2;
          let y = M;
          let placed = 0;

          const blocks = Array.from(holder.children);
          for (const b of blocks) {
            const canvas = await h2c(b, { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false });
            let w = maxW;
            let h = canvas.height * maxW / canvas.width;
            if (h > maxH) { h = maxH; w = canvas.width * maxH / canvas.height; }
            if (placed && y + h > ph - M) { pdf.addPage(); y = M; }
            pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", M + (maxW - w) / 2, y, w, h);
            y += h + 6;
            placed += 1;
          }
          if (!placed) throw new Error("리포트에 담을 내용이 없습니다.");
          pdf.save(`Interaction-리포트-${(state.keyword || "무제").slice(0, 20)}.pdf`);
        } finally {
          if (holder.parentNode) holder.parentNode.removeChild(holder);
        }
      }

      function downloadText(name, text) {
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      /* =========================================================
         14. ACTIONS
         ========================================================= */
      const Actions = {
        /* ---- 접속 / 프로젝트 ---- */
        validateKey() {
          const el = document.getElementById("api-input");
          const key = el ? el.value.trim() : "";
          if (!key) { setState({ errorMsg: "API 키를 입력해 주세요." }); return; }
          if (!/^sk-/.test(key)) { setState({ errorMsg: "OpenAI API 키는 sk- 로 시작합니다. 키를 다시 확인해 주세요." }); return; }
          state.apiKey = key;
          saveSession();
          setState({ step: 0, errorMsg: null }, true);
        },
        pickQuality(id) { state.quality = id; saveSession(); render(); },
        pickLabelLang(id) { state.labelLang = id; saveSession(); render(); },
        toggleSettings() { setState({ settingsOpen: !state.settingsOpen }); },

        startNewProject() {
          persist(false);
          Object.assign(state, blankProject());
          drafts["keyword-input"] = "";
          drafts["note-input"] = "";
          setState({ step: 1 }, true);
        },

        async openProject(id) {
          const row = Store.list().find(p => p.id === id);
          if (!row || !row.data) { toast("프로젝트를 찾지 못했습니다.", "error"); return; }
          persist(false);
          const d = row.data;
          Object.assign(state, blankProject(), {
            projectId: d.projectId || row.id,
            keyword: d.keyword || "",
            note: d.note || "",
            concepts: arr(d.concepts),
            conceptId: d.conceptId || null,
            perceptions: arr(d.perceptions),
            perceptionIds: arr(d.perceptionIds),
            properties: arr(d.properties),
            propertyIds: arr(d.propertyIds),
            interactions: arr(d.interactions || d.materials),
            simulationId: d.simulationId || null,
            simulation: null,
            createdAt: d.createdAt || row.savedAt,
            images: { emotion: null, perception: null, property: null, interaction: null }
          });
          drafts["keyword-input"] = state.keyword;
          drafts["note-input"] = state.note;

          /* 구버전에서 step이 1로 잘못 저장된 프로젝트도 데이터 기준으로 정상 복구합니다. */
          setState({ step: progressStep() }, true);

          const imgs = await ImageDB.loadAll(state.projectId);
          /* 구버전이 남긴 고아 이미지도 정리합니다. 데이터가 없는 단계의 이미지는 복원하지 않습니다. */
          const orphanSlots = [];
          if (!state.concepts.length && imgs.emotion) orphanSlots.push("emotion");
          if (!state.perceptions.length && imgs.perception) orphanSlots.push("perception");
          if (!state.properties.length && imgs.property) orphanSlots.push("property");
          if (!state.interactions.length && imgs.interaction) orphanSlots.push("interaction");
          orphanSlots.forEach(slot => { imgs[slot] = null; });
          if (orphanSlots.length) await ImageDB.removeSlots(state.projectId, orphanSlots);
          setState({ images: Object.assign({ emotion: null, perception: null, property: null, interaction: null }, imgs) });
        },

        deleteProject(id) {
          if (!window.confirm("이 프로젝트와 생성된 이미지를 모두 지웁니다. 계속할까요?")) return;
          Store.remove(id);
          /* 지금 열려 있는 프로젝트였다면 비워 둡니다. 그러지 않으면 자동 저장이 되살립니다. */
          if (state.projectId === id) Object.assign(state, blankProject());
          toast("프로젝트를 삭제했습니다.");
          render();
        },

        goHome() {
          /* 현재 분석 진행도를 먼저 저장하고 홈으로 이동합니다.
             이후 홈에서 자동 저장이 실행돼도 snapshot()이 progressStep()을 사용하므로 진행 단계가 1로 되돌아가지 않습니다. */
          persist(false);
          setState({ step: 0 }, true);
        },
        saveNow() { const r = persist(true); if (r === "empty") toast("아직 저장할 내용이 없습니다."); },

        copyReport() {
          const text = buildReport();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
              .then(() => toast("리포트를 클립보드에 복사했습니다."))
              .catch(() => downloadText("interaction-report.txt", text));
          } else {
            downloadText("interaction-report.txt", text);
          }
        },
        downloadReport() { downloadText(`interaction-report-${Date.now()}.txt`, buildReport()); },
        async exportPdf() {
          setState({ isAnalyzing: true, loadingMsg: "리포트를 PDF로 만들고 있습니다", errorMsg: null });
          try {
            await exportPdf();
            setState({ isAnalyzing: false });
            toast("PDF를 내려받았습니다.");
          } catch (err) {
            console.error(err);
            setState({ isAnalyzing: false, errorMsg: "PDF를 만들지 못했습니다. 잠시 후 다시 시도해 주세요." });
          }
        },

        cancel() { if (activeController) activeController.abort(); },

        /* ---- 이미지 공통 ---- */
        openLightbox(slot) { setState({ lightbox: slot }); },
        closeLightbox() { setState({ lightbox: null }); },
        downloadImage(slot) {
          const url = state.images[slot];

          a.download = `interaction-${slot}-${Date.now()}.png`;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
        },
        async saveImage(slot, dataUrl) {
          state.images = Object.assign({}, state.images, { [slot]: dataUrl });
          await ImageDB.put(state.projectId, slot, dataUrl);
        },
        async clearImageSlots(slots) {
          const targets = Array.from(new Set(arr(slots).filter(slot => IMAGE_SLOTS.includes(slot))));
          if (!targets.length) return;
          const nextImages = Object.assign({}, state.images);
          targets.forEach(slot => { nextImages[slot] = null; });
          state.images = nextImages;
          await ImageDB.removeSlots(state.projectId, targets);
        },

        /* ---- 1단계 → 감성 해석 ---- */
        async generateConcepts(instruction) {
          const kw = (drafts["keyword-input"] !== undefined ? drafts["keyword-input"] : state.keyword).trim();
          const note = (drafts["note-input"] !== undefined ? drafts["note-input"] : state.note).trim();
          if (!kw) { setState({ errorMsg: "감성 키워드를 입력해 주세요." }); return; }
          state.keyword = kw;
          state.note = note;

          const data = await withLoading("감성을 세가지 경험으로 해석하고 있습니다", () =>
            callText(SYSTEM, PROMPTS.EMOTION(kw, note, instruction || "")));
          if (!data) return;

          const concepts = normConcepts(data);
          if (!concepts.length) { setState({ errorMsg: "감성 해석을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          await Actions.clearImageSlots(["emotion", "perception", "property", "interaction"]);
          setState({
            concepts,
            conceptId: null,
            perceptions: [], perceptionIds: [],
            properties: [], propertyIds: [],
            interactions: [],
            images: { emotion: null, perception: null, property: null, interaction: null },
            step: 2
          }, true);
          persist(false);
          await Actions.generateEmotionImage();
        },
        async regenerateConcepts() {
          const ins = draft("ins-emotion").trim();
          drafts["ins-emotion"] = "";
          await Actions.generateConcepts(ins);
        },
        async generateEmotionImage() {
          if (!state.concepts.length) return;
          const url = await withLoading("감성 해석 통합 이미지를 만들고 있습니다", () =>
            callImage(IMG.emotion(state.concepts)));
          if (!url) return;
          await Actions.saveImage("emotion", url);
          render();
        },

        /* ---- 2단계 → 지각 특성 ---- */
        async selectConcept(id) {
          const nextId = state.conceptId === id ? null : id;
          const changed = nextId !== state.conceptId;
          if (changed && (state.perceptions.length || state.properties.length || state.interactions.length)) {
            await Actions.clearImageSlots(["perception", "property", "interaction"]);
            setState({
              conceptId: nextId,
              perceptions: [], perceptionIds: [],
              properties: [], propertyIds: [],
              interactions: [],
              images: Object.assign({}, state.images, { perception: null, property: null, interaction: null })
            });
            persist(false);
            return;
          }
          setState({ conceptId: nextId });
        },
        async generatePerceptions(instruction) {
          const c = selectedConcept();
          if (!c) { setState({ errorMsg: "감성 해석을 먼저 선택해 주세요." }); return; }

          const data = await withLoading("지각 특성을 정리하고 있습니다", () =>
            callText(SYSTEM, PROMPTS.PERCEPTION(state.keyword, c, instruction || "")));
          if (!data) return;

          const perceptions = normPerceptions(data);
          if (!perceptions.length) { setState({ errorMsg: "지각 특성을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          await Actions.clearImageSlots(["perception", "property", "interaction"]);
          setState({
            perceptions,
            perceptionIds: [],
            properties: [], propertyIds: [],
            interactions: [],
            images: Object.assign({}, state.images, { perception: null, property: null, interaction: null }),
            step: 3
          }, true);
          persist(false);
          await Actions.generatePerceptionImage();

          const ins = draft("ins-perception").trim();
          drafts["ins-perception"] = "";
          await Actions.generatePerceptions(ins);

        async generatePerceptionImage() {
          if (!state.perceptions.length) return;

            callImage(IMG.perception(state.perceptions)));

        /* ---- 3단계 → 물성 정의 ---- */
        async togglePerception(id) {
          const on = state.perceptionIds.includes(id);
          const nextIds = on ? state.perceptionIds.filter(x => x !== id) : state.perceptionIds.concat(id);
          if (state.properties.length || state.interactions.length) {
            await Actions.clearImageSlots(["property", "interaction"]);
            setState({
              perceptionIds: nextIds,
              properties: [], propertyIds: [],
              interactions: [],
              images: Object.assign({}, state.images, { property: null, interaction: null })
            });
            persist(false);
            return;
          }
          setState({ perceptionIds: nextIds });
        },
        async selectAllPerceptions() {
          const all = state.perceptions.length === state.perceptionIds.length;
          const nextIds = all ? [] : state.perceptions.map(p => p.id);
          if (state.properties.length || state.interactions.length) {
            await Actions.clearImageSlots(["property", "interaction"]);
            setState({
              perceptionIds: nextIds,
              properties: [], propertyIds: [],
              interactions: [],
              images: Object.assign({}, state.images, { property: null, interaction: null })
            });
            persist(false);
            return;
          }
          setState({ perceptionIds: nextIds });
        },
        async generateProperties(instruction) {
          const c = selectedConcept();
          const picked = selectedPerceptions();
          if (!c) { setState({ errorMsg: "감성 해석을 먼저 선택해 주세요." }); return; }
          if (!picked.length) { setState({ errorMsg: "지각 요소를 하나 이상 선택해 주세요." }); return; }

          const data = await withLoading("인터랙션 물성을 정의하고 있습니다", () =>
            callText(SYSTEM, PROMPTS.PROPERTY(c, picked, instruction || "")));
          if (!data) return;

          const properties = normProperties(data);
          if (!properties.length) { setState({ errorMsg: "인터랙션 물성 정의를 받지 못했습니다. 다시 시도해 주세요." }); return; }

          await Actions.clearImageSlots(["property", "interaction"]);
          setState({
            properties,
            propertyIds: [],
            interactions: [],
            images: Object.assign({}, state.images, { property: null, interaction: null }),
            step: 4
          }, true);
          persist(false);
          await Actions.generatePropertyImage();
        },
        async regenerateProperties() {
          const ins = draft("ins-property").trim();
          drafts["ins-property"] = "";
          await Actions.generateProperties(ins);
        },
        async generatePropertyImage() {
          if (!state.properties.length) return;
          const url = await withLoading("인터랙션 물성 이미지를 만들고 있습니다", () =>
            callImage(IMG.property(state.properties)));
          if (!url) return;
          await Actions.saveImage("property", url);
          render();
        },

        /* ---- 4단계 → 인터랙션 제안 ---- */
        async toggleProperty(id) {
          const on = state.propertyIds.includes(id);
          const nextIds = on ? state.propertyIds.filter(x => x !== id) : state.propertyIds.concat(id);
          if (state.interactions.length) {
            await Actions.clearImageSlots(["interaction"]);
            setState({
              propertyIds: nextIds,
              interactions: [],
              images: Object.assign({}, state.images, { interaction: null })
            });
            persist(false);
            return;
          }
          setState({ propertyIds: nextIds });
        },
        async selectAllProperties() {
          const all = state.properties.length === state.propertyIds.length;
          const nextIds = all ? [] : state.properties.map(p => p.id);
          if (state.interactions.length) {
            await Actions.clearImageSlots(["interaction"]);
            setState({
              propertyIds: nextIds,
              interactions: [],
              images: Object.assign({}, state.images, { interaction: null })
            });
            persist(false);
            return;
          }
          setState({ propertyIds: nextIds });
        },
        async generateInteractions(instruction) {
          const c = selectedConcept();
          const picked = selectedProperties();
          if (!picked.length) { setState({ errorMsg: "물성을 하나 이상 선택해 주세요." }); return; }

          const data = await withLoading("인터랙션 제안을 만들고 있습니다", () =>
            callText(SYSTEM, PROMPTS.INTERACTION(c || { nameKo: state.keyword, nameEn: "" }, picked, instruction || "")));
          if (!data) return;

          const interactions = normInteractions(data);
          if (!interactions.length) { setState({ errorMsg: "인터랙션 제안을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          await Actions.clearImageSlots(["interaction"]);
          setState({
            interactions,
            images: Object.assign({}, state.images, { interaction: null }),
            step: 5
          }, true);
          persist(false);
          await Actions.generateInteractionImage();
        },
        async regenerateInteractions() {
          const ins = draft("ins-interaction").trim();
          drafts["ins-interaction"] = "";
          await Actions.generateInteractions(ins);
        },
        async generateInteractionImage() {
          if (!state.interactions.length) return;
          const url = await withLoading("인터랙션 컨셉 보드를 만들고 있습니다", () =>
            callImage(IMG.interaction(state.interactions)));
          if (!url) return;
          await Actions.saveImage("interaction", url);
          render();
        },
        openSimulation(id) {
          const target = id || state.simulationId || (state.interactions[0] && state.interactions[0].id);
          if (!target) { setState({ errorMsg: "시뮬레이션할 인터랙션이 없습니다." }); return; }
          resetSimulationFor(target);
          setState({ step: 6 }, true);
        },
        selectSimulationInteraction(id) {
          if (!id) return;
          resetSimulationFor(id);
          render(true);
        },
        resetSimulation() {
          const current = simulationInteraction();
          resetSimulationFor(current ? current.id : null);
          render();
        },
        simButtonDown() {
          const m = simulationInteraction();
          if (!m) return;
          clearTimeout(simTimer);
          setSimulationState({ active: true, pressDepth: 1, ripple: Date.now(), phase: "Acknowledge / 입력 감지" });
          scheduleSimPhase("Resistance / 저항", 100, { active: true, pressDepth: 1 });
        },
        simButtonUp() {
          const m = simulationInteraction();
          if (!m) return;
          clearTimeout(simTimer);
          setSimulationState({ active: false, pressDepth: 0, phase: "Settle / 안착" });
          scheduleSimPhase("Rest / 정지", 520, { active: false, pressDepth: 0 });
        },
        simToggle() {
          const m = simulationInteraction();
          if (!m) return;
          const sim = simStateFor(m);
          clearTimeout(simTimer);
          setSimulationState({ toggleOn: !sim.toggleOn, phase: "Transition / 전환", ripple: Date.now() });
          scheduleSimPhase("Rest / 정지", 560, { toggleOn: !sim.toggleOn });
        },
        simRailDown(ev) {
          const rect = ev.currentTarget.getBoundingClientRect();
          const ratio = clamp((ev.clientX - rect.left) / rect.width, 0, 1);
          setSimulationState({ railValue: Math.round(ratio * 100), phase: "Resistance / 저항" });
          beginSimulationDrag("rail", { left: rect.left, width: rect.width });
          render();
        },
        simPanelToggle() {
          const m = simulationInteraction();
          if (!m) return;
          const sim = simStateFor(m);
          const next = sim.panelOpen > 0.5 ? 0.16 : 1;
          clearTimeout(simTimer);
          setSimulationState({ panelOpen: next, phase: "Transition / 전환", ripple: Date.now() });
          scheduleSimPhase("Rest / 정지", 620, { panelOpen: next });
        },
        simPanelHandleDown(ev) {
          ev.preventDefault();
          const m = simulationInteraction();
          if (!m) return;
          const sim = simStateFor(m);
          setSimulationState({ phase: "Resistance / 저항" });
          beginSimulationDrag("sheet", { startY: ev.clientY, startOpen: sim.panelOpen });
          render();
        },
        simCardDown(ev) {
          ev.preventDefault();
          clearTimeout(simTimer);
          setSimulationState({ phase: "Acknowledge / 입력 감지", ripple: Date.now() });
          beginSimulationDrag("card", { startX: ev.clientX, startY: ev.clientY });
          render();
        },
        simLensDown(ev) {
          ev.preventDefault();
          const rect = ev.currentTarget.getBoundingClientRect();
          setSimulationState({ phase: "Acknowledge / 입력 감지" });
          beginSimulationDrag("lens", { left: rect.left, top: rect.top, width: rect.width, height: rect.height });
          render();
        },
        simSurfaceDown(ev) {
          const rect = ev.currentTarget.getBoundingClientRect();
          const x = ((ev.clientX - rect.left) / rect.width) * 100;
          const y = ((ev.clientY - rect.top) / rect.height) * 100;
          clearTimeout(simTimer);
          setSimulationState({ pointX: clamp(x, 10, 90), pointY: clamp(y, 12, 88), ripple: Date.now(), phase: "Transition / 전환" });
          scheduleSimPhase("Rest / 정지", 760, { pointX: clamp(x, 10, 90), pointY: clamp(y, 12, 88) });
        }
      };
      window.Actions = Actions;
