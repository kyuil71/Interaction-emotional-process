            caption: "서로 다른 6개의 지각 축을 각기 다른 대상·스케일·장면으로 시각화해 하나의 통합 이미지로 묶었습니다.",
            empty: "지각 특성 이미지를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generatePerceptionImage()"
          })}

          <div class="flex items-center justify-between gap-2 mb-3 px-1">
            <span class="t-meta font-bold text-slate-600">${picked}개 선택됨</span>
            ${ghostBtn(allOn ? "전체 해제" : "전체 선택", "Actions.selectAllPerceptions()", allOn ? "square" : "check-square")}
          </div>

          <div class="space-y-3">${cards}</div>
          ${instructionBox("ins-perception", "Actions.regeneratePerceptions()", "예: 자연 이미지 반복을 줄이고 접촉 반응·공간 깊이·시간적 회복이 더 분명하도록 다시 구성해 주세요")}

          ${dock(primaryBtn(picked ? "물성 정의하기" : "지각 요소를 선택해 주세요", "Actions.generateProperties()", !picked))}
        </div>`;
      }

      /* ---- 4단계 : 물성 정의 ---- */
      /* LOW ─●─ HIGH : 값의 위치를 점으로 분명히 찍습니다. */
      function levelBar(value, on) {
        const pct = Math.max(2, Math.min(98, Number(value) || 55));
        const dot = on ? "bg-blue-700 ring-blue-700/20" : "bg-slate-900 ring-slate-900/15";
        return `<div class="flex items-center gap-2.5 pt-2 pb-1">
          <span class="t-meta text-slate-400 flex-shrink-0 tabular-nums">LOW</span>
          <div class="relative flex-1 h-5 flex items-center">
            <div class="h-[3px] w-full bg-slate-200 rounded-full"></div>
            <span class="absolute top-1/2 w-4 h-4 rounded-full ring-4 ${dot}" style="left:${pct}%;transform:translate(-50%,-50%)"></span>
          </div>
          <span class="t-meta text-slate-400 flex-shrink-0 tabular-nums">HIGH</span>
        </div>`;
      }

      function viewProperty() {
        const picked = state.propertyIds.length;
        const allOn = picked > 0 && picked === state.properties.length;
        const cards = state.properties.map((p, i) => optionCard({
          index: i + 1,
          selected: state.propertyIds.includes(p.id),
          title: p.titleKo,
          subtitle: p.titleEn,
          badge: p.axis,
          onclick: `Actions.toggleProperty('${escAttr(p.id)}')`,
          body: `
            <p class="t-small text-slate-700 prose-ko">${esc(p.description)}</p>
            ${p.interactionHint ? `<p class="t-meta text-blue-700 prose-ko"><strong>인터랙션 변환</strong> · ${esc(p.interactionHint)}</p>` : ""}
            ${p.check ? `<p class="t-meta text-slate-500 prose-ko">확인 방법 · ${esc(p.check)}</p>` : ""}
            ${levelBar(p.value, state.propertyIds.includes(p.id))}
            <p class="t-meta text-slate-500">목표 수준 · ${esc(p.level)} (${esc(p.value)})</p>`
        })).join("");

        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("인터랙션 물성", 3)}
          ${sectionTitle("어떤 동적 물성이 필요한가", "누르고·끌고·전환하고·놓는 과정에서 체감되는 감지, 저항, 변형, 관성, 복원, 감쇠, 광학·햅틱 반응으로 정의합니다. 필요한 물성을 여러 개 고를 수 있습니다.")}
          ${(function () {
            const c = selectedConcept();
            const ps = selectedPerceptions();
            return priorChoice([
              { label: "감성 키워드", value: state.keyword },
              { label: "선택한 감성 해석", value: c ? `${c.nameKo} (${c.nameEn})` : "" },
              { label: `선택한 지각 요소 ${ps.length}개`, value: joinTitles(ps, "titleKo") }
            ]);
          })()}

          ${imageCard("property", {
            title: "인터랙션 물성 통합 이미지",
            alt: "동적 인터랙션 물성별 대표 반응 이미지 통합 보드",
            caption: "압축·저항·관성·복원·감쇠·빛·햅틱 등 동적 반응을 한눈에 비교하는 보드입니다.",
            empty: "인터랙션 물성 이미지를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generatePropertyImage()"
          })}

          <div class="flex items-center justify-between gap-2 mb-3 px-1">
            <span class="t-meta font-bold text-slate-600">${picked}개 선택됨</span>
            ${ghostBtn(allOn ? "전체 해제" : "전체 선택", "Actions.selectAllProperties()", allOn ? "square" : "check-square")}
          </div>

          <div class="space-y-3">${cards}</div>
          ${instructionBox("ins-property", "Actions.regenerateProperties()", "예: 저항·복원·감쇠·관성의 차이가 더 분명하고 실제 UI 모션으로 변환하기 쉽게 다시 구성해 주세요")}

          ${dock(primaryBtn(picked ? "인터랙션 제안 받기" : "물성을 선택해 주세요", "Actions.generateInteractions()", !picked))}
        </div>`;
      }

      /* ---- 5단계 : 인터랙션 제안 ---- */
      /* 각 인터랙션의 Motion Grammar · Timing · Haptic · 연결 물성을 한 카드에 보여 줍니다. */
      function motionGrammarGuide() {
        const steps = [
          ["01", "Rest", "정지", "기본 상태와 긴장도"],
          ["02", "Acknowledge", "입력 감지", "접촉 즉시 첫 반응"],
          ["03", "Resistance", "저항", "힘·드래그·변형 축적"],
          ["04", "Transition", "전환", "임계점 통과와 주 움직임"],
          ["05", "Settle", "안착", "감쇠·복원·여운"]
        ];
        return `<section class="bg-slate-900 text-white rounded-[2rem] p-5 mb-5 shadow-lg">
          <div class="flex items-center justify-between mb-4">
            <div><p class="t-meta font-bold text-sky-300">MOTION GRAMMAR</p><h3 class="t-h3">움직임 문법 5단계</h3></div>
            <span class="t-meta text-slate-300">공통 프레임</span>
          </div>
          <div class="space-y-2">${steps.map(x => `<div class="grid grid-cols-[34px_1fr] gap-3 items-start bg-white/5 border border-white/10 rounded-xl px-3 py-2.5">
            <span class="t-meta font-bold text-sky-300">${x[0]}</span><div><p class="t-small font-bold">${x[1]} / ${x[2]}</p><p class="t-meta text-slate-300">${x[3]}</p></div>
          </div>`).join("")}</div>
        </section>`;
      }

      function motionSpecBlock(m) {
        const rows = [
          ["Rest / 정지", m.rest],
          ["Acknowledge / 입력 감지", m.acknowledge],
          ["Resistance / 저항", m.resistance],
          ["Transition / 전환", m.transition],
          ["Settle / 안착", m.settle]
        ];
        return `<section class="mt-4 rounded-2xl border border-slate-200 bg-slate-50 overflow-hidden">
          ${rows.map((r, j) => `<div class="grid grid-cols-[34px_1fr] gap-2 px-3.5 py-3 ${j ? "border-t border-slate-200" : ""}">
            <span class="t-meta font-bold text-blue-700">${pad2(j + 1)}</span>
            <div><p class="t-meta font-bold text-slate-800">${esc(r[0])}</p><p class="t-small text-slate-700 prose-ko">${esc(r[1])}</p></div>
          </div>`).join("")}
        </section>`;
      }

      function interactionCard(m, i) {
        const row = (label, value) => value ? `<div class="pt-3">
          <p class="t-meta font-bold text-slate-500 mb-0.5">${esc(label)}</p>
          <p class="t-small text-slate-700 prose-ko">${esc(value)}</p>
        </div>` : "";
        const states = (m.states || []).slice(0, 3);
        return `<article class="w-full p-5 rounded-[2rem] border-2 border-slate-200 bg-white shadow-md">
          <div class="flex items-start gap-3 mb-2">
            <span class="w-9 h-9 rounded-full bg-blue-700 text-white flex items-center justify-center flex-shrink-0 font-bold t-meta tabular-nums">${pad2(i + 1)}</span>
            <div class="min-w-0 flex-1">
              <h3 class="t-h3 text-slate-900 leading-snug">${esc(m.nameKo)}</h3>
              <p class="t-meta text-slate-500">${esc(m.nameEn)}</p>
            </div>
            <span class="t-meta font-bold px-2.5 py-1 rounded-lg flex-shrink-0 bg-sky-100 text-sky-800">${esc(m.type)}</span>
          </div>
          ${row("UX 역할", m.role)}
          ${m.interactionDNA ? `<div class="mt-3 bg-blue-50 border border-blue-100 rounded-2xl px-4 py-3"><p class="t-meta font-bold text-blue-700">Interaction DNA</p><p class="t-small font-bold text-slate-900 prose-ko">${esc(m.interactionDNA)}</p></div>` : ""}
          ${motionSpecBlock(m)}
          <div class="grid grid-cols-3 gap-2 mt-4">${states.map((st, j) => `<div class="rounded-xl border border-slate-200 bg-white p-2.5 min-h-[92px]">
            <p class="t-meta font-bold text-blue-700">${pad2(j + 1)} ${esc(st.labelKo)}</p>
            <p class="t-meta text-slate-500">${esc(st.labelEn)}</p>
            <p class="t-meta text-slate-700 mt-1 prose-ko">${esc(st.description)}</p>
          </div>`).join("")}</div>
          ${row("Timing / Motion", m.timing)}
          ${row("Haptic", m.haptic)}
          ${row("Visual Behavior", m.visualBehavior)}
          ${m.propertyMapping && m.propertyMapping.length ? `<div class="pt-3"><p class="t-meta font-bold text-slate-500 mb-1">연결 물성</p><div class="flex flex-wrap gap-1.5">${m.propertyMapping.map(x => chip(x)).join("")}</div></div>` : ""}
          ${row("감성 효과", m.emotionalEffect)}
          <div class="pt-4">
            <button type="button" onclick="Actions.openSimulation('${escAttr(m.id)}')"
              class="w-full py-3.5 rounded-2xl font-bold t-small text-slate-800 bg-slate-100 border border-slate-200 hover:bg-slate-50 active:scale-[0.98] transition-all inline-flex items-center justify-center gap-2">
              <i data-lucide="smartphone" class="w-5 h-5"></i>이 인터랙션 시뮬레이션
            </button>
          </div>
        </article>`;
      }

      function viewInteraction() {
        const cards = state.interactions.map((m, i) => interactionCard(m, i)).join("");
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("인터랙션 제안", 4)}
          ${sectionTitle("물성을 어떻게 움직임으로 표현할 것인가", "선택한 동적 물성을 가장 잘 표현할 수 있는 5개 인터랙션 컨셉으로 번역해, 각 제안의 핵심 상태 변화와 물성 기반 경험이 분명히 보이도록 정리합니다.")}
          ${(function () {
            const c = selectedConcept();
            const ps = selectedPerceptions();
            const qs = selectedProperties();
            return priorChoice([
              { label: "선택한 감성 해석", value: c ? `${c.nameKo} (${c.nameEn})` : "" },
              { label: `선택한 지각 요소 ${ps.length}개`, value: joinTitles(ps, "titleKo") },
              { label: `선택한 인터랙션 물성 ${qs.length}개`, value: qs.map((q, i) => `${pad2(i + 1)} ${q.titleKo} ${q.value}`).join("   ") }
            ]);
          })()}

          ${motionGrammarGuide()}

          ${imageCard("interaction", {
            title: "인터랙션 컨셉 보드",
            alt: "AI가 선택한 다양한 인터랙션 컨셉의 3상태 보드",
            caption: "선택된 감성과 인터랙션 물성을 가장 잘 표현하는 5개 인터랙션 컨셉을 각 3개 대표 상태로 비교합니다.",
            empty: "인터랙션 컨셉 보드를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generateInteractionImage()"
          })}

          <div class="space-y-3">${cards}</div>
          ${instructionBox("ins-interaction", "Actions.regenerateInteractions()", "예: 리퀴드 글라스처럼 물성 기반의 새 인터랙션이 더 드러나게 하고, 감성 키워드의 색감과 긴장감이 끝까지 유지되도록 다시 제안해 주세요")}

          ${dock(`
            <div class="space-y-2.5">
              ${primaryBtn("가상 스마트폰에서 시뮬레이션", "Actions.openSimulation()")}
              ${secondaryBtn("전체 리포트 PDF로 저장", "Actions.exportPdf()")}
              ${secondaryBtn("리포트 텍스트 복사", "Actions.copyReport()", "copy")}
            </div>
          `)}
        </div>`;
      }

      function simulationGuide(profile) {
        switch (profile) {
          case "button": return "가운데 요소를 눌렀다가 떼어 보세요. 감지–저항–복원의 리듬을 손끝으로 확인할 수 있습니다.";
          case "toggle": return "토글을 눌러 상태를 전환해 보세요. 전환 속도와 안착 방식이 감성에 맞게 반응합니다.";
          case "rail": return "노브를 좌우로 드래그해 보세요. 저항, 관성, 안착 위치의 느낌을 직접 비교할 수 있습니다.";
          case "panel": return "열기 버튼이나 상단 핸들을 사용해 시트를 열고 닫아 보세요. 깊이와 반투명한 층의 움직임을 체감합니다.";
          case "lens": return "렌즈 영역을 끌어 보세요. 확대, 굴절, 반투명의 상호작용이 물성처럼 반응합니다.";
          case "surface": return "표면을 눌러 파동과 침잠 반응을 확인해 보세요. 접촉 위치에 따라 잔향이 달라집니다.";
          default: return "카드를 눌러 들어 올리고 가볍게 끌어 보세요. 긴장, 관성, 복원이 한 흐름으로 이어집니다.";
        }
      }

      function simulationPhaseTone(phase) {
        if ((phase || "").includes("Resistance")) return "bg-amber-50 text-amber-800 border-amber-200";
        if ((phase || "").includes("Transition")) return "bg-blue-50 text-blue-800 border-blue-200";
        if ((phase || "").includes("Settle")) return "bg-emerald-50 text-emerald-800 border-emerald-200";
        return "bg-slate-100 text-slate-700 border-slate-200";
      }

      function simStyle(theme) {
        return `--sim-bg1:${theme.bg1};--sim-bg2:${theme.bg2};--sim-accent:${theme.accent};--sim-accent-soft:${theme.accentSoft};--sim-ink:${theme.ink};--sim-muted:${theme.muted};--sim-surface:${theme.surface};--sim-surface-strong:${theme.surfaceStrong};--sim-border:${theme.border};--sim-glow:${theme.glow};--sim-shadow:${theme.screenShadow};`;
      }

      function renderSimulationDemo(m, sim, theme) {
        const phasePill = `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full border ${simulationPhaseTone(sim.phase)}"><i data-lucide="activity" class="w-4 h-4"></i>${esc(sim.phase)}</span>`;
        const metaTop = `<div class="absolute left-4 right-4 top-12 z-10 flex items-center justify-between gap-2"><div class="px-3 py-1.5 rounded-full border sim-glass" style="background:var(--sim-surface);border-color:var(--sim-border);color:var(--sim-ink);box-shadow:0 14px 28px var(--sim-shadow);"><span class="text-[14px] font-bold">${esc(m.nameKo)}</span></div>${phasePill}</div>`;
        const baseScreen = `style="${escAttr(simStyle(theme))} background:linear-gradient(180deg,var(--sim-bg1) 0%, var(--sim-bg2) 100%);"`;
        const header = `<div class="sim-phone"><div class="sim-phone-screen" ${baseScreen}><div class="sim-notch"></div>${metaTop}<div class="absolute inset-x-4 top-24 z-[1] rounded-[28px] px-4 py-3 sim-glass" style="background:var(--sim-surface);border:1px solid var(--sim-border);box-shadow:0 16px 36px var(--sim-shadow);"><div class="flex items-start justify-between gap-2"><div><p class="text-[14px] font-bold" style="color:var(--sim-muted)">Material-driven Prototype</p><p class="text-[18px] font-bold mt-0.5" style="color:var(--sim-ink)">${esc(m.type)}</p></div><span class="px-2.5 py-1 rounded-full text-[13px] font-bold" style="background:rgba(255,255,255,.55);color:var(--sim-ink);border:1px solid var(--sim-border);">${esc((m.propertyMapping || []).slice(0,2).join(' · ') || 'Interaction')}</span></div><p class="text-[14px] mt-2 leading-[1.5]" style="color:var(--sim-muted)">${esc(m.visualBehavior || m.interactionDNA || m.role)}</p></div>`;

        const footer = `</div></div>`;

        if (sim.ripple) {
          var ripple = `<span class="sim-ripple" style="left:${sim.pointX}%;top:${sim.pointY}%;border-color:${theme.accent};"></span>`;
        } else {
          var ripple = "";
        }

        if (sim.archetype === "button") {
          const y = sim.active ? 16 : 0;
          const scale = sim.active ? (theme.sharp ? 0.96 : 0.93) : 1;
          const radius = Math.round(22 + theme.softness * 18);
          return `${header}
            <div class="absolute inset-x-0 bottom-0 top-[220px] px-6 pb-7 flex flex-col justify-between">
              <div class="rounded-[30px] p-4 sim-glass" style="background:var(--sim-surface);border:1px solid var(--sim-border);box-shadow:0 18px 40px var(--sim-shadow);">
                <p class="text-[14px] font-bold" style="color:var(--sim-muted)">Touch Area</p>
                <p class="text-[15px] mt-1" style="color:var(--sim-ink)">${esc(m.role)}</p>
              </div>
              <div class="relative h-[230px] flex items-center justify-center">
                ${ripple}
                <button type="button" class="sim-pressable sim-sheen relative w-[220px] h-[76px] font-bold text-[20px]" style="border-radius:${radius}px;background:${theme.liquid ? 'linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.46))' : 'linear-gradient(180deg, var(--sim-surface-strong), rgba(255,255,255,.7))'};border:1px solid var(--sim-border);color:var(--sim-ink);box-shadow:0 ${24 - y}px ${48 - y}px var(--sim-shadow), inset 0 1px 0 rgba(255,255,255,.7);transform:translateY(${y}px) scale(${scale});transition:transform ${theme.sharp ? 180 : 260}ms ${theme.sharp ? 'cubic-bezier(.22,.8,.2,1)' : 'cubic-bezier(.18,.9,.24,1)'};" onpointerdown="Actions.simButtonDown()" onpointerup="Actions.simButtonUp()" onpointercancel="Actions.simButtonUp()" onpointerleave="Actions.simButtonUp()">${esc(m.nameKo)}</button>
              </div>
              <div class="rounded-[24px] p-4" style="background:rgba(255,255,255,.52);border:1px solid var(--sim-border);"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">현재 체감</p><p class="text-[15px] mt-1" style="color:var(--sim-ink)">${esc(m.emotionalEffect || m.rest)}</p></div>
            </div>${footer}`;
        }

        if (sim.archetype === "toggle") {
          const on = sim.toggleOn;
          const knobX = on ? 92 : 6;
          return `${header}
            <div class="absolute inset-x-0 bottom-0 top-[220px] px-6 pb-8 flex flex-col justify-between">
              <div class="rounded-[30px] p-4 sim-glass" style="background:var(--sim-surface);border:1px solid var(--sim-border);"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">State Switching</p><p class="text-[15px] mt-1" style="color:var(--sim-ink)">${esc(m.role)}</p></div>
              <div class="h-[240px] flex items-center justify-center relative">${ripple}<button type="button" onclick="Actions.simToggle()" class="relative w-[160px] h-[72px] rounded-full sim-glass" style="background:${on ? `linear-gradient(90deg, ${theme.accentSoft}, ${theme.accent})` : 'rgba(255,255,255,.55)'};border:1px solid var(--sim-border);box-shadow:0 22px 44px var(--sim-shadow);transition:background 260ms ease, box-shadow 260ms ease;"><span class="absolute top-[5px] w-[60px] h-[60px] rounded-full bg-white sim-sheen" style="left:${knobX}px;box-shadow:0 14px 24px rgba(15,23,42,.18);transition:left 280ms cubic-bezier(.2,.9,.22,1), transform 220ms ease;transform:${on ? 'scale(1.02)' : 'scale(.98)'};"></span><span class="absolute left-6 top-1/2 -translate-y-1/2 text-[15px] font-bold" style="color:${on ? 'rgba(255,255,255,.92)' : 'var(--sim-muted)'}">${on ? 'ON' : 'OFF'}</span></button></div>
              <div class="rounded-[24px] p-4" style="background:rgba(255,255,255,.52);border:1px solid var(--sim-border);"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">전환 메모</p><p class="text-[15px] mt-1" style="color:var(--sim-ink)">${esc(m.transition || m.settle)}</p></div>
            </div>${footer}`;
        }

        if (sim.archetype === "rail") {
          const pos = clamp(sim.railValue, 0, 100);
          return `${header}
            <div class="absolute inset-x-0 bottom-0 top-[220px] px-6 pb-8 flex flex-col justify-between">
              <div class="rounded-[30px] p-4 sim-glass" style="background:var(--sim-surface);border:1px solid var(--sim-border);"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">Drag Interaction</p><p class="text-[15px] mt-1" style="color:var(--sim-ink)">${esc(m.role)}</p></div>
              <div class="relative h-[240px] flex flex-col justify-center">
                ${ripple}

                  <div class="absolute left-0 top-0 h-full rounded-full" style="width:${pos}%;background:linear-gradient(90deg, var(--sim-accent-soft), var(--sim-accent));"></div>
                  <button type="button" class="absolute top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white sim-sheen" style="left:calc(${pos}% - 20px);border:1px solid var(--sim-border);box-shadow:0 14px 24px rgba(15,23,42,.16);"></button>

              <div class="rounded-[24px] p-4" style="background:rgba(255,255,255,.52);border:1px solid var(--sim-border);"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">저항과 안착</p><p class="text-[15px] mt-1" style="color:var(--sim-ink)">${esc(m.resistance || m.settle)}</p></div>
            </div>${footer}`;
        }

        if (sim.archetype === "panel") {
          const openPct = clamp(sim.panelOpen, 0.08, 1);
          const translate = Math.round((1 - openPct) * 230);
          const blur = Math.round(8 + openPct * 14);
          return `${header}
            <div class="absolute inset-x-0 bottom-0 top-[220px] px-5 pb-5">
              <div class="absolute inset-x-5 top-0 h-[210px] rounded-[28px] p-5" style="background:rgba(255,255,255,.26);border:1px solid var(--sim-border);filter:blur(${Math.max(0, 10 - blur/2)}px);opacity:${0.65 - openPct * 0.15};"><div class="w-[65%] h-5 rounded-full" style="background:rgba(255,255,255,.4)"></div><div class="grid grid-cols-2 gap-3 mt-5"><div class="h-24 rounded-[22px]" style="background:rgba(255,255,255,.35)"></div><div class="h-24 rounded-[22px]" style="background:rgba(255,255,255,.25)"></div></div></div>
              <button type="button" onclick="Actions.simPanelToggle()" class="absolute left-1/2 -translate-x-1/2 top-6 px-5 py-3 rounded-full sim-glass" style="background:var(--sim-surface);border:1px solid var(--sim-border);box-shadow:0 16px 30px var(--sim-shadow);color:var(--sim-ink);font-weight:700;">${openPct > 0.5 ? '닫기' : '열기'}</button>
              <div class="absolute inset-x-0 bottom-0 rounded-t-[34px] pt-3 px-5 pb-6 sim-glass" style="transform:translateY(${translate}px);transition:transform ${theme.sharp ? 220 : 320}ms cubic-bezier(.2,.9,.24,1);background:${theme.liquid ? 'linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,.48))' : 'linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.72))'};border-top:1px solid var(--sim-border);backdrop-filter:blur(${blur}px);-webkit-backdrop-filter:blur(${blur}px);box-shadow:0 -24px 40px rgba(15,23,42,.12);">
                <button type="button" onpointerdown="Actions.simPanelHandleDown(event)" class="block mx-auto mb-4 w-16 h-1.5 rounded-full" style="background:rgba(100,116,139,.45)"></button>
                <div class="rounded-[24px] p-4" style="background:rgba(255,255,255,.42);border:1px solid var(--sim-border);"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">Floating Layer</p><p class="text-[18px] font-bold mt-1" style="color:var(--sim-ink)">${esc(m.nameKo)}</p><p class="text-[15px] mt-2 leading-[1.55]" style="color:var(--sim-muted)">${esc(m.transition || m.visualBehavior)}</p></div>
              </div>
            </div>${footer}`;
        }

        if (sim.archetype === "lens") {
          const lensSize = 132 + (theme.softness * 24);
          return `${header}
            <div class="absolute inset-x-0 bottom-0 top-[220px] px-6 pb-8 flex flex-col justify-between">
              <div class="rounded-[30px] p-4 sim-glass" style="background:var(--sim-surface);border:1px solid var(--sim-border);"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">Lens Interaction</p><p class="text-[15px] mt-1" style="color:var(--sim-ink)">${esc(m.role)}</p></div>
              <div class="relative h-[265px] overflow-hidden rounded-[30px] sim-glass" style="background:rgba(255,255,255,.32);border:1px solid var(--sim-border);" onpointerdown="Actions.simLensDown(event)">
                ${ripple}
                <div class="absolute inset-0 p-5 text-[20px] font-bold leading-[1.5] tracking-[-0.02em]" style="color:rgba(15,23,42,.16);">MATERIAL FEEL
INTERACTION
MOTION
DEPTH
TACTILE SIGNAL</div>
                <div class="absolute rounded-full sim-glass sim-sheen" style="left:calc(${sim.lensX}% - ${lensSize/2}px);top:calc(${sim.lensY}% - ${lensSize/2}px);width:${lensSize}px;height:${lensSize}px;background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.26));border:1px solid rgba(255,255,255,.6);box-shadow:0 18px 34px rgba(15,23,42,.16);backdrop-filter:blur(${theme.sharp ? 8 : 14}px) saturate(125%);-webkit-backdrop-filter:blur(${theme.sharp ? 8 : 14}px) saturate(125%);display:flex;align-items:center;justify-content:center;color:var(--sim-ink);font-size:18px;font-weight:800;">ZOOM</div>
              </div>
              <div class="rounded-[24px] p-4" style="background:rgba(255,255,255,.52);border:1px solid var(--sim-border);"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">광학 반응</p><p class="text-[15px] mt-1" style="color:var(--sim-ink)">${esc(m.visualBehavior || m.transition)}</p></div>
            </div>${footer}`;
        }

        if (sim.archetype === "surface") {
          const px = sim.pointX;
          const py = sim.pointY;
          return `${header}
            <div class="absolute inset-x-0 bottom-0 top-[220px] px-6 pb-8 flex flex-col justify-between">
              <div class="rounded-[30px] p-4 sim-glass" style="background:var(--sim-surface);border:1px solid var(--sim-border);"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">Reactive Surface</p><p class="text-[15px] mt-1" style="color:var(--sim-ink)">${esc(m.role)}</p></div>
              <button type="button" class="relative h-[260px] rounded-[34px] overflow-hidden sim-glass" style="background:linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,.18));border:1px solid var(--sim-border);box-shadow:0 20px 36px var(--sim-shadow);" onpointerdown="Actions.simSurfaceDown(event)">
                <div class="absolute inset-0" style="background:radial-gradient(circle at ${px}% ${py}%, ${theme.accentSoft} 0%, rgba(255,255,255,.12) 20%, transparent 48%);"></div>
                <div class="absolute inset-x-5 top-5 text-left"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">Touch anywhere</p><p class="text-[18px] font-bold mt-1" style="color:var(--sim-ink)">${esc(m.nameKo)}</p></div>
                ${ripple}
              </button>
              <div class="rounded-[24px] p-4" style="background:rgba(255,255,255,.52);border:1px solid var(--sim-border);"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">여운</p><p class="text-[15px] mt-1" style="color:var(--sim-ink)">${esc(m.settle || m.emotionalEffect)}</p></div>
            </div>${footer}`;
        }

        const y = sim.cardY;
        const x = sim.cardX;
        const lift = sim.cardLift;
        const rotate = (x / 18).toFixed(1);
        return `${header}
          <div class="absolute inset-x-0 bottom-0 top-[220px] px-6 pb-8 flex flex-col justify-between">
            <div class="rounded-[30px] p-4 sim-glass" style="background:var(--sim-surface);border:1px solid var(--sim-border);"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">Lifted Card</p><p class="text-[15px] mt-1" style="color:var(--sim-ink)">${esc(m.role)}</p></div>
            <div class="relative h-[250px] flex items-center justify-center">${ripple}<button type="button" class="relative w-[250px] rounded-[30px] p-5 text-left sim-glass sim-sheen" style="background:${theme.liquid ? 'linear-gradient(180deg, rgba(255,255,255,.68), rgba(255,255,255,.38))' : 'linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.72))'};border:1px solid var(--sim-border);box-shadow:0 ${20 + Math.round(lift*10)}px ${36 + Math.round(lift*10)}px rgba(15,23,42,.16);transform:translate(${x}px, ${y}px) rotate(${rotate}deg) scale(${1 + lift*0.03});transition:transform 260ms cubic-bezier(.2,.9,.24,1), box-shadow 260ms ease;" onpointerdown="Actions.simCardDown(event)"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">Card Motion</p><p class="text-[20px] font-bold mt-1" style="color:var(--sim-ink)">${esc(m.nameKo)}</p><p class="text-[15px] mt-3 leading-[1.55]" style="color:var(--sim-muted)">${esc(m.visualBehavior || m.transition)}</p></button></div>
            <div class="rounded-[24px] p-4" style="background:rgba(255,255,255,.52);border:1px solid var(--sim-border);"><p class="text-[14px] font-bold" style="color:var(--sim-muted)">움직임 메모</p><p class="text-[15px] mt-1" style="color:var(--sim-ink)">${esc(m.settle || m.emotionalEffect)}</p></div>
          </div>${footer}`;
      }

      function viewSimulation() {
        const m = simulationInteraction();
        if (!m) return fallback(5, "시뮬레이션할 인터랙션이 없습니다.");
        const sim = simStateFor(m);
        const theme = deriveEmotionTheme();
        const profile = sim.archetype || simulationArchetype(m);
        const c = selectedConcept();
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("인터랙션 시뮬레이션", 5)}
          ${sectionTitle("가상 스마트폰에서 직접 체험하기", "최종 제안된 인터랙션 컨셉을 선택하면 가상 스마트폰 화면에서 직접 눌러 보고, 끌어 보고, 열어 보며 물성 기반의 움직임을 확인할 수 있습니다.")}
          ${priorChoice([
            { label: "감성 키워드", value: state.keyword },
            { label: "선택한 감성 해석", value: c ? `${c.nameKo} (${c.nameEn})` : "" },
            { label: "현재 시뮬레이션", value: `${m.nameKo} (${m.type})` }
          ])}

          <section class="bg-white rounded-[2rem] p-4 border-2 border-slate-200 shadow-md mb-5">
            <div class="flex items-center justify-between gap-2 mb-3 px-1">
              <h3 class="t-label text-slate-500">시뮬레이션할 인터랙션 선택</h3>
              ${ghostBtn("초기화", "Actions.resetSimulation()", "rotate-ccw")}
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">${state.interactions.map((x, i) => `<button type="button" onclick="Actions.selectSimulationInteraction('${escAttr(x.id)}')" class="min-w-[152px] p-3 rounded-2xl border text-left transition-all ${x.id === m.id ? 'bg-slate-900 text-white border-slate-900 shadow-lg' : 'bg-white text-slate-800 border-slate-200'}"><p class="t-meta font-bold">${pad2(i + 1)} ${esc(x.nameKo)}</p><p class="t-meta ${x.id === m.id ? 'text-slate-300' : 'text-slate-500'}">${esc(x.type)}</p></button>`).join('')}</div>
          </section>

          <section class="bg-white rounded-[2rem] p-5 border-2 border-slate-200 shadow-md mb-5">
            <div class="flex items-start justify-between gap-3 mb-3">
              <div>
                <p class="t-meta font-bold text-slate-500">Simulation Brief</p>
                <h3 class="t-h2 text-slate-900">${esc(m.nameKo)}</h3>
                <p class="t-meta text-slate-500">${esc(m.nameEn)} · ${esc(m.type)}</p>
              </div>
              <span class="t-meta font-bold px-3 py-1.5 rounded-full bg-blue-50 text-blue-800 border border-blue-200">${esc(profile)}</span>
            </div>
            <p class="t-small text-slate-700 prose-ko">${esc(simulationGuide(profile))}</p>
            <div class="grid grid-cols-1 gap-2 mt-4">
              <div class="rounded-2xl bg-slate-50 border border-slate-200 px-4 py-3"><p class="t-meta font-bold text-slate-500">Interaction DNA</p><p class="t-small text-slate-800 prose-ko">${esc(m.interactionDNA || m.visualBehavior)}</p></div>
              <div class="rounded-2xl bg-slate-50 border border-slate-200 px-4 py-3"><p class="t-meta font-bold text-slate-500">연결 물성</p><div class="flex flex-wrap gap-1.5 mt-2">${(m.propertyMapping || []).map(x => chip(x, 'blue')).join('') || chip('선택된 물성 없음')}</div></div>
              <div class="rounded-2xl bg-slate-50 border border-slate-200 px-4 py-3"><p class="t-meta font-bold text-slate-500">감성 유지 포인트</p><p class="t-small text-slate-800 prose-ko">${esc(m.emotionalEffect || m.visualBehavior || m.settle)}</p></div>
            </div>
          </section>

          <section class="bg-white rounded-[2rem] p-4 border-2 border-slate-200 shadow-md mb-6">
            <div class="flex items-center justify-between gap-2 mb-3 px-1">
              <h3 class="t-label text-slate-500">가상 스마트폰 시뮬레이터</h3>
              <span class="t-meta text-slate-500">직접 터치해 보세요</span>
            </div>
            ${renderSimulationDemo(m, sim, theme)}
          </section>

          ${dock(`
            <div class="space-y-2.5">
              ${primaryBtn("다른 인터랙션 시뮬레이션 선택", "setState({step:5}, true)")}
              ${secondaryBtn("시뮬레이션 초기화", "Actions.resetSimulation()", "rotate-ccw")}
              ${secondaryBtn("전체 리포트 PDF로 저장", "Actions.exportPdf()")}
            </div>
          `)}
        </div>`;
      }

      /* =========================================================
         16. 오버레이 — 로딩 / 오류 / 이미지 확대
         ========================================================= */
      function overlays() {
        let html = "";

        if (state.isAnalyzing) {
          html += `<div class="fixed inset-0 z-[10000] bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center px-8 text-center max-w-[430px] mx-auto animate-fade-in" role="status" aria-live="polite">
            <div class="spinner-ring mb-8" role="presentation"></div>
            <h2 class="t-h2 text-slate-900 mb-2">${esc(state.loadingMsg)}</h2>
            <p class="t-small text-slate-600 mb-8">1분 넘게 걸릴 수 있습니다</p>
            <button type="button" onclick="Actions.cancel()" class="px-7 py-3.5 rounded-2xl border-2 border-slate-300 text-slate-700 font-bold t-small hover:bg-slate-50 active:scale-95 transition-all">취소</button>
          </div>`;
        }

        if (state.lightbox && state.images && state.images[state.lightbox]) {
          html += `<div class="fixed inset-0 z-[10001] bg-black/90 flex flex-col max-w-[430px] mx-auto" role="dialog" aria-modal="true" aria-label="이미지 크게 보기">
            <div class="flex justify-end p-3">
              <button type="button" onclick="Actions.closeLightbox()" aria-label="닫기" class="p-3 rounded-full bg-white/10 text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="flex-1 overflow-auto px-3 pb-6 no-scrollbar">
              <img src="${escAttr(state.images[state.lightbox])}" alt="확대한 통합 이미지" class="w-full rounded-2xl" />
            </div>
          </div>`;
        }

        if (state.errorMsg) {
          html += `<div class="fixed inset-0 z-[10002] flex items-center justify-center bg-black/50 px-6 backdrop-blur-sm" role="alertdialog" aria-modal="true" aria-labelledby="err-title">
            <div class="bg-white p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl animate-scale-in">
              <i data-lucide="alert-triangle" class="text-red-600 mx-auto mb-4 w-12 h-12"></i>
              <h2 id="err-title" class="t-h3 text-slate-900 mb-6 prose-ko">${esc(state.errorMsg)}</h2>
              <button type="button" onclick="setState({errorMsg:null})" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold t-small">확인</button>
            </div>
          </div>`;
        }
        return html;
      }

      /* =========================================================
         17. 메인 렌더 — 예외가 나도 화면이 멈추지 않도록 방어
         ========================================================= */
      function captureUI() {
        const el = document.activeElement;
        const f = (el && el.id && (el.tagName === "INPUT" || el.tagName === "TEXTAREA"))
          ? { id: el.id, start: el.selectionStart, end: el.selectionEnd } : null;
        return { focus: f, scrollY: window.scrollY };
      }
      function restoreUI(snap, resetScroll) {
        if (snap.focus) {
          const el = document.getElementById(snap.focus.id);
          if (el) {
            el.focus({ preventScroll: true });
            try { el.setSelectionRange(snap.focus.start, snap.focus.end); } catch (e) { /* range 미지원 */ }
          }
        }
        window.scrollTo(0, resetScroll ? 0 : snap.scrollY);
      }

      function fallback(backStep, msg) {
        return `<div class="page-top px-6 min-h-screen">
          <div class="bg-white border-2 border-slate-300 rounded-3xl p-8 text-center shadow-md">
            <i data-lucide="compass" class="w-12 h-12 text-slate-500 mx-auto mb-4"></i>
            <h2 class="t-h3 text-slate-900 mb-2">${esc(msg)}</h2>
            <p class="t-small text-slate-600 mb-6">이전 단계로 돌아가 다시 실행해 주세요.</p>
            ${primaryBtn("이전 단계로", `setState({step:${backStep}}, true)`)}
          </div>
        </div>`;
      }

      function body() {
        switch (state.step) {
          case -1: return viewAuth();
          case 0:  return viewHome();
          case 1:  return viewKeyword();
          case 2:  return state.concepts.length ? viewEmotion() : fallback(1, "생성된 감성 해석이 없습니다.");
          case 3:  return state.perceptions.length ? viewPerception() : fallback(2, "분석된 지각 특성이 없습니다.");
          case 4:  return state.properties.length ? viewProperty() : fallback(3, "정의된 물성이 없습니다.");
          case 5:  return state.interactions.length ? viewInteraction() : fallback(4, "제안된 인터랙션이 없습니다.");
          case 6:  return state.interactions.length ? viewSimulation() : fallback(5, "시뮬레이션할 인터랙션이 없습니다.");
          default: return fallback(0, "요청한 화면을 찾을 수 없습니다.");
        }
      }

      function render(resetScroll) {
        const root = document.getElementById("root");
        const snap = captureUI();
        const shell = "w-full max-w-[430px] mx-auto bg-slate-100 min-h-screen relative overflow-x-hidden shadow-2xl";
        let inner;
        try {
          inner = body();
        } catch (err) {
          console.error("render 실패:", err);
          inner = fallback(0, "화면을 그리는 중 문제가 발생했습니다.");
        }
        try {
          root.innerHTML = `<div class="${shell}">${inner}${overlays()}</div>`;
          if (window.lucide && typeof lucide.createIcons === "function") lucide.createIcons();
        } catch (err) {
          console.error("DOM 갱신 실패:", err);
          root.innerHTML = `<div class="${shell}"><div class="p-8 t-body">화면을 표시할 수 없습니다. 새로고침해 주세요.</div></div>`;
        }
        restoreUI(snap, resetScroll);
      }

      /* =========================================================
         18. 부팅
         ========================================================= */
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (state.errorMsg) setState({ errorMsg: null });
        else if (state.lightbox) Actions.closeLightbox();
        else if (state.isAnalyzing) Actions.cancel();
      });

      setInterval(() => { try { persist(false); } catch (e) { console.warn("자동 저장 실패", e); } }, CONFIG.AUTOSAVE_MS);
      window.addEventListener("beforeunload", () => { try { persist(false); } catch (e) { /* 무시 */ } });

      loadSession();
      if (state.apiKey) state.step = 0;
      render(true);
    })();
  </script>
</body>
</html>
