  <style>
    /* ==========================================================
       타이포 시스템 — 모든 텍스트 16px 이상을 강제합니다.
       body 접두사로 특이도를 한 단계 올려 유틸리티 충돌을 막습니다.
       ========================================================== */
    html { -webkit-text-size-adjust: 100%; }

    body .t-title-fit {
      font-size: min(30px, calc((min(100vw, 430px) - 56px) / 12.6));

    }

    .no-scrollbar::-webkit-scrollbar { display: none; }

    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @keyframes scale-in { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .animate-scale-in { animation: scale-in 0.18s ease-out forwards; }

    /* 회전형 로딩 — '동작 줄이기' 설정에서도 반드시 회전합니다. */
    @keyframes spinner-rotate { to { transform: rotate(360deg); } }
    .spinner-ring {
      width: 84px; height: 84px; border-radius: 50%;
      background: conic-gradient(#1d4ed8 0 126deg, #e2e8f0 126deg 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
      animation: spinner-rotate 0.9s linear infinite;
      will-change: transform;
    }
    .spinner-mini {
      width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.35); border-top-color: #fff;
      animation: spinner-rotate 0.9s linear infinite;
      display: inline-block; vertical-align: -4px;
    }

    :focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; border-radius: 8px; }

    .dock { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
    .dock-space { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }
    .page-top { padding-top: 128px; }

    @media (prefers-reduced-motion: reduce) {
      *:not(.spinner-ring):not(.spinner-mini), *::before, *::after {
        animation-duration: .001ms !important; transition-duration: .001ms !important;

      .spinner-ring, .spinner-mini { animation-duration: 1.4s !important; }

    body ::placeholder { font-size: inherit; }
    body summary { font-size: inherit; }

    .sr-only {

<body>

  <script>
    (function () {
      "use strict";

      /* =========================================================
         1. CONFIG / 상수
         ========================================================= */
      const CONFIG = {
        API_BASE: "https://api.openai.com/v1",
        SESSION_KEY_API: "interaction_lab_openai_key_v1",
        PROJECTS_KEY: "interaction_lab_projects_v1",

        MAX_PROJECTS: 5,

      };

      /* 모델은 사용자 선택 없이 아래 두 모델로 고정합니다. */
      const FIXED_TEXT_MODEL = "gpt-5.6-terra";
      const FIXED_IMAGE_MODEL = "gpt-image-2.5-flare";
      /* 이미지 옵션도 고정합니다 — 품질: 표준(medium), 이미지 안 라벨: 한글 + 영문(ko) */
      const FIXED_IMAGE_QUALITY = "medium";
      const FIXED_LABEL_LANG = "ko";
      /* 감성 표현 강도를 높이기 위해 AI가 골라 쓰는 8가지 이미지 스타일 */
      const IMAGE_STYLES = {
        "Cinematic Architectural Visual":
          "cinematic architectural visualisation: dramatic wide framing of built space, strong directional light cutting through deep shadow, faint atmospheric haze, restrained graded colour, anamorphic film mood",
        "Soft 3D Illustration":
          "soft 3D emotional illustration rendered in high quality CGI: rounded volumes, matte clay or plush surfaces, gentle subsurface glow, tender pastel palette, shallow depth of field, one endearing hero object",
        "Lifestyle Photography":
          "lifestyle action photography: a real moment caught mid-movement, natural available light, visible motion energy, candid off-centre framing, authentic textures and props",
        "Fine Art Landscape Photography":
          "fine art landscape photography: large-format clarity, quiet horizon composition, long tonal range, natural weather light, generous contemplative negative space",
        "Futuristic Architecture Photography":
          "futuristic architecture photography: crisp geometry, precise machined edges, cool reflective envelopes, controlled one-point perspective, clean sky or void background",
        "Abstract Color Flow Render":
          "colour flow abstract render: liquid ribbons and gradient fields caught in motion, smooth CG surfaces, luminous colour transitions, no recognisable object",
        "Luxury Abstract CG Art":
          "luxury abstract CG art: sculptural forms in precious material, studio reflections, refined specular highlights, deep saturated ground, gallery product mood",
        "Soft Macro Nature Photography":
          "soft macro nature photography: extreme close-up of a natural subject such as water droplets, frost crystals, mineral grain, bark texture or fine fibres in razor focus, creamy bokeh, delicate diffused light"
      };
      const STYLE_NAMES = Object.keys(IMAGE_STYLES);
      const STYLE_LIST_TEXT = STYLE_NAMES.map((n, i) => `${i + 1}. ${n}`).join(" / ");

      /* Mood Image Visual Style Rule — 스타일 선택 기준 */
      /* 꽃 제한 — 감성 키워드나 연관 과제가 꽃과 직접 연결될 때만 꽃 장면을 허용합니다. */
      const FLOWER_RE = /꽃|플라워|장미|벚꽃|튤립|라벤더|국화|수국|목련|개나리|진달래|해바라기|부케|flower|floral|blossom|bloom|petal|bouquet|tulip|lavender/i;
      function flowerAllowed(keyword, note) { return FLOWER_RE.test(`${keyword || ""} ${note || ""}`); }
      function flowerRuleKo(keyword, note) {
        return flowerAllowed(keyword, note)
          ? "이번 입력은 꽃과 직접 연결된 감성이므로 꽃 장면을 쓸 수 있습니다. 다만 꽃 장면은 전체 중 1개까지만 쓰고, 나머지는 꽃이 아닌 소재로 표현해 감성의 폭을 넓힙니다."
          : "이번 입력은 꽃과 직접 연결된 감성이 아닙니다. 꽃, 꽃잎, 꽃다발, 꽃밭, 개화 장면을 어떤 항목에서도 쓰지 않습니다.";
      }
      function flowerRuleEn(keyword, note) {
        return flowerAllowed(keyword, note)
          ? "Flowers may appear in at most ONE panel or cell; every other panel or cell must use a clearly non-floral subject."
          : "Absolutely no flowers, petals, blossoms, bouquets or flower fields anywhere in the image.";
      }

      /* 처음 감성 해석의 연상·시각 앵커를 이후 단계 프롬프트에 이어 붙입니다. */
      function anchorBlock(c) {
        if (!c) return "";
        const lines = [];
        if (c.multi) lines.push("- 여러 감성 해석이 함께 선택되었습니다. 공통점을 중심으로 통합하되 각 해석의 특징이 결과에 고루 반영되게 합니다.");
        if (c.anchor) lines.push(`- 출발한 공통 연상: ${c.anchor}`);
        if (c.visualAnchor) lines.push(`- 시각 앵커: ${c.visualAnchor}`);
        return lines.length ? `\n[처음 감성 해석에서 이어받는 기준]\n${lines.join("\n")}\n` : "";
      }
      function anchorImgLine() {
        const c = selectedConcept();
        if (!c || !c.visualAnchor) return "";
        return `\nVisual continuity anchor from the chosen emotion — keep its material family, palette, light and surface character throughout${c.anchor ? ` (people's first association: ${c.anchor})` : ""}: ${c.visualAnchor}`;
      }

      const STYLE_RULE_TEXT = `입력 감성의 특성에 따라 위 8개 표현 방식 중 가장 적합한 하나를 직접 고릅니다. 감성의 의미뿐 아니라 에너지, 긴장도, 공간감, 시간성, 자연성, 추상성을 함께 고려해 결정합니다. 같은 스타일을 기계적으로 반복하지 말고, 입력된 감성을 가장 명확하게 전달하는 표현 방식을 고릅니다.`;

      /* 감성 해석 방식 — 사용자 선택 없이 한 가지 방법론으로 고정합니다. */
      const EMOTION_METHOD = {
        label: "공통 지각 연상 중심 감성디자인",
        en: "Shared Perceptual Association Design",
        guide: `먼저 일반적인 사람들이 이 감성 단어를 들었을 때 가장 먼저 떠올리는 대상·소재·형태·감각, 즉 공통 지각 연상을 찾습니다. 예를 들어 '귀엽다'는 둥근 캐릭터나 인형, '무겁다'는 큰 돌이나 금속 덩어리, 건축의 육중한 매스, '차갑고 예리하다'는 날카로운 금속 엣지처럼 누구나 공감하는 연상을 해석의 출발점으로 삼습니다. 그다음 그 연상이 몸과 마음으로 어떻게 경험되는지(에너지, 긴장과 이완, 무게, 온도, 움직임, 공간 분위기, 여운)를 해석합니다. 낯설거나 개인적인 은유보다 많은 사람이 바로 고개를 끄덕일 수 있는 해석을 우선합니다.`
      };

      const STAGES = [
        { n: 1, label: "감성 키워드" },
        { n: 2, label: "감성 해석" },
        { n: 3, label: "지각 특성" },
        { n: 4, label: "인터랙션 물성" },
        { n: 5, label: "인터랙션 제안" }
      ];

      const SAMPLE_KEYWORDS = [
        "차갑고 아름답고 무거움",
        "밝고 아름답다",
        "젊고 활기차고 아름답다",
        "고요하고 단단하다",
        "귀엽고 향기롭다",
        "따뜻하고 편안하다",
        "날카롭고 세련되다",
        "부드럽고 생명력 있다"
      ];

      /* 최종 인터랙션 제안 개수 */
      const INTERACTION_COUNT = 6;

      /* 최종 인터랙션의 참조 구조 — 애플 Liquid Glass의 인터랙션 요소 8개.
         이 중 분석 중인 감성에 맞는 6개를 AI가 골라, 앞 단계에서 정의한 물성을 실제 반응 속에 창의적으로·조금 과장해 적용합니다.
         유리 효과는 써도 되지만, 그 유리의 성격(두께·굴절·움직임)은 앞 단계 물성이 정합니다. */
      const LG_ELEMENTS = [
        { no: 1, ko: "버튼 누르기", en: "Button Press",
          react: "누른 지점에서 반응이 시작되어 주변 요소로 퍼지고, 버튼이 배경 위에 떠 있는 존재감을 드러냅니다",
          role: "입력이 인식됐다는 것을 시각적으로 알리고, 버튼과 콘텐츠 사이의 깊이감을 만듭니다" },
        { no: 2, ko: "슬라이더·토글 조작", en: "Slider & Toggle",
          react: "손잡이나 조작 부분이 움직이는 동안 물성을 강하게 띠며 강조되고, 조작이 끝나면 주변과 조화롭게 돌아갑니다",
          role: "값이나 상태를 바꾸는 조작부에 시선을 모읍니다" },
        { no: 3, ko: "버튼에서 메뉴·팝오버 열기", en: "Menu & Popover from Button",
          react: "메뉴가 갑자기 나타나지 않고 그 버튼에서 이어져 나오듯 전개되며, 커질수록 두께감·그림자·물성 효과가 강해집니다",
          role: "메뉴가 어떤 버튼에서 열렸는지 공간적으로 연결해 보여 줍니다" },
        { no: 4, ko: "탭 막대·도구 막대·사이드바", en: "Tab Bar, Toolbar & Sidebar",
          react: "내비게이션 요소가 콘텐츠 위에 떠 있는 층으로 표현되고, 콘텐츠는 그 아래로 스크롤되며 살짝 비쳐 보입니다",
          role: "탐색 기능과 본문 콘텐츠를 구분하면서 콘텐츠 공간을 확보합니다" },
        { no: 5, ko: "스크롤과 겹침", en: "Scroll & Overlap",
          react: "콘텐츠가 떠 있는 요소 아래를 지날 때 가장자리에서 부드럽게 흐려지거나 어두워지며 가독성을 유지합니다",
          role: "떠 있는 UI와 움직이는 콘텐츠의 경계를 만들어 요소가 배경에 묻히지 않게 합니다" },
        { no: 6, ko: "시트·액션 시트 열기와 확장", en: "Sheet Open & Expand",
          react: "관련 버튼이나 동작에서 이어져 열리고, 끌어 올릴수록 커지며 물성이 짙어지고 배경은 어두워집니다",
          role: "열리는 위치와 작업의 출처를 알리고, 더 깊은 단계에 들어섰다는 느낌을 줍니다" },
        { no: 7, ko: "화면·상태 전환", en: "Screen & State Transition",
          react: "화면이나 상태가 바뀔 때 제어 요소가 형태를 바꾸며 하나의 유동적인 층처럼 이어집니다",
          role: "화면 전환을 단절된 교체가 아니라 연속된 흐름으로 느끼게 합니다" },
        { no: 8, ko: "주변 화면과 기기에 적응", en: "Adapt to Content & Device",
          react: "뒤에 놓인 콘텐츠의 밝기·색, 화면 크기, 포커스 변화에 따라 물성의 색조·투명도·그림자가 조정됩니다",
          role: "배경이 달라져도 조작 요소의 가독성과 계층을 유지합니다" }
      ];
      /* AI가 요소 선택을 빠뜨렸을 때 쓰는 기본 순서 */
      const LG_DEFAULT_ORDER = [1, 2, 6, 3, 7, 5, 4, 8];
      const LG_ELEMENTS_TEXT = LG_ELEMENTS.map(e => `${e.no}. ${e.ko} (${e.en}) — 반응: ${e.react} / 역할: ${e.role}`).join("\n");
      const elementName = no => { const e = LG_ELEMENTS[no - 1]; return e ? e.ko : ""; };

      /* 감성 물성 시스템과 선택한 6개 요소를 다음 요청·수정 요청에 그대로 이어 줍니다. */
      function planBlock(plan) {
        if (!plan) return "";
        const ms = plan.materialSystem || {};
        return `\n[이미 정한 감성 물성 시스템 — 그대로 이어서 씀]
- 이름: ${ms.nameKo || ""} (${ms.nameEn || ""})
- 기본 표면: ${ms.surface || ""}
- 핵심 성질: ${(ms.core || []).join(" · ")}
- 과장 방식: ${ms.exaggeration || ""}
- 고른 6개 요소(제안 순서): ${plan.elements.map((n, i) => `${pad2(i + 1)} ${elementName(n)}`).join(" / ")}
"selectedElements"와 "materialSystem"은 다시 정하지 않으며 반환하지 않아도 됩니다.\n`;
      }

      const NO_DATA = "이 항목은 AI 응답에 포함되지 않았습니다. 다시 생성해 보세요.";

      /* =========================================================
         2. PROMPTS — 텍스트
         ========================================================= */
      const SYSTEM = `당신은 감성 디자인, 지각심리학, 체화인지, 인터랙션 디자인, 햅틱 UX, 모션 디자인, 동적 물성 시뮬레이션을 함께 다루는 시니어 Interaction Experience Designer입니다.

- "category"는 감지, 반응, 확산, 깊이, 회복, 안착, 잔향처럼 지각 축을 부르는 2~5자의 전문적이고 짧은 이름입니다.
- "titleKo"는 사람이 실제로 지각하는 방식을 나타내는 짧은 동사형 문장입니다. 예: "가볍게 감지된다", "탄력 있게 되돌아온다", "넓게 퍼져 보인다", "깊이 있게 머문다", "안정적으로 안착한다".
- "titleKo"를 "싱그러운 잔광", "맑은 온기", "부드러운 회복"처럼 시적인 명사구로 쓰지 않습니다.
- "titleEn"은 같은 지각을 간결하게 표현하는 자연스러운 영어 문구입니다.
- "description"은 정확히 2문장입니다. 첫 문장은 언제·어떻게 지각되는지, 둘째 문장은 그 지각이 사용자에게 어떤 인상과 경험을 남기는지 설명합니다.
- description은 감성 정의의 유사어 반복이 아니라 관찰 가능한 인식 과정으로 씁니다.
- "cue"는 도구 없이도 눈·손·몸으로 확인할 수 있는 구체적인 관찰 단서 1문장입니다.
- 각 지각 특성은 다음 단계의 인터랙션 물성 축으로 연결 가능해야 합니다. 그러나 이 단계에서는 Elasticity, Damping, Inertia, Friction, Latency, Glow, Haptic 같은 구현 물성명이나 UI 컴포넌트명을 직접 쓰지 않습니다.
- 모든 항목이 온기·빛·여운처럼 비슷한 감성 표현에 몰리지 않게 하며, 서로 다른 감각·시간·공간·반응 축을 사용합니다.

[대표 이미지 생성 지침]
각 지각 특성마다 그 특성이 한눈에 읽히는 '단독 대표 장면 1개'를 설계합니다. 실제 API 생성은 모든 장면을 하나의 통합 이미지 파일로 묶어 생성하지만, 각 셀은 독립된 하나의 완결된 이미지여야 합니다.

- "visual"은 단일 사물, 사물의 일부, 하나의 행동, 하나의 공간 또는 하나의 자연/인공 현상을 영어 2~3문장으로 구체적으로 묘사합니다.
- visual에는 피사체, 스케일(매크로/클로즈업/중경/공간), 카메라 시점, 빛, 움직임 또는 정지 상태, 배경, 지각 특성이 드러나는 핵심 순간을 포함합니다.
- 예쁜 이미지를 만드는 것이 아니라 해당 지각 특성이 시각적으로 즉시 읽히는 것이 우선입니다.
- 같은 피사체를 반복하지 않습니다. 특히 잎, 꽃, 숲, 물방울 같은 식물·자연 소재를 모든 항목에 반복하지 않습니다.

- 지각 특성은 공통 연상 대상이 실제로 어떻게 보이고 만져지고 움직이는지에서 출발합니다. 예: 금속 덩어리 → 묵직하게 눌린다, 차갑게 감지된다 / 봉제 인형 → 폭신하게 받아 준다.
- 최소 3개 이미지는 서로 다른 비자연 범주를 포함합니다. 예: 건축·공간, 인공 오브젝트/제품 일부, 패브릭/움직임, 빛과 그림자, 추상적 물질 현상, 손이나 부분적 동작 장면 등.

- 이미지의 다양성보다 선택된 감성 해석과의 정서적 일관성이 우선이며, 모든 이미지가 하나의 감성 패밀리로 느껴져야 합니다.

- Soft Macro Nature Photography는 미세한 자연 디테일을 실제로 보여줘야 할 때만 사용하며 기본값처럼 반복하지 않습니다.
- 움직임·회복·리듬은 Lifestyle Photography 또는 상황에 맞는 동적 표현을 우선 고려합니다.
- 공간감·깊이·경계는 Cinematic Architectural Visual 또는 Futuristic Architecture Photography를 고려합니다.
- 확산·흐름·방향성은 Abstract Color Flow Render를 고려할 수 있습니다.

[라벨]
- "label"은 통합 이미지 셀에 넣을 2~3단어의 짧은 영문 제목입니다.
- "labelKo"는 같은 뜻의 짧은 한글 제목입니다.
- label은 감성 시어보다 지각 내용이 명료하게 읽히는 제목으로 만듭니다.

[금지 규칙]
- 감성 정의를 표현만 바꾸어 여러 번 반복하지 않습니다.
- 모든 항목을 '빛', '온기', '여운', '싱그러움' 같은 감성 언어로 만들지 않습니다.
- 모든 대표 이미지를 나뭇잎·꽃·숲 등 자연 이미지로 만들지 않습니다.
- 같은 피사체를 클로즈업만 바꾸어 반복하지 않습니다.
- 모든 셀을 Soft Macro Nature Photography로 만들지 않습니다.
- 지각 단계에서 모션 파라미터, 햅틱 값, UI 컴포넌트명, 전문 물성값을 미리 제안하지 않습니다.

- 실제 소재명, 제조 공정, 표면 마감, CMF 색상 제안은 하지 않습니다. 단, visual의 색·빛·표면 분위기는 시각 앵커를 따릅니다.

Liquid Glass는 '유리'라는 하나의 물성을 아래 8개 인터랙션 요소 전체에 일관되게, 실제보다 조금 과장해 적용한 인터랙션 시스템입니다. 우리가 할 일도 같습니다. 이 프로그램의 앞 단계에서 정의한 지각 특성과 인터랙션 물성을 아래 요소들의 실제 반응 속에 창의적으로 녹여 넣습니다.
${LG_ELEMENTS_TEXT}

[요소 선택 — 반드시 지킴]
- 위 8개 중 이번 감성에 가장 잘 맞는 6개를 고릅니다. 앞 단계 물성이 가장 뚜렷하고 자연스럽게 드러나는 요소를 우선하고, 물성이 잘 드러나지 않는 2개를 뺍니다.
- 6개 제안은 고른 요소를 하나씩 맡습니다. 같은 요소를 두 번 쓰지 않습니다.
- 각 제안의 "element"에는 요소 번호(1~8)를, "frame"에는 요소 이름을 위 표기 그대로 적습니다.
- 각 제안은 그 요소의 '반응'과 '역할'을 수행하되, 그 반응이 어떻게 일어나는지는 앞 단계 물성이 결정합니다.

[감성 물성 시스템 — 가장 중요]
- 먼저 앞 단계의 인터랙션 물성(목표값 포함)·지각 특성·시각 앵커를 묶어 하나의 '감성 물성 시스템'을 정의합니다. Liquid Glass가 굴절·반사·두께·블러라는 유리의 성질을 모든 요소에 일관되게 쓰듯, 이 시스템의 핵심 성질 3~4개를 6개 요소 전체에 일관되게 적용합니다.
- 유리 효과(반투명 층, 굴절, 블러, 반사 하이라이트, 렌즈 같은 가장자리)를 써도 됩니다. 유리를 기본 표면으로 쓴다면 앞 단계 물성이 그 유리의 성격을 바꿉니다. 예: 무겁고 차가움 → 두껍고 밀도 높은 짙은 유리, 굴절이 손가락을 느리게 따라오고 착지할 때 무게감 있게 가라앉음 / 귀엽고 말랑함 → 젤리처럼 부푼 유리, 누르면 볼록하게 출렁이며 빛이 둥글게 번짐 / 날카롭고 세련됨 → 얇고 맑은 유리, 가장자리 하이라이트가 칼날처럼 빠르게 스침. 유리가 아닌 표면이 감성에 더 맞으면 그렇게 정의해도 됩니다.
- 앞 단계 물성을 이름만 옮겨 적지 말고 창의적으로 번역합니다. 하나의 물성이 움직임뿐 아니라 빛·두께·투명도·형태·색·햅틱 같은 예상하지 못한 반응 채널에서 드러나게 하는 것도 좋습니다. 예: '천천히 사라지는 여운'이 높으면 손을 뗀 뒤 표면의 빛 번짐이 천천히 가라앉음 / '닿는 순간의 민감도'가 높으면 손가락이 닿는 순간 표면이 먼저 미세하게 부풀어 오름.
- 물성 목표값의 높낮이가 반응의 크기에 드러나게 합니다. 값이 높을수록 더 강하고 분명하게 나타납니다.
- 선택된 인터랙션 물성은 6개 제안 전체에서 빠짐없이 한 번 이상 쓰입니다.
- 물성은 조금 과장합니다. 실제 물리보다 1.3~1.6배 강하게 표현해 처음 보는 사람도 바로 그 감성을 알아차리게 합니다. 예: 무거움 → 손가락보다 한 박자 늦게 출발하고, 깊게 눌리며, 착지할 때 주변 요소까지 미세하게 내려앉습니다 / 말랑함 → 누른 지점이 크게 오목해지고, 놓으면 두세 번 출렁이며 복원됩니다 / 차갑고 예리함 → 접촉 순간 날카로운 하이라이트가 가장자리를 따라 빠르게 스칩니다.
- 과장하되 매일 반복해도 피곤하지 않고 정보가 또렷이 읽히는 수준을 지킵니다.
- 시스템 이름은 이번 감성이 드러나게 짓습니다. 'Liquid Glass'를 그대로 쓰지 않습니다. 'Dense Frost Glass', 'Jelly Glass'처럼 감성이 붙은 이름은 좋습니다. 한글 이름은 '서리 낀 두꺼운 유리', '젤리처럼 말랑한 유리'처럼 쉬운 말로 짓습니다.
- 각 제안의 "physicalBasis"에는 이 시스템의 어떤 성질이 이 요소에서 어떻게 과장되어 나타나는지 적고, "propertyTranslation"에는 앞 단계 물성 2~4개가 이 인터랙션의 어떤 반응으로 번역되었는지 하나씩 적습니다.

[좋은 인터랙션의 조건 — 반드시 지킴]
아래 조건은 잘 만든 감성 인터랙션 사례('말랑한 미소': 봉오리 확인 버튼, 이슬 방울 선택 레일, 오래 누를수록 크게 펼쳐지는 기억 카드, 만진 자리에 숨은 기억이 비치는 온기 필드, 우윳빛 확대 렌즈)에서 정리한 것입니다. 사례의 내용을 따라 하지 말고, 조건만 이번 감성에 맞게 적용합니다.
1. 주제의 형상: UI 요소 자체가 이번 감성·주제에서 떠오르는 대상의 모양과 이름을 띱니다. 예: 확인 버튼 → 봉오리, 선택 슬라이더 → 이슬 방울이 구르는 길, 확대 기능 → 우윳빛 렌즈. 사실적인 물체 그림이 아니라, 그 대상을 닮은 단순하고 깨끗한 UI 형태입니다.
2. 실제 기능과 결과: 확인, 선택, 펼치기, 숨은 내용 보기, 기록 남기기, 확대 미리보기처럼 실제로 작동하는 기능이 있고, 조작이 끝나면 눈에 보이는 결과(확인 표시, 선택 확정, 패널 열림, 내용 드러남 등)가 남습니다. 결과로 보이는 내용도 주제에 어울려야 합니다.
3. 입력의 크기 → 결과의 크기: 누른 시간·깊이·끄는 속도·거리가 결과를 바꿉니다. 예: 오래 누를수록 깊이 눌리고 카드가 더 크게 펼쳐짐 / 빠르게 밀면 관성으로 더 멀리 감.
4. 구체적인 움직임 수치: 앞 단계 물성의 '움직임 수치'를 이어받아 접촉 반응 ms, 최대 눌림 %, 복원 시간과 출렁임 횟수, 잔광 시간, 파동이 퍼지는 시간과 반경을 적습니다.
5. 물성이 보이는 그래픽: 형태(유기적 곡선 등), 눌릴 때의 찌그러짐, 그림자 변화, 빛 번짐·잔광, 투명도, 질감, 색이 감성 물성을 그대로 보여 줍니다. 앞 단계 물성의 '그래픽'을 이어받습니다.
6. 손을 뗀 뒤의 여운: 바로 끝나지 않고 잠깐 머문 뒤 출렁이며 돌아오거나, 빛이 천천히 사라지는 식으로 감성에 맞는 여운이 남습니다.
7. 감성에 맞는 기호(또는 기호 없음): 버튼·손잡이 위에 들어가는 기호는 이번 감성에서 직접 고릅니다. 예: 말랑한 미소 → 작은 미소 곡선, 차갑고 무거움 → 짧고 굵은 가로선, 고요함 → 작은 점 하나. 형상만으로 충분하면 기호를 넣지 않습니다. 종이비행기·전송 화살표·하트·체크·플러스·톱니바퀴·종 같은 흔한 시스템 아이콘을 기본값처럼 쓰지 않습니다.
8. 감성 언어로 된 상태: 대표 상태 이름을 '고요히 기다리는 중', '살며시 받아들이는 중', '손길의 여운이 남아요'처럼 이번 감성의 말투로 짓습니다.

[가장 중요한 원칙 — 이것은 디지털 인터랙션입니다]
- 제안하는 것은 실제 물체나 기계 장치가 아니라, 화면 속 UI 요소가 사용자의 입력에 반응하는 방식입니다. 결과물은 UX 디자이너와 모션 디자이너가 바로 프로토타입으로 만들 수 있는 인터랙션 스펙이어야 합니다.
- 각 제안은 하나의 명확한 디지털 인터랙션 패턴에 속합니다. 예: 화면 전환(Transition), 마이크로 인터랙션(Micro-interaction), 상태 피드백(State feedback), 제스처 응답(Gesture response), 스크롤·리스트 거동(Scroll physics), 진행·로딩 표현(Progress), 알림 등장과 정리(Notification), 콘텐츠 정리·삭제(Dismiss), 값 조절(Value control).
- 물성은 '메타포'로만 쓰고, 실제 구현 언어로 번역합니다. 예: 무거움 → 입력 후 지연 출발·강한 감쇠 스프링·오버슈트 없음 / 말랑함 → 낮은 강성 스프링·눌림 시 4~7% 스케일 축소·작은 반동 / 차갑고 예리함 → 빠른 이징·짧은 지속·선명한 엣지 하이라이트·짧고 단단한 햅틱.
- 화면 요소의 변화(위치·스케일·형태·투명도·블러·깊이·발광·색), 타이밍과 이징, 햅틱(필요하면 짧은 UI 사운드)의 조합으로 설명합니다. 물리 현상을 시뮬레이션하는 것 자체가 목적이 아닙니다.
- 그 물성 메타포를 지우면 감성 경험이 사라지는 인터랙션이어야 합니다. 일반 기본 모션과 구별되지 않는 제안은 실패입니다.

[금지]
- 사실적인 물체 사진·3D 모형을 화면에 두거나, 손으로 만지는 기계 장치처럼 읽히는 제안을 하지 않습니다. 단, UI 요소가 주제 대상을 닮은 단순한 형태(봉오리 모양 버튼, 이슬 방울 손잡이, 렌즈 모양 확대창)를 띠는 것은 좋습니다.
- "점성 유체가 흐른다", "금속이 굴러간다"처럼 물리 현상 묘사로만 끝나는 설명을 하지 않습니다. 반드시 어떤 UI 요소가 어떤 입력에 어떻게 반응하는지로 씁니다.
- 버튼·슬라이더·토글에 스타일만 입힌 평범한 제안을 하지 않습니다. 기본 컴포넌트를 쓰더라도 감성 메타포가 반영된 고유한 반응 거동이 있어야 합니다.
- 같은 디지털 인터랙션 패턴과 같은 모션 원리를 두 번 쓰지 않습니다. 6개는 서로 다른 패턴·서로 다른 모션 원리여야 합니다.
- Magnifier, Liquid Glass 같은 기존 사례 이름을 제안명으로 그대로 쓰지 않습니다.
- 유리 효과만 입히고 앞 단계 물성이 반응에 드러나지 않는 제안은 실패입니다. 유리를 쓰든 쓰지 않든, 어떤 물성이 어떤 반응을 만드는지 분명해야 합니다.

[감성에 따라 달라져야 함]
- 어떤 모션 원리와 피드백을 고르는지 자체가 처음 감성 키워드에서 나와야 합니다. 다른 감성에서도 똑같이 나올 6개 세트라면 실패입니다.
- 6개 모두 감성 물성 시스템을 공유하며, 공통 연상 대상과 시각 앵커가 주는 느낌(무게·탄성·온도·날카로움 등)을 움직임 성격과 UI 형태로 번역합니다.
- 색감, 광학 톤, 무게감, 속도, 감쇠 성격은 처음 감성 키워드와 끝까지 일치해야 합니다. visual과 visualBehavior는 시각 앵커의 색·빛·표면 톤만 이어받습니다.

[적용 맥락과 입력의 다양성]
- 모든 제안은 휴대폰 화면에서 손가락으로 조작하는 인터랙션입니다. TV, 리모컨, 워치, 차량 등 다른 기기는 제안하지 않습니다.
- 각 제안은 맡은 요소가 실제로 쓰이는 휴대폰의 구체적인 순간에 적용합니다. 예: 잠금 해제, 알림 도착과 정리, 볼륨·밝기 조절, 카메라 셔터, 충전 연결, 알람 끄기, 앱 전환, 사진 삭제, 음악 재생, 키보드 입력, 당겨서 새로고침, 방해금지 전환, 사진 넘기기, 홈 화면 아이콘 정리. 6개는 서로 다른 맥락이어야 합니다.
- 입력은 화면 터치 제스처 중심으로 다양하게 씁니다: 탭, 더블 탭, 길게 누름, 드래그, 스와이프, 플릭, 당기기, 핀치, 두 손가락 회전, 가장자리 스와이프 등. 리모컨·버튼 조작은 쓰지 않습니다. 기울이기·흔들기 같은 기기 움직임은 꼭 필요한 경우에만 6개 중 최대 1개까지 화면 터치와 함께 보조로 씁니다.

[물성에 최적화된 동작 구성]
- 모든 인터랙션에 시간 단계 전체를 일괄 적용하지 않습니다. 각 제안은 맡은 요소의 핵심 순간을 중심으로 설계합니다.
- 각 인터랙션은 선택된 물성의 성격이 가장 잘 드러나는 구조로 자유롭게 설계합니다. 예: 어떤 물성은 입력 직후의 즉각 반응이 핵심이고, 어떤 물성은 드래그 중 저항이, 어떤 물성은 손을 뗀 뒤의 여운이 핵심입니다. 핵심이 아닌 구간은 과감히 생략합니다.

[핵심 관점]
- 선택된 물성 중 2~4개를 각 인터랙션에 연결하고, 각 물성이 어떤 순간에 어떤 모션·피드백 값으로 번역되는지 분명히 설명합니다.
- 같은 유형의 요소라도 감성에 따라 반응 속도, 변형량, 오버슈트, 감쇠, 잔향, 광학 피드백, 햅틱이 달라져야 합니다.
- 실제 OS 수준의 비율과 정보 구조를 갖추고, 매일 반복해도 피곤하지 않은 강도로 설계합니다. 특정 OS나 브랜드 UI를 복제하지 않습니다.

[작성 규칙]
- "element"는 맡은 요소 번호, "frame"은 그 요소 이름입니다. 위 [요소 선택] 규칙을 따릅니다.
- "type"은 디지털 인터랙션이 드러나는 짧은 영문 명칭입니다. 예: Weighted Unlock Motion, Elastic Pull Refresh, Damped Sheet Transition, Snap Focus Shift, Dissolve Dismiss, Settling Toast. 예시를 그대로 쓰지 말고 이번 감성에 맞게 정합니다.

          const c = selectedConcept();
          const ms = state.interactionPlan && state.interactionPlan.materialSystem;
          const tone = (c && c.visualAnchor ? `\nColour, light and surface tone borrowed from the chosen emotion (use for the UI shapes and colours; stylised, never photo-real): ${c.visualAnchor}` : "") +
            (ms && ms.nameEn ? `\nOne shared signature UI material applied consistently to every row, rendered slightly exaggerated so the emotion is obvious at a glance (like a system-wide UI material; glass-like translucent layers, refraction and highlights are welcome, but their thickness, motion and light must clearly follow this emotion's properties): ${ms.nameEn}${ms.surface ? ` (${ms.surface})` : ""} — ${(ms.core || []).join(", ")}.` : "");
          return `Interaction design concept board in a clean editorial style, like a professional motion-spec review sheet. High-quality UI rendering, no watermark, no real brand logos, no app names.
Create ONE single vertical 2:3 board with exactly ${items.length} horizontal rows separated by thin light-grey lines, numbered ${pad2(base + 1)} to ${pad2(base + items.length)} in this order, on a white or very light grey background.
Left column of each row: a very large row number, the English concept name in bold, a short dash, then the Korean concept name with its English subtitle beneath.
Right side of each row: THREE equal state panels left-to-right, each with a small Korean state label and an English state label directly above it.
Each panel shows ONLY the interaction element itself as an isolated UI component on a simple rounded card or plain ground — for example a button, list, slider rail, bottom sheet, toggle, card stack, lens, dial or notification card. Do NOT draw a phone body, device frame, bezel, status bar, full app screen or TV set. Keep the element large and centred so the change between the three states is understood at a glance.
These are screen-based digital interactions. Render every element as clean digital interface graphics — flat or glassy UI surfaces with light, shadow, blur and glow layers — never as a photo-real object, material sample or mechanical part. Each UI element may take a simple stylised shape inspired by the theme (for example a bud-shaped button, a dew-drop slider handle, a soft lens-shaped magnifier) as described in its direction.
Make the motion model readable through the element itself: position change, sinking depth, compression, stretch, resistance, overshoot, settling, blur, glow or ripple. Use restrained motion trails, ghosted previous positions or a small touch-point marker where helpful.
Keep one consistent visual language across the whole board (same card style, same lighting), and keep each row's element identical across its three states except for the state change itself.
Do NOT paint realistic scenes or photo-real objects. Never add a paper-plane, send arrow or any other generic system icon (heart, check mark, plus, gear, bell) to a button or handle; draw only the glyph specified for each row, or no glyph when it says none. Express the emotion through the themed UI shape, its squash and stretch when pressed, shadow changes, light bloom and afterglow, translucency, texture and colour.
Fixed board design system — keep it identical on every board this program generates:
- Canvas: pure white background, generous equal outer margins, thin light-grey (#E2E8F0) horizontal dividers between rows, every row exactly the same height.
- Left label column: 30% of the width. Row number in a bold geometric sans-serif, very large, near-black navy (#0F172A). Below it the English concept name in bold sans-serif, a short dash, then the Korean concept name in a clean Korean sans-serif (Pretendard-like) with its English subtitle in medium grey beneath.
- Three state panels per row: identical size and position on every row, rounded corners of the same radius, the same panel background tone, the same soft shadow.
- Above each panel: the Korean state label in bold dark navy and the English state label in grey directly beneath, same sizes on every row.
- Same font family, weights and sizes, same colour palette, same lighting and the same UI rendering style across all rows and both boards. No title, no header, no footer, no page number.
Typography: row number and concept names large and legible; state labels small but readable; no paragraphs of body copy.${tone}
${rows}`;
        }
      };

      /* =========================================================
         5. 저장소
         - 프로젝트 데이터: localStorage(빠른 목록) + IndexedDB 사본.
           휴대폰 앱(WebView)·모바일 브라우저는 localStorage를 디스크에 늦게 기록하므로
           앱을 바로 닫으면 마지막 변경이 사라질 수 있습니다. 같은 데이터를 IndexedDB에
           트랜잭션으로 함께 기록하고, 불러올 때 두 곳 중 더 최신(rev)을 씁니다.
         - 저장할 때마다 rev(저장 번호)를 올립니다. 다른 창이 더 최신 rev를 저장했으면
           오래된 창이 그 위에 덮어쓰지 못하게 막습니다.
         - 이미지는 IndexedDB에 저장하고, 생성 당시 내용의 서명(sig)을 함께 남겨
           내용이 수정된 뒤 아직 갱신되지 않은 옛 이미지를 구분합니다.
         ========================================================= */
      const Store = {
        list() {
          try {
            const raw = localStorage.getItem(CONFIG.PROJECTS_KEY);
            const arr = raw ? JSON.parse(raw) : [];
            return Array.isArray(arr) ? arr : [];
          } catch (e) {
            console.warn("저장 목록을 읽지 못했습니다.", e);
            return [];
          }
        },
        get(id) { return Store.list().find(p => p.id === id) || null; },
        _write(list) {
          try { localStorage.setItem(CONFIG.PROJECTS_KEY, JSON.stringify(list)); return true; }
          catch (e) { return false; }
        },
        /* meta.baseRev: 이 창이 마지막으로 읽거나 저장한 rev. 저장된 rev가 더 크면 다른 창이 먼저 저장한 것입니다. */
        save(snapshot, meta) {
          const all = Store.list();
          const prev = all.find(p => p.id === meta.id);
          const prevRev = prev ? (prev.rev || 0) : 0;
          if (prev && prevRev > (meta.baseRev || 0)) return { ok: false, conflict: true, row: prev };
          const row = JSON.parse(JSON.stringify({
            id: meta.id, title: meta.title, savedAt: Date.now(),
            rev: Math.max(prevRev, meta.baseRev || 0) + 1, data: snapshot
          }));
          let list = [row].concat(all.filter(p => p.id !== meta.id));
          const evicted = [];
          if (list.length > CONFIG.MAX_PROJECTS) {
            evicted.push.apply(evicted, list.slice(CONFIG.MAX_PROJECTS));
            list = list.slice(0, CONFIG.MAX_PROJECTS);
          }
          let pruned = null;
          if (!Store._write(list)) {
            const reduced = list.slice(0, Math.max(1, list.length - 1));
            if (Store._write(reduced)) {
              evicted.push.apply(evicted, list.slice(reduced.length));
              pruned = "oldest";
            } else {
              /* localStorage가 가득 차도 IndexedDB 사본은 남깁니다. */
              ProjectDB.put(row);
              return { ok: false, idbOnly: true, row };
            }
          }
          evicted.forEach(p => { ImageDB.removeProject(p.id); ProjectDB.remove(p.id); });
          ProjectDB.put(row);
          return { ok: true, row, pruned };
        },
        /* rev를 바꾸지 않고 목록의 한 행만 교체합니다. (IndexedDB 사본이 더 최신일 때) */
        putRow(row) {
          const list = Store.list();
          const i = list.findIndex(p => p.id === row.id);
          if (i >= 0) list[i] = row; else list.unshift(row);
          list.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
          return Store._write(list.slice(0, CONFIG.MAX_PROJECTS));
        },
        remove(id) {
          ImageDB.removeProject(id);
          ProjectDB.remove(id);
          return Store._write(Store.list().filter(p => p.id !== id));
        },
        /* 시작할 때 IndexedDB 사본이 더 최신인 프로젝트를 목록에 되살립니다. */
        async reconcile() {
          const rows = await ProjectDB.all();
          if (!rows.length) return false;
          const list = Store.list();
          let changed = false;
          rows.forEach(r => {
            if (!r || !r.id || !r.data) return;
            const i = list.findIndex(p => p.id === r.id);
            if (i < 0) { list.push(r); changed = true; }
            else if ((r.rev || 0) > (list[i].rev || 0)) { list[i] = r; changed = true; }
          });
          if (!changed) return false;
          list.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
          list.slice(CONFIG.MAX_PROJECTS).forEach(p => { ImageDB.removeProject(p.id); ProjectDB.remove(p.id); });
          return Store._write(list.slice(0, CONFIG.MAX_PROJECTS));
        }
      };

      const IMAGE_SLOTS = ["emotion", "perception", "property", "interaction", "interactionB"];
      const DB_STORES = { images: CONFIG.IMAGE_DB.store, projects: "projects" };
      let dbPromise = null;

      function openDB() {
        if (!("indexedDB" in window)) return Promise.reject(new Error("IDB_UNAVAILABLE"));
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((res, rej) => {
          let req;
          try { req = indexedDB.open(CONFIG.IMAGE_DB.name, 2); } catch (e) { rej(e); return; }
          req.onupgradeneeded = () => {
            const db = req.result;
            Object.keys(DB_STORES).forEach(k => {
              if (!db.objectStoreNames.contains(DB_STORES[k])) db.createObjectStore(DB_STORES[k], { keyPath: "id" });
            });
          };
          req.onsuccess = () => {
            const db = req.result;
            /* 새 버전이 열리면 이 연결을 닫아 업그레이드를 막지 않습니다. */
            db.onversionchange = () => { try { db.close(); } catch (e) { /* 무시 */ } dbPromise = null; };
            res(db);
          };
          req.onerror = () => rej(req.error || new Error("IDB_OPEN_FAILED"));
          /* 이전 버전 창이 열려 있으면 그 창이 닫힐 때까지 기다립니다. (아래 시간 제한까지) */
          setTimeout(() => rej(new Error("IDB_TIMEOUT")), TIMEOUT.idbWrite);
        });
        /* 실패하면 다음 호출에서 다시 열 수 있게 비웁니다. */
        dbPromise.catch(() => { dbPromise = null; });
        return dbPromise;
      }

      /* 쓰기는 트랜잭션이 완료(oncomplete)되어야 성공으로 봅니다. durability: strict로 디스크 기록까지 기다립니다. */
      function idbAct(storeName, mode, fn) {
        return openDB().then(db => new Promise((res, rej) => {
          let tx;
          try { tx = mode === "readwrite" ? db.transaction(storeName, mode, { durability: "strict" }) : db.transaction(storeName, mode); }
          catch (e) { tx = db.transaction(storeName, mode); }
          const rq = fn(tx.objectStore(storeName));
          let result;
          rq.onsuccess = () => { result = rq.result; if (mode !== "readwrite") res(result); };
          rq.onerror = () => rej(rq.error || new Error("IDB_REQUEST_FAILED"));
          if (mode === "readwrite") {
            tx.oncomplete = () => res(result);
            tx.onabort = tx.onerror = () => rej(tx.error || new Error("IDB_TX_FAILED"));
          }
          setTimeout(() => rej(new Error("IDB_TIMEOUT")), mode === "readwrite" ? TIMEOUT.idbWrite : TIMEOUT.idb);
        }));
      }

      const ProjectDB = {
        async put(row) {
          try { await idbAct(DB_STORES.projects, "readwrite", st => st.put(row)); return true; }
          catch (e) { console.warn("프로젝트 사본 저장 실패", e); return false; }
        },
        async get(id) {
          try { return (await idbAct(DB_STORES.projects, "readonly", st => st.get(id))) || null; }
          catch (e) { return null; }
        },
        async all() {
          try { return (await idbAct(DB_STORES.projects, "readonly", st => st.getAll())) || []; }
          catch (e) { return []; }
        },
        remove(id) {
          return idbAct(DB_STORES.projects, "readwrite", st => st.delete(id)).catch(() => {});
        }
      };

        },
        async get(projectId, slot) {

            return row && row.dataUrl ? { dataUrl: row.dataUrl, sig: row.sig || "" } : null;
          } catch (e) { return null; }

        async loadAll(projectId) {

        },
        async remove(projectId, slot) {

          await Promise.all(targets.map(slot => ImageDB.remove(projectId, slot)));
        },
        removeProject(projectId) {
          IMAGE_SLOTS.forEach(slot => {

          });
        }

      /* =========================================================
         8. OpenAI 호출 — GPT-5.6 Terra / Image 2.5 Flare 고정
         파라미터 호환성 차이가 있을 때만 요청 옵션을 단계적으로 줄여 재시도합니다.
         ========================================================= */
      let activeController = null;

      function parseModelJson(text) {
        let t = String(text || "").trim();
        t = t.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
        try { return JSON.parse(t); } catch (e) { /* 구간 추출 재시도 */ }
        const starts = [t.indexOf("{"), t.indexOf("[")].filter(i => i >= 0);
        const first = starts.length ? Math.min.apply(null, starts) : -1;
        const last = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
        if (first >= 0 && last > first) {
          try { return JSON.parse(t.slice(first, last + 1)); } catch (e) { /* fallthrough */ }
        }
        throw new Error("AI 응답을 JSON으로 해석하지 못했습니다. 다시 시도해 주세요.");
      }

      function extractOutputText(data) {
        if (data && typeof data.output_text === "string" && data.output_text.trim()) return data.output_text;
        const out = (data && Array.isArray(data.output)) ? data.output : [];
        const parts = [];
        out.forEach(item => {
          if (item && Array.isArray(item.content)) {
            item.content.forEach(c => {
              if (c && typeof c.text === "string" && (c.type === "output_text" || c.type === "text")) parts.push(c.text);
            });
          }
        });
        return parts.join("\n");
      }

      function httpMessage(status, payload) {
        const detail = payload && payload.error && payload.error.message ? payload.error.message : "";
        if (status === 401 || status === 403) return "API 키가 유효하지 않거나 권한이 없습니다. 키를 다시 확인해 주세요.";
        if (status === 404) return `고정 모델을 찾을 수 없습니다. API 계정에서 GPT-5.6 Terra와 Image 2.5 Flare 사용 권한을 확인해 주세요.${detail ? " (" + detail + ")" : ""}`;
        if (status === 429) return "요청이 너무 많거나 사용 한도에 도달했습니다. 잠시 후 다시 시도해 주세요.";
        if (status === 400) return detail || "요청 형식이 거부되었습니다.";
        return `요청이 거부되었습니다 (상태 ${status}).${detail ? " " + detail : ""}`;
      }

      const NET_MSG = "네트워크 연결이 중간에 끊겼습니다 (Failed to fetch). 처리 중에는 화면을 켜 두고 다른 앱으로 전환하지 말아 주세요. Wi-Fi·데이터 연결을 확인한 뒤 다시 시도해 주세요.";

      /* fetch가 던지는 TypeError('Failed to fetch')를 원인 설명이 담긴 오류로 바꿉니다. */
      async function netFetch(url, opts) {
        try { return await fetch(url, opts); }
        catch (e) {
          if (e && e.name === "AbortError") throw e;
          const err = new Error(NET_MSG); err.network = true; throw err;
        }
      }

      const TIMEOUT = { textIdle: 120000, textTotal: 240000, image: 300000, fetchImage: 30000, idb: 6000, idbWrite: 20000 };
      /* 테스트용 재정의 지점 */
      if (window.__labTimeout) Object.assign(TIMEOUT, window.__labTimeout);
      const TIMEOUT_MSG = "AI 응답이 너무 오래 멈춰 있어 중단했습니다. 네트워크를 확인한 뒤 다시 시도해 주세요.";

      /* 지정 시간 동안 진행이 없으면 요청을 끊습니다. kick()을 부르면 시간이 다시 시작됩니다. */
      function watchdog(controller, ms) {
        let t = null;
        const kick = () => { clearTimeout(t); t = setTimeout(() => { controller.timedOut = true; controller.abort(); }, ms); };
        kick();
        return { kick, stop: () => clearTimeout(t) };
      }
      function abortError(controller) {
        if (controller && controller.timedOut) { const e = new Error(TIMEOUT_MSG); e.fatal = true; e.timeout = true; return e; }
        const e = new Error("__aborted__"); e.aborted = true; return e;
      }

      async function postJson(path, body, controller) {
        const res = await netFetch(CONFIG.API_BASE + path, {
          method: "POST",
          signal: controller.signal,
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${state.apiKey || ""}`
          },
          body: JSON.stringify(body)
        });
        let payload = null;
        try { payload = await res.json(); } catch (e) { payload = null; }
        if (!res.ok) {
          const err = new Error(httpMessage(res.status, payload));
          err.status = res.status;
          err.fatal = [401, 403, 404].includes(res.status);
          err.paramIssue = res.status === 400;
          throw err;
        }
        return payload;
      }

      /* 텍스트 분석 — Responses API 스트리밍.
         긴 응답을 한 번에 기다리면 그동안 연결에 데이터가 흐르지 않아
         모바일 망·브라우저가 연결을 끊고 'Failed to fetch'가 납니다.
         스트리밍으로 받으면 생성되는 동안 데이터가 계속 흘러 연결이 유지됩니다. */
      async function streamResponses(body, controller, kick) {
        kick = kick || (() => {});
        const res = await netFetch(CONFIG.API_BASE + "/responses", {
          method: "POST",
          signal: controller.signal,
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${state.apiKey || ""}` },
          body: JSON.stringify(Object.assign({}, body, { stream: true }))
        });
        if (!res.ok) {
          let payload = null;
          try { payload = await res.json(); } catch (e) { payload = null; }
          const err = new Error(httpMessage(res.status, payload));
          err.status = res.status;
          err.fatal = [401, 403, 404].includes(res.status);
          err.paramIssue = res.status === 400;
          throw err;
        }
        if (!res.body || typeof res.body.getReader !== "function" || typeof TextDecoder === "undefined") {
          const e = new Error("STREAM_UNSUPPORTED"); e.noStream = true; throw e;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "", text = "", final = null, failMsg = "";
        const handle = raw => {
          const data = raw.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trimStart()).join("\n");
          if (!data || data === "[DONE]") return;
          let ev;
          try { ev = JSON.parse(data); } catch (e) { return; }
          if (ev.type === "response.output_text.delta" && typeof ev.delta === "string") {
            text += ev.delta;
          } else if (ev.type === "response.completed" || ev.type === "response.incomplete") {
            final = ev.response || { status: ev.type === "response.incomplete" ? "incomplete" : "completed" };
          } else if (ev.type === "response.failed") {
            failMsg = (ev.response && ev.response.error && ev.response.error.message) || "AI 응답 생성에 실패했습니다. 다시 시도해 주세요.";
          } else if (ev.type === "error") {
            failMsg = ev.message || (ev.error && ev.error.message) || "AI 응답 중 오류가 발생했습니다. 다시 시도해 주세요.";
          }
        };
        try {
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            kick();
            buf += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");
            let k;
            while ((k = buf.indexOf("\n\n")) >= 0) { handle(buf.slice(0, k)); buf = buf.slice(k + 2); }
          }
          buf += decoder.decode().replace(/\r\n/g, "\n");
          if (buf.trim()) handle(buf);
        } catch (e) {
          if (e && e.name === "AbortError") throw e;
          const err = new Error(NET_MSG); err.network = true; throw err;
        }
        if (failMsg) throw new Error(failMsg);
        if (final && final.status === "incomplete") {
          const e = new Error("응답이 최대 길이에 도달해 잘렸습니다. 선택 항목을 줄이거나 다시 시도해 주세요."); e.fatal = true; throw e;
        }
        if (!text.trim() && final) text = extractOutputText(final);
        if (!final && text) {
          /* 완료 신호 없이 스트림이 끝났다면 연결이 중간에 끊긴 것입니다. */
          const err = new Error(NET_MSG); err.network = true; throw err;
        }
        return text;
      }

      /* 텍스트 분석 — 스트리밍을 기본으로, 지원되지 않으면 일반 요청으로 전환합니다.
         모델별 파라미터 지원 차이도 단계적으로 흡수합니다. */
      async function callText(systemPrompt, userPrompt, maxTokens) {
        const cap = maxTokens || 16000;
        const controller = new AbortController();
        activeController = controller;

        const input = [
          { role: "system", content: systemPrompt },
          { role: "user", content: userPrompt }
        ];
        const fmt = { format: { type: "json_object" } };
        const variants = [
          { model: FIXED_TEXT_MODEL, input, text: fmt, max_output_tokens: cap, reasoning: { effort: "low" } },
          { model: FIXED_TEXT_MODEL, input, text: fmt, max_output_tokens: cap },
          { model: FIXED_TEXT_MODEL, input, text: fmt },
          { model: FIXED_TEXT_MODEL, input }
        ];

        const delays = [1500, 4000];
        let lastError = "알 수 없는 오류가 발생했습니다.";
        let vi = 0;
        let attempt = 0;
        let useStream = true;

        while (vi < variants.length) {
          const wd = watchdog(controller, useStream ? TIMEOUT.textIdle : TIMEOUT.textTotal);
          try {
            let text;
            if (useStream) {
              text = await streamResponses(variants[vi], controller, wd.kick);
            } else {
              const data = await postJson("/responses", variants[vi], controller);
              if (data && data.status === "incomplete") {
                const e = new Error("응답이 최대 길이에 도달해 잘렸습니다. 선택 항목을 줄이거나 다시 시도해 주세요."); e.fatal = true; throw e;
              }
              text = extractOutputText(data);
            }
            if (!text || !text.trim()) throw new Error("AI가 빈 응답을 반환했습니다. 다시 시도해 주세요.");
            wd.stop();
            return parseModelJson(text);
          } catch (err) {
            wd.stop();
            if (err.name === "AbortError" || controller.signal.aborted) throw abortError(controller);
            if (err.noStream) { useStream = false; continue; }
            lastError = err.message;
            if (err.fatal) break;
            if (err.paramIssue) {
              vi += 1; attempt = 0;
              /* 모든 변형이 거부되면 스트리밍 자체가 원인일 수 있어 일반 요청으로 한 번 더 돕니다. */
              if (vi >= variants.length && useStream) { useStream = false; vi = 0; }
              continue;
            }
            if (attempt >= delays.length) break;
            await new Promise(r => setTimeout(r, delays[attempt]));
            attempt += 1;
          }
        }
        throw new Error(lastError);
      }

      /* URL로 받은 이미지는 만료되므로 가능하면 data URL로 바꿔 저장합니다. */
      async function toDataUrl(url) {
        const ctl = new AbortController();
        const wd = watchdog(ctl, TIMEOUT.fetchImage);
        try {
          const res = await fetch(url, { signal: ctl.signal });
          if (!res.ok) return url;
          const blob = await res.blob();
          return await new Promise(resolve => {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.onerror = () => resolve(url);
            r.readAsDataURL(blob);
          });
        } catch (e) { return url; } finally { wd.stop(); }
      }

      function dataUrlToBlob(dataUrl) {
        const m = /^data:([^;,]+)?(;base64)?,(.*)$/.exec(dataUrl || "");
        if (!m) return null;
        const type = m[1] || "image/png";
        if (!m[2]) return new Blob([decodeURIComponent(m[3])], { type });
        const bin = atob(m[3]);
        const u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        return new Blob([u8], { type });
      }

      const REF_BOARD_NOTE = "Reference image attached: it is board 1 (rows 01–04) of the same two-board set. Create board 2 (rows 05–08) that matches the reference exactly — same layout grid, column widths, row heights, margins, typography (font family, weights, sizes, colours), label positions, panel shape and size, panel colours, background, divider lines, rendering style and lighting. Copy only the design; the row content below is new.\n\n";

      /* 기준 이미지(01–04 보드)를 함께 보내 같은 디자인으로 그립니다.
         편집 API가 거부되거나 실패하면 같은 프롬프트로 일반 생성합니다. */
      async function callImageWithRef(prompt, refDataUrl) {
        const blob = refDataUrl && String(refDataUrl).startsWith("data:") ? dataUrlToBlob(refDataUrl) : null;
        if (!blob) return callImage(prompt);
        const controller = new AbortController();
        activeController = controller;
        const variants = [{ size: CONFIG.IMAGE_SIZE, quality: state.quality }, { size: CONFIG.IMAGE_SIZE }, {}];
        for (const v of variants) {
          const fd = new FormData();
          fd.append("model", FIXED_IMAGE_MODEL);
          fd.append("prompt", REF_BOARD_NOTE + prompt);
          fd.append("image", blob, "board-01-04.png");
          Object.keys(v).forEach(k => fd.append(k, v[k]));
          let res;
          const wd = watchdog(controller, TIMEOUT.image);
          try {
            res = await netFetch(CONFIG.API_BASE + "/images/edits", {
              method: "POST",
              signal: controller.signal,
              headers: { "Authorization": `Bearer ${state.apiKey || ""}` },
              body: fd
            });
          } catch (e) {
            wd.stop();
            if (e && e.name === "AbortError") throw abortError(controller);
            break;
          }
          let payload = null;
          try { payload = await res.json(); } catch (e) { payload = null; }
          wd.stop();
          if (controller.signal.aborted) throw abortError(controller);
          if (res.ok) {
            const first = payload && Array.isArray(payload.data) ? payload.data[0] : null;
            if (first && first.b64_json) return `data:image/png;base64,${first.b64_json}`;
            if (first && first.url) return await toDataUrl(first.url);
            break;
          }
          if (res.status === 401 || res.status === 403) throw new Error(httpMessage(res.status, payload));
          if (res.status !== 400) break;
        }
        return callImage(prompt);
      }

      /* 이미지 생성 — Images API. 통합 이미지 한 장만 생성합니다. */
      async function callImage(prompt) {
        const controller = new AbortController();
        activeController = controller;

        const variants = [
          { model: FIXED_IMAGE_MODEL, prompt, size: CONFIG.IMAGE_SIZE, quality: state.quality },
          { model: FIXED_IMAGE_MODEL, prompt, size: CONFIG.IMAGE_SIZE },
          { model: FIXED_IMAGE_MODEL, prompt }
        ];
        const delays = [1200, 3000];
        let lastError = "이미지를 생성하지 못했습니다.";
        let vi = 0;
        let attempt = 0;

        while (vi < variants.length) {
          const wd = watchdog(controller, TIMEOUT.image);
          try {
            const data = await postJson("/images/generations", variants[vi], controller);
            wd.stop();
            const first = data && Array.isArray(data.data) ? data.data[0] : null;
            if (first && first.b64_json) return `data:image/png;base64,${first.b64_json}`;
            if (first && first.url) return await toDataUrl(first.url);
            throw new Error("이미지 응답이 비어 있습니다. 다시 시도해 주세요.");
          } catch (err) {
            wd.stop();
            if (err.name === "AbortError" || controller.signal.aborted) throw abortError(controller);
            lastError = err.message;
            if (err.fatal) break;
            if (err.paramIssue) { vi += 1; attempt = 0; continue; }
            if (attempt >= delays.length) break;
            await new Promise(r => setTimeout(r, delays[attempt]));
            attempt += 1;
          }
        }
        throw new Error(lastError);
      }

      let loadingHold = null;
      async function withLoading(msg, fn) {
        /* 여러 요청을 하나의 작업으로 보여 줄 때는 고정 문구를 쓰고 중간에 로딩 화면을 닫지 않습니다. */
        if (loadingHold) msg = loadingHold;
        setState({ isAnalyzing: true, loadingMsg: msg, errorMsg: null });
        let wake = null;
        try { if (navigator.wakeLock && navigator.wakeLock.request) wake = await navigator.wakeLock.request("screen"); } catch (e) { wake = null; }
        try {
          const out = await fn();
          if (!loadingHold) setState({ isAnalyzing: false });
          return out;
        } catch (err) {
          if (err && err.aborted) { setState({ isAnalyzing: false }); toast("작업을 취소했습니다."); return null; }
          console.error(err);
          setState({ isAnalyzing: false, errorMsg: err.message || "처리에 실패했습니다." });
          return null;
        } finally {
          activeController = null;
          if (wake) { try { await wake.release(); } catch (e) { /* 무시 */ } }
        }
      }

      /* =========================================================
         9. 응답 정규화 — 필드가 빠져도 화면이 죽지 않도록 방어
         ========================================================= */
      const str = v => (typeof v === "string" ? v.trim() : (v === null || v === undefined ? "" : String(v)));
      const arr = v => (Array.isArray(v) ? v : []);

      /* AI가 스타일 이름을 조금 다르게 적어도 가장 가까운 것으로 맞춥니다. */
      function matchStyle(raw, i) {
        const want = str(raw).toLowerCase();
        if (want) {
          const exact = STYLE_NAMES.find(n => n.toLowerCase() === want);
          if (exact) return exact;
          const partial = STYLE_NAMES.find(n => n.toLowerCase().includes(want) || want.includes(n.toLowerCase()));
          if (partial) return partial;
        }
        return STYLE_NAMES[i % STYLE_NAMES.length];
      }

      function clampValue(raw, level) {
        const n = Number(raw);
        if (Number.isFinite(n)) return Math.max(2, Math.min(98, Math.round(n)));
        const map = { "낮음": 22, "중간": 55, "높음": 84 };
        return map[str(level)] || 55;
      }
      function levelFromValue(v) { return v < 38 ? "낮음" : (v > 68 ? "높음" : "중간"); }

      function normAssociations(raw) {
        return arr(raw && raw.associations).slice(0, 6).map(a => ({
          word: str(a && a.word),
          objects: arr(a && a.objects).map(str).filter(Boolean).slice(0, 5),
          sensory: str(a && a.sensory)
        })).filter(a => a.word);
      }

      function normConcepts(raw) {
        return arr(raw && raw.concepts).slice(0, 3).map((c, i) => ({
          id: uid("cpt"),
          index: i + 1,
          nameKo: str(c.nameKo) || `해석 ${i + 1}`,
          nameEn: str(c.nameEn) || `Concept ${i + 1}`,
          definition: str(c.definition) || NO_DATA,
          moodWords: arr(c.moodWords).map(str).filter(Boolean).slice(0, 6),
          experience: str(c.experience),
          anchor: str(c.anchor),
          visualAnchor: str(c.visualAnchor),
          subject: str(c.subject),
          visual: str(c.visual) || str(c.subject) || "an abstract still life on a neutral background",
          label: str(c.label) || str(c.nameEn) || `Concept ${i + 1}`,
          labelKo: str(c.labelKo) || str(c.nameKo),
          style: matchStyle(c.style, i)
        }));
      }

      function normPerceptions(raw) {
        return arr(raw && raw.perceptions).slice(0, 10).map((p, i) => ({
          id: uid("prc"),
          index: i + 1,
          category: str(p.category) || "지각",
          titleKo: str(p.titleKo) || `지각 특성 ${i + 1}`,
          titleEn: str(p.titleEn) || `Perception ${i + 1}`,
          description: str(p.description) || NO_DATA,
          cue: str(p.cue),
          visual: str(p.visual) || "a single object on a neutral background",
          label: str(p.label) || str(p.titleEn) || `Perception ${i + 1}`,
          labelKo: str(p.labelKo) || str(p.titleKo),
          style: matchStyle(p.style, i)
        }));
      }

      function normProperties(raw) {
        const levels = ["낮음", "중간", "높음"];
        return arr(raw && raw.properties).slice(0, 14).map((p, i) => ({
          id: uid("prp"),
          index: i + 1,
          axis: str(p.axis) || "물성",
          titleKo: str(p.titleKo) || `물성 ${i + 1}`,
          titleEn: str(p.titleEn) || `Property ${i + 1}`,
          description: str(p.description) || NO_DATA,
          check: str(p.check),
          interactionHint: str(p.interactionHint),
          motionSpec: str(p.motionSpec),
          graphicSpec: str(p.graphicSpec),
          value: clampValue(p.value, p.level),
          level: levels.includes(str(p.level)) ? str(p.level) : levelFromValue(clampValue(p.value, p.level)),
          visual: str(p.visual) || "a clean interaction study showing deformation, motion, resistance, recovery, optical feedback or haptic-like response",
          label: str(p.label) || str(p.titleEn) || `Property ${i + 1}`,
          labelKo: str(p.labelKo) || str(p.titleKo)
        }));
      }

      function normPlan(raw) {
        const picked = [];
        arr(raw && raw.selectedElements).forEach(v => {
          const n = parseInt(v, 10);
          if (n >= 1 && n <= 8 && !picked.includes(n)) picked.push(n);
        });
        LG_DEFAULT_ORDER.forEach(n => { if (picked.length < INTERACTION_COUNT && !picked.includes(n)) picked.push(n); });
        const ms = (raw && raw.materialSystem) || {};
        return {
          elements: picked.slice(0, INTERACTION_COUNT),
          materialSystem: {
            nameKo: str(ms.nameKo), nameEn: str(ms.nameEn), surface: str(ms.surface),
            core: arr(ms.core).map(str).filter(Boolean).slice(0, 5),
            exaggeration: str(ms.exaggeration), whyKo: str(ms.whyKo)
          }
        };
      }

      function normInteractions(raw) {
        const source = arr(raw && (raw.interactions || raw.materials));
        return source.slice(0, INTERACTION_COUNT).map((m, i) => ({
          id: uid("int"),
          index: i + 1,
          element: Math.max(0, Math.min(8, parseInt(m.element, 10) || 0)),
          frame: str(m.frame),
          nameKo: str(m.nameKo) || `인터랙션 ${i + 1}`,
          nameEn: str(m.nameEn) || `Interaction ${i + 1}`,
          type: str(m.type) || `Interaction Concept ${i + 1}`,
          digitalPattern: str(m.digitalPattern),
          physicalBasis: str(m.physicalBasis),
          phoneContext: str(m.phoneContext),
          gesture: str(m.gesture),
          role: str(m.role) || NO_DATA,
          themedObject: str(m.themedObject),
          glyph: str(m.glyph),
          func: str(m.function || m.func),
          inputToOutcome: str(m.inputToOutcome),
          graphic: str(m.graphic),
          params: arr(m.params).map(str).filter(Boolean).slice(0, 8),
          interactionDNA: str(m.interactionDNA) || NO_DATA,
          rest: str(m.rest),
          acknowledge: str(m.acknowledge),
          resistance: str(m.resistance),
          transition: str(m.transition),
          settle: str(m.settle),
          behavior: str(m.behavior),
          timing: str(m.timing) || NO_DATA,
          haptic: str(m.haptic) || "없음",
          visualBehavior: str(m.visualBehavior) || NO_DATA,
          propertyTranslation: arr(m.propertyTranslation).map(x => ({
            property: str(x && x.property),
            value: Number.isFinite(Number(x && x.value)) && str(x && x.value) !== "" ? Math.round(Number(x.value)) : "",
            effect: str(x && x.effect)
          })).filter(x => x.property && x.effect).slice(0, 4),
          propertyMapping: (arr(m.propertyMapping).length ? arr(m.propertyMapping) : arr(m.propertyTranslation).map(x => x && x.property)).map(str).filter(Boolean).slice(0, 4),
          emotionalEffect: str(m.emotionalEffect) || NO_DATA,
          states: [0, 1, 2].map(j => arr(m.states)[j] || null).map((x, j) => ({
            labelKo: str(x && x.labelKo) || ["시작", "입력 중", "안착"][j],
            labelEn: str(x && x.labelEn) || ["Rest", "Acknowledge", "Settle"][j],
            description: str(x && x.description) || str([m.rest, m.transition, m.settle][j]) || (j === 1 ? str(m.behavior) : "")
          })),
          visual: str(m.visual) || "clean smartphone UI component study showing three sequential states of the same control with clear motion and deformation cues"
        }));
      }

      /* =========================================================
         10. 단계 이동 규칙 — 데이터가 준비된 단계까지만 이동
         ========================================================= */
      function stepReady(n) {
        switch (n) {
          case 1: return true;
          case 2: return state.concepts.length > 0;
          case 3: return state.perceptions.length > 0;
          case 4: return state.properties.length > 0;
          case 5: return state.interactions.length > 0;
          default: return false;
        }
      }

      /* =========================================================
         11. 자동 저장
         ========================================================= */
      /* 홈(step 0)은 탐색 화면일 뿐 프로젝트 진행 단계가 아닙니다.
         저장 시 화면 위치가 아니라 실제 생성된 데이터의 가장 깊은 단계를 기록합니다. */
      function progressStep() {
        if (state.interactions.length) return 5;
        if (state.properties.length) return 4;
        if (state.perceptions.length) return 3;
        if (state.concepts.length) return 2;
        return 1;
      }

      function snapshot() {
        return {
          projectId: state.projectId,
          keyword: state.keyword,
          note: state.note,
          associations: state.associations,
          concepts: state.concepts,
          conceptIds: state.conceptIds,
          perceptions: state.perceptions,
          perceptionIds: state.perceptionIds,
          properties: state.properties,
          propertyIds: state.propertyIds,
          interactions: state.interactions,
          interactionPlan: state.interactionPlan,
          interactionMode: state.interactionMode,
          interactionsMode: state.interactionsMode,
          createdAt: state.createdAt,
          step: progressStep()
        };
      }

      function hasContent() {
        return !!(state.keyword || state.concepts.length || state.perceptions.length ||
          state.properties.length || state.interactions.length);
      }

      function projectTitle() {
        const c = selectedConcept();
        if (state.keyword && c) return `${state.keyword} · ${c.nameKo}`;
        if (state.keyword) return state.keyword;
        return "이름 없는 프로젝트";
      }

      let quotaWarned = false;
      let lastSavedSig = "";
      let knownRev = 0;   /* 이 창이 마지막으로 읽거나 저장한 저장 번호(rev) */
      const currentSig = () => JSON.stringify(snapshot()) + "|" + projectTitle();

      function persist(showToast) {
        if (!hasContent()) return "empty";
        const snap = snapshot();
        const title = projectTitle();
        const sig = JSON.stringify(snap) + "|" + title;
        if (sig === lastSavedSig && !showToast) return "ok";
        const r = Store.save(snap, { id: state.projectId, title, baseRev: knownRev });
        if (r.conflict) {
          /* 다른 창이 이 프로젝트를 더 최근에 저장했습니다. 오래된 화면으로 덮어쓰지 않고 최신 상태를 불러옵니다. */
          adoptRow(r.row, "다른 창에서 수정된 최신 상태를 불러왔습니다. 이 창의 마지막 변경은 반영되지 않았습니다.");
          return "remote";
        }
        if (r.row) knownRev = r.row.rev;
        if (r.ok) {
          lastSavedSig = sig;
          if (showToast) toast("진행 상태를 저장했습니다.");
          if (r.pruned === "oldest") toast("저장 공간이 부족해 가장 오래된 프로젝트를 정리했습니다.");
          return "ok";
        }
        if (r.idbOnly) lastSavedSig = sig;
        if (!quotaWarned) {
          quotaWarned = true;
          toast("저장 공간이 부족해 자동 저장이 중단되었습니다. 리포트를 파일로 내려받아 주세요.", "error");
        }
        return "full";
      }

      /* 저장된 행(row)의 데이터를 화면 상태로 옮깁니다. */
      function applyProjectData(row) {
        const d = row.data || {};
        Object.assign(state, blankProject(), {
          projectId: d.projectId || row.id,
          keyword: d.keyword || "",
          note: d.note || "",
          associations: arr(d.associations),
          concepts: arr(d.concepts),
          conceptIds: arr(d.conceptIds).length ? arr(d.conceptIds) : (d.conceptId ? [d.conceptId] : []),
          perceptions: arr(d.perceptions),
          perceptionIds: arr(d.perceptionIds),
          properties: arr(d.properties),
          propertyIds: arr(d.propertyIds),
          interactions: arr(d.interactions || d.materials),
          interactionPlan: d.interactionPlan && arr(d.interactionPlan.elements).length ? d.interactionPlan : null,
          interactionMode: d.interactionMode === "physical" ? "physical" : "digital",
          /* 이전 버전 프로젝트는 디지털 패턴 항목 유무로 생성 방식을 판단합니다. */
          interactionsMode: d.interactionsMode || (arr(d.interactions).some(m => m && m.digitalPattern) ? "digital" : "physical"),
          createdAt: d.createdAt || row.savedAt
        });
        drafts["keyword-input"] = state.keyword;
        drafts["note-input"] = state.note;
        knownRev = row.rev || 0;
        lastSavedSig = currentSig();
      }

      /* IndexedDB에서 이 프로젝트의 이미지와 서명을 읽어 옵니다. 데이터가 없는 단계의 이미지는 정리합니다. */
      async function loadImagesFor(projectId) {
        const got = await ImageDB.loadAll(projectId);
        if (state.projectId !== projectId) return;
        const imgs = got.images;
        const orphanSlots = [];
        if (!state.concepts.length && imgs.emotion) orphanSlots.push("emotion");
        if (!state.perceptions.length && imgs.perception) orphanSlots.push("perception");
        if (!state.properties.length && imgs.property) orphanSlots.push("property");
        if (!state.interactions.length && imgs.interaction) orphanSlots.push("interaction");
        if (state.interactions.length <= INTERACTION_COUNT && imgs.interactionB) orphanSlots.push("interactionB");
        orphanSlots.forEach(slot => { imgs[slot] = null; delete got.sigs[slot]; });
        if (orphanSlots.length) await ImageDB.removeSlots(projectId, orphanSlots);
        if (state.projectId !== projectId) return;
        setState({
          images: Object.assign({ emotion: null, perception: null, property: null, interaction: null, interactionB: null }, imgs),
          imageSigs: got.sigs
        });
      }

      /* 다른 창이 저장한 최신 상태로 이 창을 갱신합니다. 보고 있던 단계는 가능한 한 유지합니다. */
      function adoptRow(row, msg) {
        const keepStep = state.step;
        const keep = { lightbox: null, simPrompt: null, editTarget: state.editTarget };
        applyProjectData(row);
        const step = keepStep <= 0 ? keepStep : Math.min(keepStep, progressStep());
        setState(Object.assign(keep, { step }));
        loadImagesFor(state.projectId);
        if (msg) toast(msg);
      }

      /* =========================================================
         12. 렌더 헬퍼 — 카드/버튼/이미지의 형식을 한곳에서 통일
         ========================================================= */
      function header(title, backStep) {
        const cur = STAGES.find(s => s.n === state.step);
        const nextN = state.step + 1;
        const showNext = STAGES.some(s => s.n === nextN) && stepReady(nextN);
        const pct = cur ? Math.round((cur.n / STAGES.length) * 100) : 0;
        return `
        <header class="fixed top-0 left-0 right-0 z-50 bg-white max-w-[430px] mx-auto">
          <div class="px-3 h-14 flex items-center justify-between gap-1">
            <div class="flex items-center gap-1 overflow-hidden flex-1 min-w-0">
              ${backStep !== undefined ? `<button type="button" aria-label="이전 단계로" onclick="setState({step:${backStep}}, true)" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-700 flex-shrink-0"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>` : ""}
              <h1 class="t-h3 truncate text-slate-900">${esc(title)}</h1>
            </div>
            <div class="flex items-center gap-0.5 flex-shrink-0 text-slate-700">
              ${showNext ? `<button type="button" aria-label="다음 단계로" onclick="setState({step:${nextN}}, true)" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-900"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>` : ""}
              <button type="button" aria-label="진행 상태 저장" onclick="Actions.saveNow()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="save" class="w-6 h-6"></i></button>
              <button type="button" aria-label="리포트 복사" onclick="Actions.copyReport()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="copy" class="w-6 h-6"></i></button>
              <button type="button" aria-label="처음 화면으로" onclick="Actions.goHome()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="home" class="w-6 h-6"></i></button>
            </div>
          </div>
          ${cur ? `<div class="px-4 pb-2 flex items-center gap-3">
            <div class="h-2 bg-slate-300 rounded-full flex-1 overflow-hidden"><div class="h-full bg-blue-700 rounded-full transition-all" style="width:${pct}%"></div></div>
            <span class="t-meta font-bold text-slate-600 tabular-nums flex-shrink-0">${cur.n} / ${STAGES.length} · ${esc(cur.label)}</span>
          </div>` : ""}
        </header>`;
      }

      function dock(inner) {
        return `<div class="fixed bottom-0 left-0 right-0 px-5 pt-5 dock bg-white max-w-[430px] mx-auto z-[60]">${inner}</div>`;
      }

      function primaryBtn(label, onclick, disabled) {
        return `<button type="button" ${disabled ? "disabled" : ""} onclick="${onclick}"
          class="w-full py-5 rounded-2xl font-bold t-h3 text-white bg-slate-900 hover:bg-slate-800 disabled:bg-slate-200 disabled:text-slate-500 disabled:shadow-none shadow-lg active:scale-[0.98] disabled:active:scale-100 transition-all">${esc(label)}</button>`;
      }

      function secondaryBtn(label, onclick, icon) {
        return `<button type="button" onclick="${onclick}"
          class="w-full py-4 rounded-2xl font-bold t-small text-slate-700 bg-white border-2 border-slate-200 hover:bg-slate-50 active:scale-[0.98] transition-all flex items-center justify-center gap-2">${icon ? `<i data-lucide="${icon}" class="w-5 h-5"></i>` : ""}${esc(label)}</button>`;
      }

      function ghostBtn(label, onclick, icon) {
        return `<button type="button" onclick="${onclick}"
          class="px-4 py-2.5 rounded-xl font-bold t-meta text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 transition-all inline-flex items-center gap-1.5">${icon ? `<i data-lucide="${icon}" class="w-4 h-4"></i>` : ""}${esc(label)}</button>`;
      }

      /* 모든 선택 카드는 테두리·체크 표시·선택 상태를 동일한 형식으로 씁니다. */
      function optionCard(opts) {
        const on = !!opts.selected;
        const badge = opts.badge
          ? `<span class="t-meta font-bold px-3 py-1.5 rounded-xl flex-shrink-0 whitespace-nowrap ${on ? "bg-blue-100 text-blue-800" : "bg-slate-200 text-slate-700"}">${esc(opts.badge)}</span>`
          : "";
        return `<button type="button" onclick="${opts.onclick}" aria-pressed="${on}"
          class="w-full text-left p-5 rounded-[2rem] border-2 transition-all bg-white ${on ? "border-blue-700 shadow-lg ring-2 ring-blue-700/15" : "border-slate-200 hover:border-blue-300 shadow-md"}">
          <div class="flex items-start gap-3 mb-3">
            <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 font-bold t-meta tabular-nums ${on ? "bg-blue-700 text-white" : "bg-slate-200 text-slate-700"}">${on ? '<i data-lucide="check" class="w-5 h-5"></i>' : esc(pad2(opts.index))}</span>
            <div class="min-w-0 flex-1">
              <h3 class="t-h3 text-slate-900 leading-snug">${esc(opts.title)}</h3>
              ${opts.subtitle ? `<p class="t-meta text-slate-500">${esc(opts.subtitle)}</p>` : ""}
            </div>
            ${badge}
          </div>
          <div class="space-y-2">${opts.body || ""}</div>
        </button>`;
      }

      function chip(text, tone) {
        const cls = tone === "blue"
          ? "bg-blue-50 text-blue-800 border-blue-200"
          : "bg-slate-100 text-slate-700 border-slate-200";
        return `<span class="inline-block t-meta px-2.5 py-1 rounded-lg border ${cls}">${esc(text)}</span>`;
      }

      /* 화면 표시용 이미지 주소 — 수 MB의 data URL을 렌더마다 HTML에 넣으면 휴대폰에서 매우 느려지므로
         한 번만 Blob URL로 바꿔 재사용합니다. 저장·PDF·다운로드는 원본 data URL을 그대로 씁니다. */
      const viewUrlCache = {};
      function viewUrl(slot) {
        const d = state.images ? state.images[slot] : null;
        const hit = viewUrlCache[slot];
        if (!d) { if (hit) { URL.revokeObjectURL(hit.url); delete viewUrlCache[slot]; } return null; }
        if (!String(d).startsWith("data:") || !window.URL || !URL.createObjectURL) return d;
        if (hit && hit.src === d) return hit.url;
        if (hit) URL.revokeObjectURL(hit.url);
        try {
          const blob = dataUrlToBlob(d);
          if (!blob) return d;
          const url = URL.createObjectURL(blob);
          viewUrlCache[slot] = { src: d, url };
          return url;
        } catch (e) { return d; }
      }

      /* 이미지 서명 — 이미지를 만들 때 쓴 항목 내용을 짧게 요약한 값입니다.
         지금 내용과 서명이 다르면 수정 뒤 아직 갱신되지 않은 이미지입니다. */
      function hashStr(str) {
        let h = 5381;
        for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
        return (h >>> 0).toString(36) + "." + str.length.toString(36);
      }
      function boardItems(slot) {
        const all = state.interactions;
        if (slot === "interaction") return all.length > INTERACTION_COUNT ? all.slice(0, 4) : all;
        return all.length > INTERACTION_COUNT ? all.slice(4, 8) : [];
      }
      function imageSig(slot) {
        let items;
        if (slot === "emotion") items = state.concepts.map(c => [c.nameKo, c.nameEn, c.visual, c.style, c.anchor, c.visualAnchor]);
        else if (slot === "perception") items = state.perceptions.map(p => [p.titleKo, p.titleEn, p.category, p.visual, p.style]);
        else if (slot === "property") items = state.properties.map(p => [p.titleKo, p.titleEn, p.axis, p.visual, p.interactionHint]);
        else items = boardItems(slot).map(m => [m.nameKo, m.nameEn, m.type, m.frame, m.visual, (m.states || []).map(x => x.labelKo + x.description).join("|")]);
        return hashStr(JSON.stringify(items));
      }
      /* 서명이 없는 이전 버전 이미지는 판단할 수 없으므로 최신으로 간주합니다. */
      function imageStale(slot) {
        const sig = state.imageSigs && state.imageSigs[slot];
        return !!(state.images && state.images[slot] && sig && sig !== imageSig(slot));
      }

      /* 단계별 통합 이미지 카드 */
      function imageCard(slot, opts) {
        const url = viewUrl(slot);
        const stale = imageStale(slot);
        const smallBtn = "inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 t-meta font-bold hover:bg-slate-50 active:scale-[0.98] transition-all";
        const saveBtn = url
          ? `<button type="button" onclick="Actions.downloadImage('${slot}')" class="${smallBtn} flex-shrink-0"><i data-lucide="download" class="w-4 h-4"></i>저장</button>`
          : "";
        /* 이미지가 없거나(생성 실패·중단) 수정 전 이미지일 때만 만들기 버튼을 보여 줍니다. */
        const makeBtn = label => opts.onGenerate
          ? `<button type="button" onclick="${opts.onGenerate}" class="${smallBtn} mt-3"><i data-lucide="image-plus" class="w-4 h-4"></i>${label}</button>`
          : "";
        const inner = url
          ? `<button type="button" onclick="Actions.openLightbox('${slot}')" class="block w-full">
               <img src="${escAttr(url)}" alt="${escAttr(opts.alt || "생성된 통합 이미지")}" class="w-full rounded-2xl bg-slate-100" />
             </button>`
          : `<div class="w-full rounded-2xl bg-slate-100 border-2 border-dashed border-slate-300 px-5 py-10 text-center">
               <i data-lucide="image" class="w-10 h-10 text-slate-400 mx-auto mb-3"></i>
               <p class="t-small text-slate-600">${esc(opts.empty || "아직 이미지를 생성하지 않았습니다.")}</p>
               ${makeBtn("이미지 만들기")}
             </div>`;
        return `<section class="bg-white rounded-[2rem] p-4 border-2 border-slate-200 shadow-md mb-6">
          <div class="flex items-center justify-between gap-3 mb-3 px-1">
            <h3 class="t-label text-slate-500 min-w-0">${esc(opts.title)}</h3>
            ${saveBtn}
          </div>
          ${stale ? `<div class="bg-amber-50 border-2 border-amber-300 text-amber-900 rounded-2xl px-4 py-3 mb-3" role="note">
            <div class="flex items-start gap-2">
              <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-1"></i>
              <p class="t-meta prose-ko">내용을 수정하기 전에 만든 이미지입니다. 수정된 내용이 아직 반영되지 않았습니다.</p>
            </div>
            ${makeBtn("이미지 새로 만들기")}
          </div>` : ""}
          ${inner}
        </section>`;
      }

      function instructionBox(stage, placeholder) {
        const def = EDIT_STAGES[stage];
        const id = def.insId;
        const list = def.list();
        const t = editTargetOf(stage);
        const chipCls = on => `min-w-[52px] px-3 py-2 rounded-xl t-meta font-bold border transition-all active:scale-95 ${on ? "bg-blue-50 border-blue-600 text-blue-800" : "bg-white border-slate-300 text-slate-600 hover:bg-slate-50"}`;
        const chips = list.map((it, i) => `<button type="button" onclick="Actions.setEditTarget('${stage}', ${i})" aria-pressed="${t === i}" class="${chipCls(t === i)}">${pad2(i + 1)}</button>`).join("")
          + `<button type="button" onclick="Actions.setEditTarget('${stage}', 'all')" aria-pressed="${t === "all"}" class="${chipCls(t === "all")}">전체</button>`;
        const picked = t === "all" ? `전체 ${list.length}개를 다시 생성합니다` : (list[t] ? `${pad2(t + 1)} · ${def.title(list[t])}` : "");
        return `<section class="p-5 bg-slate-50 border-2 border-slate-200 rounded-3xl mt-8">
          <h3 class="t-label text-slate-500 mb-3">수정 지시</h3>
          <p class="t-meta font-bold text-slate-600 mb-2">수정할 항목</p>
          <div class="flex flex-wrap gap-2 mb-2" role="group" aria-label="수정할 항목 선택">${chips}</div>
          <p class="t-meta text-slate-700 mb-3 prose-ko">${esc(picked)}</p>
          <label for="${id}" class="sr-only">수정 지시 입력</label>
          <textarea id="${id}" rows="3" oninput="setDraft('${id}', this.value)"
            class="w-full block min-w-0 bg-white border border-slate-300 rounded-xl px-4 py-3.5 text-slate-800 t-small outline-none resize-none placeholder:text-slate-400 focus:border-blue-500 mb-3"
            placeholder="${escAttr(placeholder)}">${esc(draft(id))}</textarea>
          <button type="button" onclick="Actions.reviseStage('${stage}')"
            class="w-full py-4 rounded-xl bg-white border-2 border-slate-300 text-slate-700 hover:bg-slate-100 font-bold t-small flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
            <i data-lucide="send" class="w-5 h-5"></i>${t === "all" ? "지시대로 전체 다시 생성" : `${pad2(t + 1)}번 항목만 수정`}
          </button>
        </section>`;
      }

      /* 각 단계 상단 — 앞 단계에서 무엇을 골랐는지 그대로 보여 줍니다. */
      function priorChoice(rows) {
        const list = rows.filter(r => r && r.value);
        if (!list.length) return "";
        return `<section class="bg-white border-2 border-slate-200 rounded-[1.5rem] px-5 py-4 mb-6 shadow-sm">
          ${list.map(r => `<div class="py-1 border-t border-slate-100 first:border-t-0 first:pt-0">
            <span class="t-meta font-bold text-slate-500">${esc(r.label)}</span>
            <p class="t-small text-slate-800 prose-ko">${esc(r.value)}</p>
          </div>`).join("")}
        </section>`;
      }

      function joinTitles(items, key) {
        return items.map((it, i) => `${pad2(i + 1)} ${it[key]}`).join("   ");
      }

      function sectionTitle(text, sub) {
        return `<h2 class="t-h1 text-slate-900 mb-2">${esc(text)}</h2>
          ${sub ? `<p class="t-small text-slate-600 mb-6 prose-ko">${esc(sub)}</p>` : `<div class="mb-6"></div>`}`;
      }

      /* =========================================================
         13. 리포트
         ========================================================= */
      function buildReport() {
        const L = [];
        const line = "==================================================";
        L.push(line, "   감성 · 지각 · 물성 · 인터렉션 랩 · 종합 리포트", line, "");
        L.push("[감성 키워드]", `- ${state.keyword || "설정된 키워드 없음"}`);
        L.push(`- 감성 해석 방식: ${EMOTION_METHOD.label} (${EMOTION_METHOD.en})`);
        if (state.note) L.push(`- 연관 과제: ${state.note}`);
        L.push("");

        if (state.concepts.length) {
          L.push(line, " 1. 감성 해석", line);
          if (state.associations.length) {
            L.push("", "[사람들이 먼저 떠올리는 연상]");
            state.associations.forEach(a => L.push(`- ${a.word}: ${a.objects.join(", ")}${a.sensory ? " — " + a.sensory : ""}`));
          }
          state.concepts.forEach((c, i) => {
            const on = state.conceptIds.includes(c.id) ? "  ★ 선택됨" : "";
            L.push("", `${pad2(i + 1)}. ${c.nameKo} / ${c.nameEn}${on}`);
            if (c.moodWords.length) L.push(`  감성 단어: ${c.moodWords.join(" · ")}`);
            if (c.anchor) L.push(`  출발 연상: ${c.anchor}`);
            if (c.subject) L.push(`  대표 장면: ${c.subject}`);
            if (c.visualAnchor) L.push(`  시각 앵커: ${c.visualAnchor}`);
            L.push(`  ${c.definition}`);
            if (c.experience) L.push(`  체감: ${c.experience}`);
          });
          L.push("");
        }

        if (state.perceptions.length) {
          L.push(line, " 2. 지각 특성", line);
          state.perceptions.forEach((p, i) => {

            if (m.params && m.params.length) L.push(`  핵심 수치: ${m.params.join(" · ")}`);

            L.push(`  Haptic: ${m.haptic}`);
            L.push(`  Visual Behavior: ${m.visualBehavior}`);

          });
          L.push("");
        }

        L.push(line, `생성 시각: ${nowLabel(Date.now())}`, line);

        L.push(`11-5. 상태 표시줄의 한글 문구는 각 인터랙션의 '대표 상태' 이름처럼 이번 감성의 말투로 씁니다(예: 고요히 기다리는 중 → 살며시 받아들이는 중 → 손길의 여운이 남아요).`);
        L.push(`12. 결과가 열리는 인터랙션(카드 펼침, 패널 등장 등)은 체험 영역 안의 패널로 열고 × 버튼과 Esc로 닫습니다. 패널 등장 애니메이션도 해당 인터랙션의 스프링 성격을 따릅니다.`);
        L.push(`13. 색 팔레트는 위 색·빛·표면 톤 기준에서 뽑아 CSS 변수로 정의하고, 밝음/어두움 두 테마를 모두 지원합니다. prefers-reduced-motion에서는 진폭을 줄입니다.`);
        L.push(`14. 모든 문구는 한국어 존댓말로, 제목·힌트·상태 문구는 감성 키워드의 분위기에 맞춥니다.`);

        L.push(`- ${list.length}개 인터랙션이 모두 실제로 동작해야 하며, 서로 다른 모션 원리가 손으로 느껴질 만큼 분명히 구별되어야 합니다.`);

      }

      /* =========================================================
         13-B. PDF 리포트 — 분석 내용과 생성 이미지를 함께 담습니다.
         화면 밖에 인쇄용 문서를 만들고 블록 단위로 캡처해 A4에 배치합니다.
         블록 단위로 나누면 문장이 페이지 경계에서 잘리지 않습니다.

      const PDF = {

            <div style="font-size:14px;font-weight:700;color:#64748b;">${esc(k)}</div>

            <div style="position:absolute;left:0;top:2px;font-size:13px;color:#94a3b8;">LOW</div>

            <div style="position:absolute;top:4px;left:calc(34px + (100% - 74px) * ${pct} / 100);width:13px;height:13px;margin-left:-6px;border-radius:50%;background:#1d4ed8;"></div>

          if (state.concepts.length) {
            out.push(PDF.heading("01", "감성 해석", "Emotion"));
            if (state.associations.length) out.push(PDF.card(`<div style="font-size:16px;font-weight:800;">사람들이 먼저 떠올리는 연상</div>${state.associations.map(a => `<div style="margin-top:8px;"><div style="font-size:15px;font-weight:700;">${esc(a.word)}</div><div style="font-size:14px;color:#475569;">${esc(a.objects.join(" · "))}</div>${a.sensory ? `<div style="font-size:14px;color:#64748b;">${esc(a.sensory)}</div>` : ""}</div>`).join("")}`));

                  <span style="font-size:14px;color:#64748b;font-weight:700;margin-left:6px;">${esc(x.category)}</span></div>

          if (state.properties.length) {
            out.push(PDF.heading("03", "인터랙션 물성", "Dynamic Interaction Properties"));
            out.push(PDF.image("property", "인터랙션 물성 통합 이미지"));
            state.properties.forEach((x, i) => {
